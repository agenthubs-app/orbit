<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;left:16px;right:16px;bottom:14px;height:72px;border-radius:36px;display:flex;align-items:center;justify-content:space-around;padding:0 8px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:{{ bg }};border:1px solid {{ border }};box-shadow:{{ shadow }}">
  <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:60px;height:56px;justify-content:center;border-radius:18px;background:{{ homeBg }};color:{{ homeFg }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
    <span style="font-size:11px;font-weight:600">首页</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:60px;height:56px;justify-content:center;border-radius:18px;background:{{ contactsBg }};color:{{ contactsFg }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16 15.5a5 5 0 0 1 5.5 4.5"></path></svg>
    <span style="font-size:11px;font-weight:600">人脉</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;width:64px">
    <div style="width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:{{ centerBg }};box-shadow:{{ centerShadow }};color:#fff">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="5"></circle><path d="M3.5 9.5c-1.5 3 3 8 10 8 6 0 9.5-3 7-6.5"></path><circle cx="19" cy="6" r="1.2" fill="currentColor" stroke="none"></circle></svg>
    </div>
    <span style="font-size:10px;font-weight:700;letter-spacing:.06em;color:{{ centerLabel }}">IORBIT</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:60px;height:56px;justify-content:center;border-radius:18px;background:{{ eventsBg }};color:{{ eventsFg }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
    <span style="font-size:11px;font-weight:600">活动</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:60px;height:56px;justify-content:center;border-radius:18px;background:{{ profileBg }};color:{{ profileFg }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
    <span style="font-size:11px;font-weight:600">我的</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:120},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;glass&quot;,&quot;dark&quot;,&quot;ink&quot;],&quot;default&quot;:&quot;glass&quot;,&quot;tsType&quot;:&quot;'glass'|'dark'|'ink'&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;contacts&quot;,&quot;events&quot;,&quot;profile&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;'home'|'contacts'|'events'|'profile'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'glass';
    const active = this.props.active ?? 'home';
    const T = {
      glass: { bg: 'rgba(255,255,255,0.78)', border: 'rgba(255,255,255,0.95)', shadow: '0 14px 36px rgba(20,60,120,0.16)', fg: '#5B6B82', on: '#0A7BD6', onBg: '#E4F0FF', centerBg: 'linear-gradient(135deg,#0A7BD6,#3FA0FF)', centerShadow: '0 8px 20px rgba(10,123,214,0.45)', centerLabel: '#0A7BD6' },
      dark: { bg: 'rgba(17,24,39,0.88)', border: 'rgba(255,255,255,0.08)', shadow: '0 16px 40px rgba(0,0,0,0.55)', fg: '#8B98AD', on: '#6FA5FF', onBg: 'rgba(79,141,255,0.14)', centerBg: 'linear-gradient(135deg,#3B7BFF,#6FA5FF)', centerShadow: '0 0 28px rgba(79,141,255,0.55)', centerLabel: '#6FA5FF' },
      ink: { bg: '#FFFFFF', border: '#E6E8EE', shadow: '0 10px 28px rgba(11,18,32,0.10)', fg: '#6B7280', on: '#0A5CFF', onBg: '#EEF3FF', centerBg: '#0B1220', centerShadow: 'none', centerLabel: '#0B1220' },
    }[theme];
    const s = (k) => ({ [k + 'Bg']: active === k ? T.onBg : 'transparent', [k + 'Fg']: active === k ? T.on : T.fg });
    return { bg: T.bg, border: T.border, shadow: T.shadow, centerBg: T.centerBg, centerShadow: T.centerShadow, centerLabel: T.centerLabel, ...s('home'), ...s('contacts'), ...s('events'), ...s('profile') };
  }
}
</script>
</body>
</html>
