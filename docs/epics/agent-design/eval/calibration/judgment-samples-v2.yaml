# 判断题的校准样本 v2（agent-design AG08 起，AG09 补 outbound.extra；设计稿 §3.8“置信度怎么用”）。前三题与 v1 逐条相同。
# 全部合成，取自三个夹具世界（base-v1、regular-v1、large-v1）里 dev 组用例用到的人物、活动和笔记，以及按同样的
# 写法改写的同类句子。标注由 AG08 的 Generator 写，按设计稿附录 C 的选项。
#
# group: dev 用来定门槛；val 只用来核对，不据它调门槛（eval/README.md §8）。
# 每题每种语言 dev 至少 20 条；不足 20 条的格子不启用。
# 候选的写法与产品发给判断模型的一致（graph/nodes/functions.ts 的 contactLine / eventLine）。
#
# 标注口径（非保守答案的“误判”）：
# - match.level：答“部分匹配”或“匹配”，而标注是“证据不足”。
# - intent.explicitWrite：答“是”，而标注是“否”。
# - duplicate.same：答“同一件事”或“不同”，而标注不是这一项（标注“说不准”时，任何确定的回答都算误判）。

