      - answer_blocks: { has: [note] }
      - answer_text_plain: true
      - cites: { include: [M37] }
      - cites_within_reads: true
      - request_status: completed
      - no_business_writes: true
      - cards: { count: 0 }
      - no_web_calls: true
    rubric:
      - id: R1
        text: "关于田中的回答在前面，用正文的样子；调研那一段在后面的「这次没做的部分」说明条里，两者分开。"
      - id: R2
        text: "说明条里先写了用户原话里调研的那一段，再写为什么这次没做、建议怎么办，没有假装做了调研。"
      - id: R3
        text: "关于田中的回答说出了 11 月 11 日那篇笔记的要点（最在意交付周期、报价可分两期、月底前看修订版），没有编造。"
    notes: "前半句读笔记 M37 回答；后半句超出 Orbit 现在能做的范围，建议交给通用 Agent。只引用了一篇笔记时，依据行本身能点开它，不另放小卡片。"

  - id: AE-ANS-009
    title: 较大账号问最近有哪些活动：只列还没开始的，卡片不超过二十张
    sprint: AG19
    split: val
