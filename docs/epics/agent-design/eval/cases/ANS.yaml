        text: "六场有开始时间的活动各有一张卡片，按开始时间从早到晚；前五张直接显示，第六张收在「还有 1 场」里。"
      - id: R2
        text: "时间未公布的那场没有被排进先后；提到它时说明了时间未公布。"
