    sprint: AG19
    split: val
    invariant: false
    requirement: [AG-R19]
    design: ["视觉稿第 2 组"]
    locale: zh
    world: base-v1
    steps:
      - user: "下周我有哪些日程？"
    hard:
      - answer_cards: { kinds: [schedule, event, todo], includes: [S11], text_order: true, lead_plain: true }
      - answer_blocks: { first: paragraph, has: [records], lacks: [note, conclusion, points] }
      - answer_text_plain: true
      - cites_within_reads: true
      - request_status: completed
      - no_business_writes: true
      - cards: { count: 0 }
      - no_web_calls: true
    rubric:
      - id: R1
        text: "「和田中午餐」有一张日程卡片，上面有带星期的日期和时间（11 月 19 日周四 12:00）。"
      - id: R2
        text: "回答里说到的每条日程都对得上夹具里下一周（11 月 16 日到 22 日）的记录，没有多出不存在的安排。"
      - id: R3
        text: "卡片上面只有一句导语，说了时间范围和一共几个日程；导语里没有把任何一条日程的名称或时间再写一遍。"
    notes: "时钟是 11 月 15 日周日，下周是 11 月 16 日到 22 日：日程 S10（团队周会，11 月 16 日，每周重复）和 S11（和田中午餐，11 月 19 日）。把那一周的活动或到期的待办一并列出也可以。第 18 版里两端的回答都点不开日程，卡片把入口补上。"

  - id: AE-ANS-007
    title: 讨论类的问题：结论一句，后面分点，由程序排版，不出现星号井号
    sprint: AG19
    split: dev
    invariant: false
    requirement: [AG-R19]
    design: ["视觉稿第 5 组", "D4"]
    locale: zh
    world: base-v1
    steps:
      - user: "下周要第一次拜访一家新客户，帮我想想要准备什么，分几点说。"
    hard:
      - answer_blocks: { first: conclusion, has: [conclusion], lacks: [note, records] }
      - answer_text_plain: true
      - answer_cards: { none: true }
      - no_private_reads: true
      - request_status: completed
      - no_business_writes: true
      - cards: { count: 0 }
      - no_web_calls: true
    rubric:
      - id: R1
        text: "第一句是一句完整的结论或总的建议，后面分成几条要点或几个短段，每条只讲一件事。"
      - id: R2
        text: "回答没有声称查过用户的记录，也没有提到任何具体的客户、联系人或待办。"
    notes: "不涉及用户的记录，所以没有卡片。模型只按「结论、段落、要点」填字，加粗和分点由程序画；第一层直接给出的长回答没有结构，回答步骤会按结构重写一次。视觉稿第 5 组：最多列 5 点，再多就并成段，所以要点超过 5 条时显示成短段，这里不要求一定有要点块。"

  - id: AE-ANS-008
    title: 一半答了、一半没做：回答在上，没做的部分单独成一块说明
    sprint: AG19
    split: dev
    invariant: false
    requirement: [AG-R19]
    design: ["视觉稿第 4 组"]
    locale: zh
    world: base-v1
    steps:
