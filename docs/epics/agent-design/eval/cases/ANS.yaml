  - id: AE-ANS-011
    title: 不说「最近」，只问有哪些活动适合我：也只列还没开始的，最近的在前
    sprint: AG19
    split: val
    invariant: false
    requirement: [AG-R19]
    design: ["AG19-6", "协调者决定 3（2026-11-20）"]
    locale: zh
    account: regular
    world: regular-v1
    steps:
      - user: "有哪些活动适合我？"
    hard:
      - answer_cards: { kinds: [event], min: 3, includes: [RE03], excludes: [RE06, RE08], text_order: true, lead_plain: true }
      - answer_blocks: { has: [records], lacks: [note] }
      - answer_text_plain: true
      - clarifications: { count: 0 }
      - request_status: completed
      - no_business_writes: true
      - cards: { count: 0 }
      - no_web_calls: true
    rubric:
      - id: R1
