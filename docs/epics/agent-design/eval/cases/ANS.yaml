        text: "导语写明列的是还没开始的活动，并说了一共多少场、这次先列几场。"
    interference: [similar_records, cross_page]
    notes: "修复第 1 轮（协调者决定 3）：凡是让推荐或列出可以去的活动，只要用户的话没有指向过去（去过、之前、上个月、一个已经过去的日期），就只取还没开始的活动、最近的在前，并在导语里说明。常规账号的 60 场平台活动里一半已经办完；RE06 是 10 月 17 日那一期，RE08 时间未公布。还没开始的里最早的是 RE03（11 月 21 日 10:00）。"
