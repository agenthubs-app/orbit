      - functions_called: [fn.extractFollowUps]
      - private_reads_within: [M39, C40]
      - cites_within_reads: true
      - clarifications: { count: 0 }
      - model_calls_max: 4
      - no_web_calls: true
    rubric:
      - id: R1
        text: "回答说明这篇笔记里没有本人已经答应要做的事。"
      - id: R2
        text: "发 dashboard spec 被列为 Emily 的承诺，期限是周五之前，并引用了原句。"
      - id: R3
        text: "考虑要不要加入 beta 被标为仅供考虑，没有算作本人的承诺。"
      - id: R4
        text: "回答用的是英语。"

  - id: AE-FN-013
    title: 同一篇笔记里计划某天做和最迟某天各一项，分开保留；再整理一次不重复新增
    sprint: AG10
    split: dev
