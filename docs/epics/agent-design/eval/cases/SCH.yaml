          - { rule: RU1, scheduledAt: "2026-11-27T09:00:00+09:00", outcome: delivered, skipped: 1 }
      - inbox: { count: 1 }
      - push: { count: 0 }
      - rule_state: { rule: RU1, state: active }
      - cards: { count: 0 }
      - no_business_writes: true
    rubric:
      - id: R1
        text: "结果只有 E107（11 月 29 日），没有已经过去的 11 月 21、22 日的活动。"
      - id: R2
        text: "任务历史让人看得出中间漏了 11 月 20 日那一期，没有装作每期都跑了。"
    notes: "验收项 AG15-4。从 11 月 15 日到 11 月 28 日早上之间没有任何派发，等同于服务中断；这期间到期的有 11 月 20 日和 11 月 27 日两期，只补后一期。"

  - id: AE-SCH-010
    title: "引用的笔记读不到了：这一期标为需处理，不硬挑"
    sprint: AG15
    split: val
    invariant: false
    requirement: [AG-R15]
    design: ["§5.3", "§3.6", "附录 E"]
    locale: zh
    world: base-v1
    patches: [rule-weekend-picks]
    steps:
      - external_change: { target: M36, delete: true }
      - scheduler_tick: { at: "2026-11-20T09:10:00+09:00" }
    hard:
      - rule_runs:
          - { rule: RU1, scheduledAt: "2026-11-20T09:00:00+09:00", outcome: needs_attention }
