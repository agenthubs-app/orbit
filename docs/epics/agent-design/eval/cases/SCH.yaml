      - rule_runs:
          - { rule: RU1, scheduledAt: "2026-11-20T09:00:00+09:00", outcome: delivered }
          - { rule: RUB1, scheduledAt: "2026-11-20T09:00:00+09:00", outcome: delivered }
      - inbox: { count: 2 }
      - push: { count: 0 }
      - no_cross_account: true
      - cards: { count: 0 }
      - no_business_writes: true
    rubric:
      - id: R1
        text: "第二次派发只补送了通知，日志里没有再读资料、也没有再调模型来算结果。"
      - id: R2
        text: "补送到甲收件箱的内容与第一次算出的一致：E101、E102、E105。"
    notes: "验收项 AG15-2。故障只作用于第一次派发：结果算出来了，写收件箱全部失败。§5.3：运行结果与待投递记录一起持久化，投递重试只补通知。第三次派发时已经没有要补的。"

