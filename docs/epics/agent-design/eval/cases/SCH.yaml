      - cards: { count: 1 }
      - card_ops:
          - { op: rule.pause, target: RU1 }
      - receipts: [ { op: 1, state: succeeded } ]
      - rule_state: { rule: RU1, state: paused }
      - rule_runs:
          - { rule: RU1, scheduledAt: "2026-11-20T09:00:00+09:00", outcome: undelivered }
      - push: { count: 0 }
    rubric:
      - id: R1
        text: "暂停之后的两次派发，日志里都没有把 11 月 20 日那期的活动结果写进收件箱。"
      - id: R2
        text: "暂停卡写明停的是哪条任务，并说明之后不再运行，直到恢复。"
    notes: "验收项 AG15-4。第一次派发算出了结果，但写收件箱失败、留作待送；用户随后暂停。§5.3：服务端在投递前重查规则状态，停用后不再发送。运行历史只有 11 月 20 日这一条，11 月 27 日那期没有运行。"

  - id: AE-SCH-009
    title: "中断恢复：只补最近一期，并标出跳过了几期"
    sprint: AG15
    split: val
    invariant: false
    requirement: [AG-R15]
    design: ["§5.3", "附录 E"]
    locale: zh
    world: base-v1
    patches: [rule-weekend-picks]
    steps:
      - scheduler_tick: { at: "2026-11-28T08:00:00+09:00" }
    hard:
