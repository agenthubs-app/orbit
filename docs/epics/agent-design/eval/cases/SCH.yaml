  - id: AE-SCH-011
    title: "卡放满七天被定时器标为过期：点了不执行，重新生成后仍要再点"
    sprint: AG15
    split: val
    invariant: false
    requirement: [AG-R15, AG-R02]
    design: ["§5.2", "§5.3", "附录 D"]
    locale: zh
    world: base-v1
    steps:
      - user: "把「约山本吃饭」这条待办的计划日定在 11 月 30 日。"
      - advance_clock: { to: "2026-11-22T10:20:00+09:00" }
      - scheduler_tick: { at: "2026-11-22T10:20:00+09:00" }
      - click: { card: last, decision: confirm }
      - regenerate: { card: last }
    hard:
      - no_business_writes: true
      - decisions: { count: 0 }
      - decision_result: { reason: CARD_EXPIRED }
      - card_revision: { card: last, min: 2 }
      - card_state: { card: last, state: awaiting_confirmation }
      - card_ops:
          - { op: todo.update, target: T47, set: { plannedDate: "2026-11-30" } }
    rubric:
      - id: R1
        text: "点过期卡之后看到的是“这张卡放太久了，要重新生成一张吗？”这类说法。"
      - id: R2
        text: "点过期卡之后的提示没有说“已修改”。"
      - id: R3
        text: "重新生成的卡上日期带星期：11 月 30 日（周一）。"
    notes: "验收项 AG15-5。卡在 11 月 15 日 10:00 出，11 月 22 日 10:00 到期；一次性定时器随 10:20 的派发触发。重新生成沿用原来的修改、出新一版，结束时仍在等确认，T47 没有变。"

  - id: AE-SCH-012
    title: "定时任务产生的卡，在收件箱里确认"
    sprint: AG15
    split: dev
    invariant: false
    requirement: [AG-R15, AG-R02]
    design: ["§5.1", "§5.3", "§10", "附录 E"]
    locale: zh
    world: base-v1
    patches: [rule-monday-replan]
    steps:
      - scheduler_tick: { at: "2026-11-16T09:10:00+09:00" }
      - click: { card: last, decision: confirm }
    hard:
      - no_write_before_click: true
      - cards: { count: 1 }
      - card_ops:
