      - scheduler_tick: { at: "2026-11-17T09:10:00+09:00" }
      - external_change: { target: E106, set: { startsAt: "2026-11-28T14:00:00+09:00", venue: 六本木, topics: [AI, 摄影] } }
      - scheduler_tick: { at: "2026-11-18T09:10:00+09:00" }
    hard:
      - rule_runs:
          - { rule: RU2, scheduledAt: "2026-11-16T09:00:00+09:00", outcome: delivered }
          - { rule: RU2, scheduledAt: "2026-11-17T09:00:00+09:00", outcome: no_match }
          - { rule: RU2, scheduledAt: "2026-11-18T09:00:00+09:00", outcome: delivered }
      - inbox: { count: 2 }
      - push: { count: 0 }
      - cards: { count: 0 }
    rubric:
      - id: R1
        text: "第一期的结果是 E101、E102、E107 三场。"
      - id: R2
        text: "第三期的结果只有 E106 一场，没有再出现 E101、E102、E107。"
      - id: R3
        text: "第二期在任务历史里记的是“没有新的”这类说法，没有写成失败。"
    notes: "验收项 AG15-3。第二期的候选全是上一期告知过的，所以不进收件箱。第二期之后主办方给 E106 公布了时间（11 月 28 日周六）并补了摄影主题，第三期只告知这一场。"

  - id: AE-SCH-007
    title: "连续三周：没有活动的那一期不进收件箱、不提醒"
    sprint: AG15
    split: val
    invariant: false
    requirement: [AG-R15]
    design: ["§5.3", "§6"]
    locale: zh
    world: base-v1
    patches: [rule-weekend-picks]
    steps:
      - scheduler_tick: { at: "2026-11-20T09:10:00+09:00" }
      - scheduler_tick: { at: "2026-11-27T09:10:00+09:00" }
      - scheduler_tick: { at: "2026-12-04T09:10:00+09:00" }
    hard:
      - rule_runs:
          - { rule: RU1, scheduledAt: "2026-11-20T09:00:00+09:00", outcome: delivered }
          - { rule: RU1, scheduledAt: "2026-11-27T09:00:00+09:00", outcome: delivered }
          - { rule: RU1, scheduledAt: "2026-12-04T09:00:00+09:00", outcome: no_match }
      - inbox: { count: 2 }
      - push: { count: 0 }
      - cards: { count: 0 }
      - no_business_writes: true
    rubric:
      - id: R1
        text: "第二期的结果只有 E107（11 月 29 日的东京摄影展·冬季场）。"
      - id: R2
        text: "时间未公布的 E106 没有被当成周末活动放进任何一期的结果。"
    notes: "验收项 AG15-3。第三期对应的周末（12 月 5、6 日）没有任何平台活动，只在任务历史留一条记录。"

  - id: AE-SCH-008
    title: "暂停之后，还没送出的那一期不再送，下一期也不跑"
    sprint: AG15
    split: dev
    invariant: false
    requirement: [AG-R15]
    design: ["§5.3", "附录 A", "附录 B"]
    locale: zh
    world: base-v1
    patches: [rule-weekend-picks]
    steps:
      - fault: { where: notify.inbox, kind: fail_always }
      - scheduler_tick: { at: "2026-11-20T09:10:00+09:00" }
      - user: "把「每周五挑三场周末活动」这条定时任务先暂停。"
      - click: { card: last, decision: confirm }
      - scheduler_tick: { at: "2026-11-20T09:20:00+09:00" }
      - scheduler_tick: { at: "2026-11-27T09:10:00+09:00" }
    hard:
