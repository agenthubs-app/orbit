      - click: { card: last, decision: confirm }
    hard:
      - no_write_before_click: true
      - cards: { count: 1 }
      - card_revision: { card: last, min: 2 }
      - card_ops:
          - { op: todo.complete, target: ST04 }
      - writes_exact: same_as_card
      - decisions: { count: 1 }
      - receipts: [ { op: 1, state: succeeded } ]
      - no_web_calls: true
    rubric:
      - id: R1
        text: "回答说出周五（11 月 20 日）15:00 到 16:00 和沈博文喝咖啡（SS03）。"
      - id: R2
        text: "去掉一项之后，卡上的总数从 2 项变成了 1 项。"
    notes: "去掉一项只出新版本，不算决定；确认的是剩下的那一项。"

