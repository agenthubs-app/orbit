        text: "卡片或回答引用了支持这两项的原句（Priya 来电那句、我答应发修订方案那句）。"
      - id: R2
        text: "第二次请求的回应指出这次来电和这条待办都已经记过。"
    notes: "Marcus 只是被提到，不登记往来；Priya 答应发密钥是对方的承诺，不进我的待办。这两点由 card_ops 恰好两项来卡住。"

  - id: AE-SEAL-015
    title: "完成一条待办、新增一条待办、问周五安排；在卡上去掉一项再确认"
    category: 3
    sprint: AG18
    split: sealed
