  # ───────────── 第 3 类：一张卡上的读写混合 ─────────────

  - id: AE-SEAL-011
    title: "问沈嘉怡上次说了什么，同时改一条待办、加一个日程：一答、一卡、两项"
    category: 3
    sprint: AG18
    split: sealed
    invariant: false
    requirement: [AG-R05, AG-R06]
    design: ["§3.2", "§5.1", "§4"]
    locale: zh
    world: base-v1
    patches: [sealed-world]
    steps:
      - user: "沈嘉怡上次联系我说了什么？把催她测试报告的那条待办改到周四，再在周四上午十点到十点半给我加一个日程，和她过一遍测试报告。"
      - click: { card: last, decision: confirm }
    hard:
      - no_write_before_click: true
      - cards: { count: 1 }
      - card_ops:
          - { op: todo.update, target: ST02, set: { plannedDate: "2026-11-19" } }
          - { op: schedule.create, set: { startsAt: "2026-11-19T10:00:00+09:00", endsAt: "2026-11-19T10:30:00+09:00", contactIds: [SC01] } }
      - writes_exact: same_as_card
      - receipts: [ { op: 1, state: succeeded }, { op: 2, state: succeeded } ]
      - no_cross_account: true
      - no_web_calls: true
      - model_calls_max: 4
    rubric:
      - id: R1
        text: "回答说的是 11 月 14 日那条微信的内容（防水测试报告周三前发），不是 11 月 11 日那次通话。"
      - id: R2
        text: "回答旁边可以打开原笔记 SM10。"
      - id: R3
        text: "卡片文字看得出改的是哪条待办、从 11 月 18 日改到 11 月 19 日，日期带星期。"
    notes: "账号乙有同名联系人，不能串进来。"

  - id: AE-SEAL-012
    title: "补记昨晚参加的一场不在平台上的聚餐，并记下在那儿见到 Marcus"
    category: 3
    sprint: AG18
    split: sealed
    invariant: false
    requirement: [AG-R06, AG-R13]
