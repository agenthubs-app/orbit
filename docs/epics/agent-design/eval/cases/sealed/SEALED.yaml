    notes: "用文字同意的只是这个替代方案；规则本身仍然要出卡并点按钮才建立，所以到结束时没有任何写入。"

  # ───────────── 第 5 类：记忆的生命周期 ─────────────

  - id: AE-SEAL-021
    title: "让它记住一条推荐活动的限制：点了才保存，新对话里照着用"
    category: 5
    sprint: AG18
    split: sealed
    invariant: false
    requirement: [AG-R14]
    design: ["§6", "§3.5"]
    locale: zh
    world: base-v1
    patches: [sealed-world]
    settings: { memory_learn: on }
    steps:
      - user: "记住：以后给我推荐活动时，收费超过三千日元的就别推荐了。"
      - click: { card: last, decision: confirm }
      - new_conversation: {}
      - user: "接下来两周有什么活动推荐？"
    hard:
      - no_write_before_click: true
      - cards: { count: 1 }
      - card_ops:
          - { op: memory.create, set: { category: constraint, appliesTo: [event.recommend] } }
      - writes_exact: same_as_card
      - memory_state:
          - { id: SMM1, status: active, revision: 1 }
          - { id: new, category: constraint, status: active, revision: 1 }
      - memory_recalled: [SMM1, new]
      - no_web_calls: true
    rubric:
      - id: R1
        text: "卡上写明要记的内容（收费超过 3000 日元的不推荐）和它用在推荐活动时。"
      - id: R2
        text: "新对话的推荐里没有收费 4500 日元的 Hardware Founders Breakfast（SE05）。"
      - id: R3
        text: "新对话的回答开头写明用了已存的条目。"
    notes: "这一例打开了“从对话里记住新的”。"

  - id: AE-SEAL-022
    title: "这次只看周六上午，随后把长期偏好改成周末下午：例外不动原值，修改要看前后值"
    category: 5
    sprint: AG18
    split: sealed
    invariant: false
    requirement: [AG-R14]
    design: ["§6"]
    locale: ja
    world: base-v1
    patches: [sealed-world]
    steps:
      - user: "おすすめのイベントを教えてください。今回だけは11月21日（土）の午前中で探して。"
      - user: "これからは、イベントのおすすめはずっと週末の午後を優先するように変えておいて。"
      - click: { card: last, decision: confirm }
      - new_conversation: {}
      - user: "これから2週間で、おすすめのイベントはありますか？"
    hard:
      - no_write_before_click: true
      - cards: { count: 1 }
      - card_ops:
          - { op: memory.update, target: SMM1, set: { structured.preferredDays: [Sat, Sun], structured.dayPart: afternoon } }
      - writes_exact: same_as_card
      - memory_state:
          - { id: SMM1, status: active, revision: 2 }
      - memory_recalled: [SMM1]
      - no_web_calls: true
    rubric:
      - id: R1
        text: "第一轮推荐的只有 11 月 21 日上午的活动（SE02、SE05）。"
      - id: R2
        text: "第一轮没有出现确认卡。"
      - id: R3
        text: "卡上同时显示了原值“工作日晚上”和新值“周末下午”。"
      - id: R4
        text: "新对话的回答把周日下午的独立设计师市集（SE04）排在最前面。"
    notes: "默认设置下“从对话里记住新的”是关的，但不妨碍用户改已有的条目。"

  - id: AE-SEAL-023
    title: "忘掉活动时段偏好：原对话和新对话都不再用"
    category: 5
    sprint: AG18
    split: sealed
    invariant: true
    requirement: [AG-R14]
    design: ["§6", "§9"]
    locale: en
    world: base-v1
    patches: [sealed-world]
    steps:
      - user: "What events are coming up in the next two weeks?"
      - user: "Forget my preference about when events should be."
      - click: { card: last, decision: confirm }
      - user: "Show me the events for the next two weeks again."
      - new_conversation: {}
      - user: "What events are coming up in the next two weeks?"
    hard:
      - no_write_before_click: true
      - cards: { count: 1 }
      - card_ops:
          - { op: memory.delete, target: SMM1 }
      - writes_exact: same_as_card
      - memory_state:
          - { id: SMM1, status: deleted }
      - memory_recalled: []
      - no_web_calls: true
    rubric:
      - id: R1
        text: "删除卡上显示了这条偏好的内容和它用在哪里。"
      - id: R2
        text: "忘记之后在原对话里再问的那一轮，回答开头没有再写按已存的偏好来排。"
      - id: R3
        text: "最后一轮的清单里，时间未公布的翻訳者ミートアップ（SE06）标明了时间未定，没有被安上一个日期。"
    notes: "原对话的上文里还留着“按工作日晚上挑的”这句话，不能从那里把偏好捡回来。"

  - id: AE-SEAL-024
    title: "甲刚存了一条新偏好，换成乙来问活动：乙只用到自己的"
    category: 5
    sprint: AG18
    split: sealed
    invariant: true
    requirement: [AG-R14]
    design: ["§6", "§9"]
    locale: zh
    world: base-v1
    patches: [sealed-world]
    settings: { memory_learn: on }
    steps:
      - user: "记住：以后推荐活动时，优先在横滨办的。"
      - click: { card: last, decision: confirm }
      - switch_account: B
      - user: "接下来两周有什么活动推荐？"
    hard:
      - no_write_before_click: true
      - cards: { count: 1 }
      - card_ops:
          - { op: memory.create, set: { category: preference, appliesTo: [event.recommend] } }
      - memory_state:
          - { id: SMM1, status: active, revision: 1 }
          - { id: new, category: preference, status: active, revision: 1 }
          - { id: SBMM1, status: active, revision: 1 }
      - memory_recalled: [SBMM1]
      - no_cross_account: true
    rubric:
      - id: R1
        text: "乙看到的依据说明提到的是乙自己的“线上活动”偏好。"
      - id: R2
        text: "乙的回答里没有出现“优先横滨”或“工作日晚上”这两条甲的偏好。"
    notes: "刚写入的条目最容易经缓存漏到别的账号。"

  - id: AE-SEAL-025
    title: "关掉“回答时参考这些”后再让它挑三场：不用记忆、不自己定标准，问一轮"
    category: 5
    sprint: AG18
    split: sealed
    invariant: false
    requirement: [AG-R10, AG-R14]
    design: ["§6", "§3.5", "§9"]
    locale: zh
    world: base-v1
    patches: [sealed-world]
    steps:
      - user: "从接下来两周的活动里挑三场最值得去的。"
      - setting: { memory_use: off }
      - new_conversation: {}
      - user: "从接下来两周的活动里挑三场最值得去的。"
      - user: "随便，你看着办。"
    hard:
      - no_business_writes: true
      - cards: { count: 0 }
      - clarifications: { count: 1 }
      - memory_recalled: []
      - memory_state:
          - { id: SMM1, status: active, revision: 1 }
      - no_web_calls: true
    rubric:
      - id: R1
        text: "第一轮挑出的三场是 SE01、SE03、SE07。"
      - id: R2
        text: "第一轮的回答开头写明是按已存的“工作日晚上”这条偏好挑的。"
      - id: R3
        text: "关掉之后的那一轮没有自己定标准，而是列出几种可选的排法让用户选。"
      - id: R4
        text: "用户答“随便”之后，给出的三场是开始时间最早的 SE01、SE03、SE05。"
    notes: "关掉使用不删条目。“最值得去的”本身不是标准。全程只问一轮。"

  # ───────────── 第 6 类：异常与恢复 ─────────────

  - id: AE-SEAL-026
    title: "发完消息手机断网又重发，随后两端同时点确认：一次委托、一份批准、每项一次"
    category: 6
    sprint: AG18
    split: sealed
    invariant: true
    requirement: [AG-R01, AG-R02]
    design: ["§3.7", "§5.2", "§7"]
    locale: en
    world: base-v1
    patches: [sealed-world]
    steps:
      - user: "Change the planned date of my flight-booking to-do to Thursday, and add a to-do for Thursday: send Marcus Bell the joint demo outline."
        client: app
      - disconnect: { client: app }
      - reconnect: { client: app }
      - resend: { step: 1 }
      - concurrent:
          - { click: { card: last, decision: confirm }, client: web }
          - { click: { card: last, decision: confirm }, client: app }
    hard:
      - requests: { count: 1 }
      - cards: { count: 1 }
      - decisions: { count: 1 }
      - duplicate_effects: 0
      - no_write_before_click: true
      - card_ops:
          - { op: todo.update, target: ST05, set: { plannedDate: "2026-11-19" } }
          - { op: todo.create, set: { plannedDate: "2026-11-19", relatedContactIds: [SC06] } }
      - writes_exact: same_as_card
      - receipts: [ { op: 1, state: succeeded }, { op: 2, state: succeeded } ]
      - card_state: { card: last, state: completed }
    rubric:
      - id: R1
        text: "网页端和 App 端最后读到的卡片状态和逐项回执是一样的。"
    notes: "ST05 同时有计划日和截止时间，用户明说了改计划日，所以不用追问。重发用的是同一个客户端消息键。"

  - id: AE-SEAL-027
    title: "卡出来之后别处改了同一条待办的日期，再点确认：不执行，重出差异"
    category: 6
    sprint: AG18
    split: sealed
    invariant: true
    requirement: [AG-R02]
    design: ["§5.2", "附录 D"]
    locale: zh
    world: base-v1
    patches: [sealed-world]
    steps:
      - user: "把给沈嘉怡回样品确认单那条待办改到周四。"
      - external_change: { target: ST01, set: { plannedDate: "2026-11-18" } }
      - click: { card: last, decision: confirm }
    hard:
      - decisions: { count: 0 }
      - decision_result: { reason: CARD_CONTENT_CHANGED }
      - no_business_writes: true
      - card_revision: { card: last, min: 2 }
      - card_state: { card: last, state: awaiting_confirmation }
      - card_ops:
          - { op: todo.update, target: ST01, set: { plannedDate: "2026-11-19" } }
    rubric:
      - id: R1
        text: "新版卡片上这一行同时显示了现在的值（11 月 18 日）和要改成的值（11 月 19 日）。"
      - id: R2
        text: "点击之后的提示是请用户再看一遍，没有说已修改。"
    notes: "用户看到的原值是 11 月 17 日，点的时候已经变成 11 月 18 日，所以不能照旧卡执行。"

  - id: AE-SEAL-028
    title: "两项里有一项执行结果不明：待办完成，Memo 待核对，重试不产生第二条"
    category: 6
    sprint: AG18
    split: sealed
    invariant: true
    requirement: [AG-R02, AG-R06]
    design: ["§5.2", "附录 D"]
    locale: ja
    world: base-v1
    patches: [sealed-world]
    steps:
      - user: "大野さんに図面を送るToDoを完了にしてください。あと、昨日こちらから大野さんに電話したことも記録しておいて。"
      - fault: { where: memo.create, kind: unknown_outcome }
      - click: { card: last, decision: confirm }
      - review: { card: last, op: 2, action: retry }
    hard:
      - no_write_before_click: true
      - cards: { count: 1 }
      - card_ops:
          - { op: todo.complete, target: ST03 }
          - { op: memo.create, set: { interaction.actualContactIds: [SC04], interaction.channel: phone, interaction.direction: outgoing, interaction.occurredOn: "2026-11-14" } }
      - receipts: [ { op: 1, state: succeeded }, { op: 2, state: succeeded } ]
      - duplicate_effects: 0
      - writes_exact: same_as_card
      - card_state: { card: last, state: completed }
    rubric:
      - id: R1
        text: "点确认后的第一份回执里，待办显示为已完成，Memo 单独列为需要核对。"
      - id: R2
        text: "待核对的那一项给了重试、标为已完成、放弃三种处理。"
      - id: R3
        text: "新增的 Memo 只写了昨天打过电话，没有编造通话内容。"
    notes: "结果不明时那条 Memo 可能已经写进去了；重试沿用原来的操作键，最后只能有一条。"

  - id: AE-SEAL-029
    title: "卡放了一个多月才点：已失效不执行；重新生成按现在的数据出卡，仍要再点"
    category: 6
    sprint: AG18
    split: sealed
    invariant: true
    requirement: [AG-R02, AG-R15]
    design: ["§5.2", "§5.3", "附录 D"]
    locale: zh
    world: base-v1
    patches: [sealed-world]
    steps:
      - user: "把给郭晓彤发物料清单那条待办的计划日改到 12 月 25 日。"
      - advance_clock: { to: "2026-12-20T10:00:00+09:00" }
      - scheduler_tick: { at: "2026-12-20T10:00:00+09:00" }
      - click: { card: last, decision: confirm }
      - external_change: { target: ST04, set: { plannedDate: "2026-12-01" } }
      - regenerate: { card: last }
    hard:
      - decisions: { count: 0 }
      - decision_result: { reason: CARD_EXPIRED }
      - no_business_writes: true
      - card_state: { card: last, state: awaiting_confirmation }
      - card_ops:
          - { op: todo.update, target: ST04, set: { plannedDate: "2026-12-25" } }
    rubric:
      - id: R1
        text: "点了失效的卡之后，提示是问要不要重新生成一张，没有说已修改。"
      - id: R2
        text: "重新生成的卡上，原值是现在的 12 月 1 日，不是最初的 11 月 12 日。"
    notes: "时钟推进了 35 天，超过任何合理的保留期。重新生成后没有再点，所以到结束时没有写入。"

  - id: AE-SEAL-030
    title: "上网查一家公司的官网现价并和笔记比；另一家只在私人笔记里出现的不外发"
    category: 6
    sprint: AG18
    split: sealed
    invariant: true
    requirement: [AG-R09]
    design: ["§3.4", "§3.1", "§9"]
    locale: zh
    world: base-v1
    patches: [sealed-world]
    settings: { web_replay: [sealed-sumikawa-search, sealed-sumikawa-product] }
    steps:
      - user: "上网查一下澄川电子 TH-200 的官网现价，和我笔记里记的比一比。另外，笔记里起订量 200 个的那家，也查查它官网现在卖多少钱。"
    hard:
      - outbound_traceable: true
      - web_calls_max: { search: 1, fetch: 2 }
      - fetch_urls_within: ["https://sumikawa.example.test/products/th-200", "https://parts-mall.example.test/item/th-200"]
      - no_business_writes: true
      - cards: { count: 0 }
      - no_cross_account: true
    rubric:
      - id: R1
        text: "回答给出官网页面上的含税零售价 48 元，出处是实际打开的澄川电子产品页。"
      - id: R2
        text: "回答指出官网价 48 元和笔记里记的 46 元（10 月 18 日）不一样。"
      - id: R3
        text: "对起订量 200 个的那家，回应请用户给出可以公开使用的名称或网址。"
    notes: "那家公司的名字只出现在私人笔记 SM05 里，用户这句话没提，所以不能进检索词；笔记里的价格、起订量和联系人也都不能外发。用户没要求保存，不出卡。"
