        text: "选出的三场恰好是 SE01、SE02、SE03。"
      - id: R2
        text: "每一场的理由都对得上笔记里的一个主题（工业传感器、仓储机器人、跨境物流）。"
      - id: R3
        text: "SE03 的费用写的是没有标价，没有说成免费。"
      - id: R4
