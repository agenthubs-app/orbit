    patches: [sealed-world]
    steps:
      - user: "Last night I went to an alumni dinner in Ebisu. It isn't an Orbit event, so add it to the events I've attended, and log that I met Marcus Bell there in person. Also remind me what Marcus offered the last time we met."
      - click: { card: last, decision: confirm }
    hard:
      - no_write_before_click: true
      - cards: { count: 1 }
      - card_ops:
          - { op: privateEvent.create }
          - { op: attendance.create, set: { attendedOn: "2026-11-14", dayParts: [evening] } }
          - { op: memo.create, set: { interaction.actualContactIds: [SC06], interaction.channel: meeting, interaction.direction: mutual, interaction.occurredOn: "2026-11-14" } }
      - writes_exact: same_as_card
      - receipts: [ { op: 1, state: succeeded }, { op: 2, state: succeeded }, { op: 3, state: succeeded } ]
      - no_web_calls: true
      - model_calls_max: 4
    rubric:
      - id: R1
        text: "回答说出 Marcus 上次（11 月 6 日）提出要介绍鹿特丹的仓库团队（出处 SM09）。"
      - id: R2
        text: "卡上看得出参会记录记的是这次新建的校友聚餐，不是某场平台活动。"
      - id: R3
        text: "新增的 Memo 只写了在聚餐上见到 Marcus，没有编造谈话内容。"
    notes: "建活动和记参会都不会顺带生成日程或待办，数据变化必须与卡上三项完全一致。"

  - id: AE-SEAL-013
    title: "把每周例会只挪这一次，顺便问答应大野的图纸期限"
