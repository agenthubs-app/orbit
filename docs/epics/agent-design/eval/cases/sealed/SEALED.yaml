# 封存验收集。实现会话不要打开本文件，见同目录 README.md。
# 全部是合成数据，人物、公司、网址都是虚构的。
#
# 本文件的写法约定（步骤和判定都取自 eval/README.md §3.1、§3.2）：
# - 每一例都用 world: base-v1 加 patches: [sealed-world]。sealed-world 是整体替换，用了之后
#   base-v1 里的人物、笔记、待办、日程和平台活动都不再存在。
# - 时钟缺省为 2026-11-15T10:00:00+09:00（周日）。11-16 周一，11-17 周二，11-18 周三，
#   11-19 周四，11-20 周五，11-21 周六，11-22 周日，11-24 周二。
# - select 选的是一条记录时，option 写那条记录的编号。
# - card_ops 的 set 只列必须相符的字段，文字类字段（标题、正文）不列。
#   待办关联的人写作 relatedContactIds；夹具里的 contactId 是它的旧单值写法。
# - memory_state 列出结束时的全部记忆条目；id: new 指本例新建的那一条。
#   memory_recalled 看的是最后一轮。
# - fault 的 where 写受影响的那一项操作。
# - external_change 是模拟别处的修改，不算被测 Agent 的业务写入。
# - 用到联网回放的用例在 settings.web_replay 里点名，回放定义在 sealed-world 里。

area: SEALED

proposed_checks:
  - name: answer_excludes
    meaning: "最后一轮的回应（回答文字和卡片上的可见文字）里不含列出的任何一个片段。写法：answer_excludes: [片段, ...]"

