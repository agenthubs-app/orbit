# REF 区：两端用 @ 指定上下文。AG11 的门槛用例，共 6 例。
#
# 本文件的写法约定（都在 README 词表之内，只是把词表没写死的取值定下来）：
# - refs 每项给出 type、id、quote。type 用设计稿附录 C 的实体名：contact、memo、todo、schedule、event、attendance。
# - 两个标记文字相同时，refs 的先后对应它们在句中出现的先后。
# - “移除标记”在运行器这一层的表现是：下一条消息的 refs 里不再有它。
# - private_reads_within 列的是“允许读到的记录”，比实际需要略宽；用它的目的是把没选中的记录排除在外。
# - revoke 是运行器模拟的外部动作，不算被测系统的业务写入。

area: REF

proposed_checks:
  - name: cites
    form: "cites: { include: [<记录>, ...], exclude: [<记录>, ...] }"
    meaning: "最后一次回答的引用必须包含 include 里的每条记录，并且不含 exclude 里的任何一条。两项可以只写一项。"
  - name: gaps
    form: "gaps: [ { quote: \"<原话片段>\", reason: <原因> }, ... ]"
    meaning: "含这段原话的子目标在结果文档里标出的缺口原因。原因用设计稿附录 C 的取值：no_record、partial、unreadable、service_error。"

proposed_steps: []

new_patches:
  two-interview-memos:
    summary: 多一篇同样叫「客户访谈」的笔记，用来检验同名记录按编号区分
    add:
      memos:
        - { id: M61, version: 1, createdAt: "2026-11-13T17:00:00+09:00", title: 客户访谈, contactIds: [C46], body: "王强说他们最在意售后响应速度，希望合同里写明四小时内答复。" }

cases:
  - id: AE-REF-001
    title: "网页端 @ 笔记、联系人、待办：先给建议，要改时才出卡，不点不写"
    sprint: AG11
    gate: AG14
    split: dev
    invariant: true
    requirement: [AG-R11]
    design: ["§3.6", "§5.1"]
    locale: zh
    world: base-v1
    steps:
      - user: "根据 @客户访谈，帮我给 @田中浩 的 @回复田中的询价 提个修改建议。"
        client: web
        refs:
          - { type: memo, id: M37, quote: "@客户访谈" }
          - { type: contact, id: C30, quote: "@田中浩" }
          - { type: todo, id: T44, quote: "@回复田中的询价" }
      - user: "那就把 @回复田中的询价 的截止时间改到 11 月 20 日下午六点。"
        client: web
        refs:
          - { type: todo, id: T44, quote: "@回复田中的询价" }
    hard:
      - no_business_writes: true
      - private_reads_within: [M37, C30, T44, F1, S11]
      - cites_within_reads: true
      - order: [answer, card]
      - cards: { count: 1 }
      - card_ops:
          - { op: todo.update, target: T44, set: { dueAt: "2026-11-20T18:00:00+09:00" } }
      - card_state: { card: last, state: awaiting_confirmation }
      - decisions: { count: 0 }
      - memory_state: []
      - no_web_calls: true
    rubric:
      - id: R1
        text: "第一轮的建议引用了笔记「客户访谈」里的内容（交付周期、分两期或月底前看修订版）。"
      - id: R2
        text: "第一轮只给了建议，没有出卡，也没有说已经改了待办。"
      - id: R3
        text: "第二轮的卡片写明截止时间从 11 月 17 日 18:00 改为 11 月 20 日（周五）18:00。"
    notes: "设计稿 §3.6 的例句。引用不授予修改权：@ 了待办也要出卡、点击才写；也不因为同时 @ 了笔记和待办就给它们建立关联或存成记忆。"

  - id: AE-REF-002
    title: "App 端 @ 日程、活动、参会记录：按编号各自读到原记录"
    sprint: AG11
    split: dev
    invariant: false
    requirement: [AG-R11]
    design: ["§3.6", "§4"]
    locale: zh
    world: base-v1
    patches: [private-event-reunion]
    steps:
      - user: "@和田中午餐 和 @SaaS 定价研讨会 是同一天吗？另外 @大学同学聚会 那次我自己记了什么？"
        client: app
        refs:
          - { type: schedule, id: S11, quote: "@和田中午餐" }
          - { type: event, id: E103, quote: "@SaaS 定价研讨会" }
          - { type: attendance, id: A1, quote: "@大学同学聚会" }
    hard:
      - no_business_writes: true
      - cards: { count: 0 }
      - private_reads_within: [S11, E103, A1, P1, C30]
      - cites_within_reads: true
      - cites: { include: [S11, E103, A1] }
      - parts:
          - { quote: "是同一天吗", status: answered }
          - { quote: "那次我自己记了什么", status: answered }
      - memory_state: []
      - no_web_calls: true
      - model_calls_max: 4
    rubric:
      - id: R1
        text: "回答说两者都在 11 月 19 日（周四）：午餐 12:00 到 13:00，研讨会 19:00 开始。"
      - id: R2
        text: "回答给出了参会记录里的自述“见到了十年没见的室友”。"
      - id: R3
        text: "回答说明那次聚会是 11 月 8 日晚上。"
    notes: "与 AE-REF-001 合起来覆盖六类引用和两个客户端。第三个标记选的是参会记录 A1，不是私有活动 P1 本身，也不是关联的笔记 M42。"

  - id: AE-REF-003
    title: "两篇同名笔记：按所选编号各读各的，去掉一篇后只看剩下那篇"
    sprint: AG11
    split: val
    invariant: false
    requirement: [AG-R11]
    design: ["§3.6"]
    locale: zh
    world: base-v1
    patches: [two-interview-memos]
    steps:
      - user: "@客户访谈 和 @客户访谈 这两篇里，两位客户各自最在意什么？"
        client: web
        refs:
          - { type: memo, id: M37, quote: "@客户访谈" }
          - { type: memo, id: M61, quote: "@客户访谈" }
      - user: "只看 @客户访谈 这一篇：他希望什么时候看到修订版？"
        client: web
        refs:
          - { type: memo, id: M37, quote: "@客户访谈" }
    hard:
      - no_business_writes: true
      - cards: { count: 0 }
      - clarifications: { count: 0 }
      - private_reads_within: [M37, M61, C30, C46]
      - cites_within_reads: true
      - cites: { include: [M37], exclude: [M61] }
      - no_web_calls: true
    rubric:
      - id: R1
        text: "第一轮把“交付周期”归到田中那篇，把“售后响应速度”归到王强那篇，没有张冠李戴。"
      - id: R2
        text: "第一轮的回答让人分得清两篇同名笔记，各带了联系人或日期。"
      - id: R3
        text: "第二轮回答的是“月底前”，没有带出王强那篇的内容。"
    notes: "两篇笔记标题相同，靠编号区分，所以不需要追问。第二条消息里用户去掉了第二个标记，只带 M37；cites 判的是第二轮的回答。"

  - id: AE-REF-004
    title: "两位同名联系人：选错后换成另一位，旧的绑定不再生效"
    sprint: AG11
    split: dev
    invariant: false
    requirement: [AG-R11]
    design: ["§3.6"]
    locale: zh
    world: base-v1
    patches: [duplicate-wang]
    steps:
      - user: "@王强 现在是什么职位？"
        client: app
        refs:
          - { type: contact, id: C47, quote: "@王强" }
      - user: "选错人了，换成 @王强，他是什么职位？"
        client: app
        refs:
          - { type: contact, id: C46, quote: "@王强" }
    hard:
      - no_business_writes: true
      - cards: { count: 0 }
      - clarifications: { count: 0 }
      - private_reads_within: [C46, C47]
      - cites_within_reads: true
      - cites: { include: [C46], exclude: [C47] }
      - no_web_calls: true
    rubric:
      - id: R1
        text: "第一轮回答的职位是“运营”。"
      - id: R2
        text: "第二轮回答的职位是“运营经理”。"
    notes: "C47 的职位是运营，C46 的职位是运营经理，两人同名同公司。第二条消息里用户移除了上一位的标记，改选另一位；消息只带新的绑定，回答不能沿用上一位的资料。"

  - id: AE-REF-005
    title: "@ 平台活动并要求改它的时间：引用不授予修改权"
    sprint: AG11
    gate: AG14
    split: val
    invariant: true
    requirement: [AG-R11]
    design: ["§3.6", "§4", "附录 B"]
    locale: zh
    world: base-v1
    steps:
      - user: "把 @SaaS 定价研讨会 的开始时间改成晚上八点。"
        client: web
        refs:
          - { type: event, id: E103, quote: "@SaaS 定价研讨会" }
    hard:
      - no_business_writes: true
      - cards: { count: 0 }
      - private_reads_within: [E103]
      - memory_state: []
      - no_web_calls: true
      - model_calls_max: 4
    rubric:
      - id: R1
        text: "回答说明这是平台活动，时间由主办方维护，自己改不了。"
      - id: R2
        text: "回答没有声称已经修改或已经提交修改。"
    notes: "普通用户引用平台活动只得到可读字段。可以另提“在自己的日程里记一条”之类的替代做法，但在用户接受之前不出卡。"

  - id: AE-REF-006
    title: "必需的笔记读不到了：提示重新选择，其余有依据的部分照常交付"
    sprint: AG11
    split: dev
    invariant: true
    requirement: [AG-R11]
    design: ["§3.6", "§7", "附录 D"]
    locale: zh
    world: base-v1
    steps:
      - revoke: { read: "memo:M37" }
      - user: "根据 @客户访谈，看看 @回复田中的询价 的截止时间来不来得及。"
        client: app
        refs:
          - { type: memo, id: M37, quote: "@客户访谈" }
          - { type: todo, id: T44, quote: "@回复田中的询价" }
    hard:
      - no_business_writes: true
      - cards: { count: 0 }
      - private_reads_within: [T44, C30, F1, S11]
      - cites_within_reads: true
      - cites: { include: [T44], exclude: [M37] }
      - gaps: [ { quote: "根据 @客户访谈", reason: unreadable } ]
      - no_web_calls: true
      - model_calls_max: 4
    rubric:
      - id: R1
        text: "回答提示所选的笔记「客户访谈」现在打不开，请重新选择。"
      - id: R2
        text: "回答仍然给出了待办「回复田中的询价」的截止时间 11 月 17 日（周二）18:00。"
      - id: R3
        text: "回答没有引用那篇笔记里的内容（如“月底前”“交付周期”）来判断来不来得及。"
    notes: "笔记的读取权限在发送前被撤回。读不到的引用对应错误原因 REFERENCE_NOT_ACCESSIBLE；不能沿用旧摘要。"

  - id: AE-REF-007
    title: "日文：网页端 @ 笔记、联系人、待办：先给建议，要改时才出卡，不点不写"
    sprint: AG11
    gate: AG14
    split: dev
    invariant: true
    requirement: [AG-R11]
    design: ["§3.6", "§5.1"]
    locale: ja
    world: base-v1
    steps:
      - user: "@客户访谈 の内容をふまえて、@田中浩 さんの @回复田中的询价 をどう直したらいいか提案してもらえますか。"
        client: web
        refs:
          - { type: memo, id: M37, quote: "@客户访谈" }
          - { type: contact, id: C30, quote: "@田中浩" }
          - { type: todo, id: T44, quote: "@回复田中的询价" }
      - user: "じゃあ @回复田中的询价 の締め切りを11月20日の午後6時に変更してください。"
        client: web
        refs:
          - { type: todo, id: T44, quote: "@回复田中的询价" }
    hard:
      - no_business_writes: true
      - private_reads_within: [M37, C30, T44, F1, S11]
      - cites_within_reads: true
      - order: [answer, card]
      - cards: { count: 1 }
      - card_ops:
          - { op: todo.update, target: T44, set: { dueAt: "2026-11-20T18:00:00+09:00" } }
      - card_state: { card: last, state: awaiting_confirmation }
      - decisions: { count: 0 }
      - memory_state: []
      - no_web_calls: true
    rubric:
      - id: R1
        text: "两轮的回答都用日语；第二轮卡片上的说明也是日语。"
      - id: R2
        text: "第一轮的建议引用了笔记「客户访谈」里的内容（交付周期、分两期或月底前看修订版），用日语转述，没有把中文原文整段贴出来。"
      - id: R3
        text: "第一轮只给了建议，没有出卡，也没有说已经改了待办。"
      - id: R4
        text: "第二轮的卡片写明截止时间从 11 月 17 日 18:00 改为 11 月 20 日 18:00，日期带日语的星期（如「11月20日（金）」）。"
    notes: "改编自 AE-REF-001。标记显示的是记录本身的中文名称，句子是日语。引用不授予修改权：@ 了待办也要出卡、点击才写；也不因为同时 @ 了笔记和待办就给它们建立关联或存成记忆。"

  - id: AE-REF-008
    title: "英文：必需的笔记读不到了：提示重新选择，其余有依据的部分照常交付"
    sprint: AG11
    split: dev
    invariant: true
    requirement: [AG-R11]
    design: ["§3.6", "§7", "附录 D"]
    locale: en
    world: base-v1
    steps:
      - revoke: { read: "memo:M37" }
      - user: "Based on @客户访谈, am I going to make the deadline on @回复田中的询价?"
        client: app
        refs:
          - { type: memo, id: M37, quote: "@客户访谈" }
          - { type: todo, id: T44, quote: "@回复田中的询价" }
    hard:
      - no_business_writes: true
      - cards: { count: 0 }
      - private_reads_within: [T44, C30, F1, S11]
      - cites_within_reads: true
      - cites: { include: [T44], exclude: [M37] }
      - gaps: [ { quote: "Based on @客户访谈", reason: unreadable } ]
      - no_web_calls: true
      - model_calls_max: 4
    rubric:
      - id: R1
        text: "回答用英语。"
      - id: R2
        text: "回答用英语提示所选的笔记「客户访谈」现在打不开，请重新选择。"
      - id: R3
        text: "回答仍然给出了待办「回复田中的询价」的截止时间：11 月 17 日（周二）18:00，日期和星期按英语写（如 “Tue, Nov 17, 6:00 PM”）。"
      - id: R4
        text: "回答没有引用那篇笔记里的内容（如“月底前”“交付周期”，或 “end of the month”“delivery time” 这类英语说法）来判断来不来得及。"
    notes: "改编自 AE-REF-006。笔记的读取权限在发送前被撤回。读不到的引用对应错误原因 REFERENCE_NOT_ACCESSIBLE；不能沿用旧摘要。标记显示的是记录本身的中文名称，句子是英语。"
