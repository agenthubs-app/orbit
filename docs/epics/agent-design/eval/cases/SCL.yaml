    notes: "验收项 AG06-2、AG06-3。较大账号有七位姓张的联系人，全名是张伟的两位。人没选定之前不出卡。"

  - id: AE-SCL-012
    title: "英文：118 轮的对话隔了两天再说 his，不猜是谁；选人后只改那一条背调待办"
    sprint: AG06
    gate: AG13          # 该用例要用到 AG13 才交付的能力，门槛顺延到 AG13
    split: dev
