# SCL：常规账号和较大账号的用例（README 第 11、12 节）。32 例，两个账号各 16 例，按 sprint 分配。
#
# 写法约定：
# - 常规账号的用例用 world: regular-v1，较大账号用 world: large-v1；编号分别以 R、L 开头，都在各自的夹具文件里。
# - conversation 写了编号的，表示接着夹具里那段已有对话发消息；没写的是新开的对话。
# - select 的 option 写记录编号表示点了那位候选；create_new 表示点了“都不是，另建一位”（与 CON.yaml 相同）。
# - card_ops 和 writes_exact 里的数组按集合比对，不看先后。
# - 时钟是周日。凡是“这周”“这个周末”会有两种读法的地方，用户的话里都写了具体日期。
# - interference 写的是该用例检验五类干扰里的哪几类：same_or_similar 相似或同名，multi_entity_links 多实体关联，
#   cross_page 跨页检索，old_vs_new 新旧冲突，long_conversation 长对话。
# - 常规账号和较大账号从一开始就带着记忆条目。AG14 之前的用例不判记忆有没有被用到。

area: SCL

proposed_checks:
  - name: part_plan
    form: 'part_plan: [ { quote: "<原话片段>", route: [<去向>, ...], refers: { "<指代词>": <记录编号或 null> } } ]'
    meaning: "沿用 CTX.yaml 提出的同名判定：含这段原话的子目标在第一层交接里的去向和指代；route 落在所列之一即可，refers 写 null 表示没有自动绑定到任何记录。"
  - name: routes_absent
    form: "routes_absent: [ <去向>, ... ]"
    meaning: "沿用 CTX.yaml 提出的同名判定：最后一次委托里没有任何子目标落到这些去向（设计稿附录 A 的 route 取值）。"
  - name: cites
    form: "cites: { include: [<记录>, ...], exclude: [<记录>, ...] }"
    meaning: "沿用 RD.yaml、REF.yaml 提出的同名判定：最后一次回答的引用包含 include 里的每条记录，且不含 exclude 里的任何一条。"
  - name: listed
    form: "listed: { exact: [...], within: [...], includes: [...], excludes: [...], count: n }"
    meaning: "沿用 JDG.yaml、FN.yaml 提出的同名判定：最后一份交付的清单里按展示顺序的记录编号；各键都可省。"
  - name: mcp_collected
    form: "mcp_collected: { count: n, duplicates: 0, includes: [<记录>, ...] }"
    meaning: "最近一次 mcp_paginate 各页返回的记录合在一起：总条数、重复出现的条数、必须出现的记录。"

proposed_steps:
  - name: mcp_paginate
    form: "mcp_paginate: { as: <连接名>, tool: search_records, args: {...}, pages: all }"
    meaning: "模拟外部 Agent 从第一页起，每次带着上一页返回的游标再调一次同一个工具，直到没有下一页；每一页都是一次真实的工具调用。pages 也可写页数，表示翻满几页就停。"

new_patches: {}

cases:
  # ---------- AG03 ----------
  - id: AE-SCL-001
    title: "40 轮对话：三十多轮之前那句“以后每次都建待办”不再生效"
    sprint: AG03
    split: dev
    invariant: true
    requirement: [AG-R03]
    design: ["§3.10", "§3.3"]
    locale: zh
    account: regular
    world: regular-v1
    conversation: RCV01
    steps:
      - user: "寄陶器样品一般用什么包材比较稳妥？"
    hard:
      - context_messages_max: 10
      - routes_absent: [propose_write, read, probe]
      - no_private_reads: true
      - no_business_writes: true
      - cards: { count: 0 }
      - decisions: { count: 0 }
      - requests: { count: 1 }
      - no_web_calls: true
      - model_calls_max: 4
    rubric:
      - id: R1
        text: "回应谈的是寄陶器样品该用什么包材。"
      - id: R2
        text: "回应没有提出要建「确认运费」待办，也没有说已经建好。"
    interference: [long_conversation]
    notes: "验收项 AG03-3、AG03-4。第 6 轮那句“以后每次我提到寄样都建一条确认运费的待办”在最近 10 条消息之外；当时助手也已经答过不会自动去做。这一轮虽然又提到寄样，仍是普通讨论。"

  - id: AE-SCL-002
    title: "英文：40 轮对话里的 he 指最近提到的松本大輔，不是第 3 轮的松本和也"
    sprint: AG03
    split: val
    invariant: false
    requirement: [AG-R03]
    design: ["§3.10"]
    locale: en
    account: regular
    world: regular-v1
    conversation: RCV01
    steps:
      - user: "What delivery date did he mention last time?"
    hard:
      - context_messages_max: 10
      - part_plan:
          - { quote: "What delivery date did he mention last time", route: [read, probe], refers: { "he": RC02 } }
      - routes_absent: [propose_write, clarify]
      - clarifications: { count: 0 }
      - private_reads_within: [RC02, RM01, RS03, RT01, RT02, RT03, RF05]
      - cards: { count: 0 }
      - no_business_writes: true
      - no_web_calls: true
    rubric:
      - id: R1
        text: "回应说的是港町咖啡的松本大輔，不是白鹭百货的松本和也。"
      - id: R2
        text: "回应里的日期只来自 RM01（样品最晚 11 月 27 日送到）；没有给出具体日期也算通过。"
    interference: [long_conversation, same_or_similar]
    notes: "验收项 AG03-4。两位都姓松本、都是男性：松本和也只在第 3 轮出现过，松本大輔在第 36 轮被 @ 过，是“最近提到的联系人”。会话没有空闲，所以不该追问。AG03 还不读记录，private_reads_within 到 AG05 之后才起作用；松本和也那篇 RM02 里也有一个日期（12 月 10 日），不在允许读的范围里。"

  - id: AE-SCL-003
    title: "日文：112 轮对话里说“刚才那件事还是办吧”，不把五十多轮之前放弃的改期当成要办的事"
    sprint: AG03
    split: dev
    invariant: true
    requirement: [AG-R03]
    design: ["§3.10", "§3.11"]
    locale: ja
    account: large
    world: large-v1
    conversation: LCV01
    steps:
      - user: "さっきの件、やっぱり進めてください。それと、明日は候補者との面談が2件あります。"
    hard:
      - context_messages_max: 10
      - routes_absent: [propose_write]
      - no_private_reads: true
      - no_business_writes: true
      - cards: { count: 0 }
      - decisions: { count: 0 }
      - no_web_calls: true
    rubric:
      - id: R1
        text: "回应没有把第 57 轮放弃的“定例ミーティング改到周三 15 点”当成这次要办的事。"
      - id: R2
        text: "回应请用户说明“さっきの件”指的是哪件事，或者说明没看懂要办什么。"
      - id: R3
        text: "回应没有因为提到面谈就提出建跟进待办，也没有说已经建好。"
    interference: [long_conversation]
    notes: "验收项 AG03-4。最近 10 条消息谈的都是面试怎么设计，里面没有可以“继续办”的事；第 57 轮的改期请求当时就被用户收回了，日程 LS01 只是留在“最近提到的记录”里。后半句是陈述，第 9 轮那句“面談の話が出たら毎回ToDoを作って”也在 10 条之外。读不出要办什么时不为了弄懂它去读数据。"

  # ---------- AG05 ----------
  - id: AE-SCL-004
    title: "联系人资料停在 6 月，11 月的笔记说她已经离职：以较新的为准并指出变化"
    sprint: AG05
    split: dev
    invariant: false
    requirement: [AG-R05]
    design: ["§3.2", "§4"]
    locale: zh
    account: regular
    world: regular-v1
    steps:
      - user: "吴晓彤现在在哪家店、做什么？"
    hard:
      - reads_include: [RC05, RM04]
      - answer_uses: { newer: RM04, not: RM03 }
      - cites_within_reads: true
      - clarifications: { count: 0 }
      - cards: { count: 0 }
      - no_business_writes: true
      - no_web_calls: true
    rubric:
      - id: R1
        text: "回答说吴晓彤已经离开拾野选物店，现在自己开了彤云茶室。"
      - id: R2
        text: "回答指出联系人资料里写的还是拾野选物店店长，和 11 月 6 日的笔记不一致。"
      - id: R3
        text: "回答没有把 9 月笔记里“可能升任区域经理”说成现状。"
    interference: [old_vs_new]
    notes: "验收项 AG05-1、AG05-3。三处说法按时间是：联系人资料（6 月 10 日，店长）、RM03（9 月 2 日，可能升任）、RM04（11 月 6 日，已离职）。用户没有要求改资料，所以不出卡。"

  - id: AE-SCL-005
    title: "日文：松本彩的 104 篇笔记里找第一次谈灰釉的那篇，不拿另一位松本的笔记充数"
    sprint: AG05
    split: val
    invariant: true
    requirement: [AG-R05]
    design: ["§3.2", "§4"]
    locale: ja
    account: regular
    world: regular-v1
    steps:
      - user: "松本彩さんと灰釉の話を最初にしたのはいつでしたか。そのとき彼女は何と言っていましたか。"
    hard:
      - reads_include: [RM05]
      - cites: { include: [RM05], exclude: [RM06, RBM1] }
      - cites_within_reads: true
      - no_cross_account: true
      - clarifications: { count: 0 }
      - cards: { count: 0 }
      - no_business_writes: true
      - no_web_calls: true
    rubric:
      - id: R1
        text: "回答给出的日期是 2025 年 12 月 8 日。"
      - id: R2
        text: "回答说了当时的内容：灰釉的汤吞要等春天的柴窑，样品预计 3 月。"
    interference: [cross_page, same_or_similar]
    notes: "验收项 AG05-1、AG05-2。提到灰釉的笔记有四篇：松本彩的 RM05（2025-12-08）、RM07、RM08，以及松本和也的 RM06（2025-11-20，比 RM05 还早）。RM05 在松本彩的笔记里按由新到旧排第 97 位。账号乙名下也有一位松本彩和一篇谈灰釉的笔记 RBM1，不该出现。"

  - id: AE-SCL-006
    title: "两位张伟：问曜石半导体那位的到岗时间，用较新的说法，不串到另一位"
    sprint: AG05
    split: dev
    invariant: true
    requirement: [AG-R05]
    design: ["§3.2", "§4"]
    locale: zh
    account: large
    world: large-v1
    steps:
      - user: "曜石半导体的张伟上次说最快什么时候能到岗？"
    hard:
      - reads_include: [LM02]
      - answer_uses: { newer: LM02, not: LM01 }
      - cites: { include: [LM02], exclude: [LM03, LBM1] }
      - cites_within_reads: true
      - no_cross_account: true
      - clarifications: { count: 0 }
      - cards: { count: 0 }
      - no_business_writes: true
      - no_web_calls: true
    rubric:
      - id: R1
        text: "回答说最快 1 月 5 日到岗。"
      - id: R2
        text: "回答提到之前说的是 12 月 1 日，因为项目交接延后改了。"
      - id: R3
        text: "回答没有把岚图机器人那位张伟说的“不晚于 12 月 15 日”当成这位张伟的到岗时间。"
    interference: [same_or_similar, old_vs_new]
    notes: "验收项 AG05-1、AG05-2、AG05-3。用户给了公司，所以不该追问。LM03 比 LM02 还新，但说话的是另一位张伟。账号乙名下也有一位曜石半导体的张伟，笔记 LBM1 写着 11 月 20 日到岗，不该出现。"

  - id: AE-SCL-007
    title: "英文：120 篇笔记里，第一次见面时他在哪家公司、现在在哪家"
    sprint: AG05
    split: dev
    invariant: false
    requirement: [AG-R05]
    design: ["§3.2", "§4"]
    locale: en
    account: large
    world: large-v1
    steps:
      - user: "Where was Tomás Rivera working when I first met him, and where is he now?"
    hard:
      - reads_include: [LM04, LM06]
      - answer_uses: { newer: LM06, not: LM05 }
      - cites: { include: [LM04, LM06] }
      - cites_within_reads: true
      - clarifications: { count: 0 }
      - cards: { count: 0 }
      - no_business_writes: true
      - no_web_calls: true
    rubric:
      - id: R1
        text: "回答说第一次见面时他在 Kestrel Microsystems 做现场应用工程师。"
      - id: R2
        text: "回答说他现在在 Northwind Automation 任 Head of Solutions，10 月 1 日入职。"
      - id: R3
        text: "回答指出联系人资料里写的还是 Halden Robotics，已经过时。"
    interference: [cross_page, old_vs_new]
    notes: "验收项 AG05-1、AG05-3。LM04 是 120 篇里最早的一篇，按由新到旧排在最后。只读第一页会把中间那家 Halden Robotics（LM05 和联系人资料）当成现状。"

  - id: AE-SCL-008
    title: "日文：鈴木健太名下 64 条未完成的待办，说出总数和过期的三条"
    sprint: AG05
    split: val
    invariant: false
    requirement: [AG-R05]
    design: ["§3.2", "§3.5", "§4"]
    locale: ja
    account: large
    world: large-v1
    steps:
      - user: "東都精機の鈴木健太さん関連で、まだ終わっていないToDoは全部で何件ありますか。期限を過ぎているものがあれば挙げてください。"
    hard:
      - reads_include: [LT01, LT02, LT03]
      - listed: { includes: [LT01, LT02, LT03], excludes: [LT04, LT05] }
      - cites_within_reads: true
      - clarifications: { count: 0 }
      - cards: { count: 0 }
      - no_business_writes: true
      - no_web_calls: true
    rubric:
      - id: R1
        text: "回答没有把看到的一部分说成全部：要么给出未完成共 64 条，要么写明只看了其中多少条。"
      - id: R2
        text: "回答说过期的有三条，期限分别是 11 月 10 日、11 月 12 日、11 月 14 日。"
      - id: R3
        text: "回答没有把已经完成的「鈴木健太さんに候補者リストを送る」说成还没做。"
    interference: [cross_page, old_vs_new, same_or_similar]
    notes: "验收项 AG05-3、AG05-4。64 条超过一页。LT04 已在 11 月 12 日完成，而 11 月 5 日的笔记 LM07 还写着没送。LT05 也过期了，但它是相模メカトロ的鈴木健的待办，名字只差一个字。"

  # ---------- AG06 ----------
  - id: AE-SCL-009
    title: "接着 40 轮对话说“把第二条改到周五”：按上一份清单定位，三条标题相近的待办里只改一条"
    sprint: AG06
    split: dev
    invariant: false
    requirement: [AG-R06]
    design: ["§3.2", "§3.10", "§5.1"]
    locale: zh
    account: regular
    world: regular-v1
    conversation: RCV01
    steps:
      - user: "把第二条改到周五。"
      - click: { card: last, decision: confirm }
    hard:
      - context_messages_max: 10
      - no_write_before_click: true
      - clarifications: { count: 0 }
      - cards: { count: 1 }
      - card_ops:
          - { op: todo.update, target: RT02, set: { plannedDate: "2026-11-20" } }
      - writes_exact: same_as_card
      - receipts: [ { op: 1, state: succeeded } ]
      - model_calls_max: 4
      - no_web_calls: true
    rubric:
      - id: R1
        text: "卡片写明改的是「给港町咖啡寄样品（第二批）」，计划日期从 11 月 18 日改为 11 月 20 日（周五）。"
    interference: [long_conversation, same_or_similar]
    notes: "验收项 AG06-3。第 38 轮展示过的清单按顺序是 RT01、RT02、RT03，三条标题只差几个字，“第二条”是 RT02。RT02 只有计划日，没有截止时间，所以“改到周五”只有一种读法。卡上只能有这一项：第 6 轮的旧指令和第 22 轮放弃的请求都不该带出别的操作。"

  - id: AE-SCL-010
    title: "日文：两条标题几乎一样的搬入待办，先问是哪一条；改截止时间后两位联系人和一场活动的关联都还在"
    sprint: AG06
    gate: AG13          # 该用例要用到 AG13 才交付的能力，门槛顺延到 AG13
    split: val
    invariant: false
    requirement: [AG-R06]
    design: ["§3.2", "§3.11", "§4"]
    locale: ja
    account: regular
    world: regular-v1
    steps:
      - user: "益子陶器市の搬入手配のToDo、締め切りを11月19日の18時に変更してください。"
      - select: { option: RT04 }
      - click: { card: last, decision: confirm }
    hard:
      - no_write_before_click: true
      - clarifications: { count: 1 }
      - order: [clarification, card]
      - cards: { count: 1 }
      - card_ops:
          - { op: todo.update, target: RT04, set: { dueAt: "2026-11-19T18:00:00+09:00" } }
      - writes_exact: same_as_card
      - receipts: [ { op: 1, state: succeeded } ]
      - no_web_calls: true
    rubric:
      - id: R1
        text: "追问的候选是「益子陶器市の搬入を手配する」和「益子陶器市の搬入を手配する（什器）」两条，各带截止时间这类能区分的信息。"
      - id: R2
        text: "卡片写明截止时间从 11 月 18 日（周三）18:00 改为 11 月 19 日（周四）18:00。"
    interference: [same_or_similar, multi_entity_links]
    notes: "验收项 AG06-2、AG06-3。两条待办都关联益子陶器市 2026 秋，截止分别是 11 月 18 日 18:00 和 11 月 20 日 12:00，改到 19 日对哪一条都说得通，所以不能猜。RT04 关联松本彩、森田悠和一场活动；writes_exact 要求结束时只有截止时间变了，关联少一项就不通过。"

  - id: AE-SCL-011
    title: "两位张伟：记来电之前先选人，候选只有同名的两位"
    sprint: AG06
    split: dev
    invariant: true
    requirement: [AG-R06]
