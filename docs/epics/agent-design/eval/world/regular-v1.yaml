# 五类干扰（README 第 12 节）。anchors 列的是组成这一类的锚点，hard 是难在哪里。
interference:
  same_or_similar:
    anchors: [RC01, RC02, RC03, RC04, RC06, RC07, RT01, RT02, RT03, RT04, RT05, RT06, RT07, RT08, RF02, RM05, RM06, RM09, RM10, RM11, RM12, RM13, RM14, RE01, RE02, RE03, RE06, RE07, RS01, RS02]
    hard: "四位姓松本的人、两位名字只差一两个字母的英文联系人；标题只差括号的待办和笔记；同名不同期的柴烧器物展和益子陶器市。只说姓或只说标题分不出是哪一条"
  multi_entity_links:
    anchors: [RM15, RT04, RS01, RM04, RA01]
    hard: "RM15 关联 3 位联系人和 2 场活动，但真正通话的只有中村理沙；RT04 关联 2 位联系人和 1 场活动；RS01 关联 2 位联系人和 1 篇笔记。改其中一项时其余关联要原样留着"
  cross_page:
    anchors: [RM05, RC13, RC14, RC15, RM17]
    hard: "松本彩有 104 篇笔记，第一次谈灰釉的 RM05 排第 97 位；RC13 到 RC15 在 300 位联系人的默认排序里排最后三位；全部笔记有 400 篇，一页读不完"
  old_vs_new:
    anchors: [RC05, RM03, RM04, RM09, RM10, RF06, RM18, RM12, RM13, RMM04, RMM05]
    hard: "联系人资料停在 6 月而 11 月的笔记说她已经离职；报价从 150 改到 165；跟进已完成而旧笔记说还没催；同名笔记有春、秋两版；一条偏好已过有效期"
  long_conversation:
    anchors: [RCV01]
    hard: "40 轮：第 3 轮提到松本和也，第 6 轮给过一条“以后每次都建待办”的指令，第 22 轮有一个放弃的请求，第 36 轮起说的是松本大輔，第 38 轮列过一份待办清单"

conversations:
  - id: RCV01
    title: 寄样、陈列和市集的杂问
    turns: 40
    startedAt: "2026-11-15T08:20:00+09:00"
    lastActivityAt: "2026-11-15T09:52:00+09:00"
    language: "以中文为主；第 13 到 15 轮是日语，第 35、36 轮是英语"
    key_turns:
      - turn: 1
        why: 开场
        user: "今天想把寄样、陈列和市集的几件事一起理一理。"
        assistant: "好，一件一件来。"
      - turn: 3
        why: 很早提过的对象
        user: "先说个背景：白鹭百货的松本和也想在冬季陈列里放我们的器物，这周要给他回话。"
        assistant: "明白。需要查他的资料或者你们的往来时，告诉我一声。"
      - turn: 6
        why: 几十轮之前的指令
        user: "以后每次我提到寄样，你都顺手帮我建一条「确认运费」的待办。"
        assistant: "这件事我不会自动去做。每次需要的时候告诉我，我出一张卡，你点了才会建。"
      - turn: 14
        why: 换话题，日语
        user: "山吹茶舗の中村さんへのお礼メール、どのくらい丁寧に書けばいいでしょうか。"
        assistant: "取引が続いている相手なら丁寧語を基本にして、冒頭に先日のお礼を一文添えれば十分です。"
      - turn: 22
        why: 中途放弃的请求
        user: "帮我把给港町咖啡的报价单整理成一份……算了，先不弄了。"
        assistant: "好，这件事先放下，没有做任何改动。"
      - turn: 29
        why: 换话题
        user: "换个话题：益子陶器市那几天住哪儿比较方便？"
        assistant: "会场附近的住处不多，住在宇都宫再坐早班车过去比较稳妥。"
      - turn: 36
        why: 最近提到的联系人
        at: "2026-11-15T09:40:00+09:00"
        user: "@松本大輔 is coming to see samples next week. Anything I should prepare?"
        refs: [ { type: contact, id: RC02, quote: "@松本大輔" } ]
        assistant: "A short list helps: the pieces you want him to handle, a price sheet, and packaging you would actually ship in."
        recordRefs: ["contact:RC02"]
      - turn: 37
        why: 接着说同一个人
        user: "他们新店的灯光偏暖，深色釉会不会显脏？"
        assistant: "暖光下深色釉容易发闷，可以带一两件浅色的做对比，让他在店里的灯下看。"
      - turn: 38
        why: 上一份展示过的清单
        at: "2026-11-15T09:46:00+09:00"
        user: "列一下给港町咖啡寄样有关的待办。"
        assistant: "有三条，按计划日排好了。"
        recordRefs: ["todo:RT01", "todo:RT02", "todo:RT03"]
      - turn: 39
        why: 普通讨论
        user: "寄样用哪家快递比较稳？"
        assistant: "易碎品选有专门陶瓷件服务的那几家，寄之前先问清保价上限。"
      - turn: 40
        why: 收尾
        at: "2026-11-15T09:52:00+09:00"
        user: "好，知道了。"
        assistant: "好的。"
    state:
      shownList:
        shownAtTurn: 38
        items:
          - { type: todo, id: RT01, name: 给港町咖啡寄样品 }
          - { type: todo, id: RT02, name: 给港町咖啡寄样品（第二批） }
          - { type: todo, id: RT03, name: 给港町咖啡寄样品册 }
      lastMentioned:
        - { type: contact, id: RC02, name: 松本大輔, turn: 36 }
      openItems: []
    filler:
      turns: "其余 29 轮"
      rule: "普通问答：包材、邮件措辞、定价的说法、出差和住宿。用户每条不超过 60 个字，助手每条不超过 120 个字，没有引用，也没有记录编号"
      must_not: "不出现任何联系人、公司、活动的名字；不出现“以后”“每次”“从现在起”这类长期指令；不提出新增、修改、删除记录的请求；不出现 bulk.must_not_produce 里的词"

