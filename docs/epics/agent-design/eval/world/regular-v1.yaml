# 与 base-v1、large-v1 互相独立，人物和故事都不共用。本文件的编号一律以 R 开头。
# 锚点记录逐条写在 anchors 里，用例用编号指认；其余记录由 AG00 的生成器按 bulk 的规则和固定种子生成。

