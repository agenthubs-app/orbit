  B: { name: 测试用户乙, workspace: W2, locale: zh, role: "只用来检验隔离，与 base-v1 的账号乙是同一个；本文件给它加的记录见 anchors.account_B" }

defaults:
  settings: { web: on, memory_use: on, memory_learn: off, judgment: on }

conventions:
  turn: "一轮是一条用户消息加紧随其后的一条助手回复。第 n 轮对应第 2n-1、2n 条消息；最近 10 条消息就是最后 5 轮"
  default_sort:
    contacts: "最近更新的在前（updatedAt 由新到旧），同一时刻按编号"
    memos: "发生时间由新到旧，没有发生时间的用创建时间"
    todos: "先按截止时间由近到远，再按计划日；两者都没有的排最后"
    schedule: "按开始时间"
    platform_events: "按开始时间，时间未公布的排最后"
  page_size: "各读取接口单页不超过 50 条。标了“第一页之外”的锚点，在默认排序里都排在第 60 位之后"
  links: "Todo 的多值关联写作 relatedContactIds、relatedEventRefs（设计稿附录 E）；Memo 和日程的活动关联写作 eventRefs"
  ids: "锚点用两位序号（RC01）；批量记录从 1001 起（RC1001），两者不重叠"

# 第 11 节规定的数量。anchors_plus_bulk 写的是 [锚点数, 批量数]，两者相加等于总数。
