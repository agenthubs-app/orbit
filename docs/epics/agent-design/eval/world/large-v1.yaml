    - { id: LMM06, category: identity, content: 我是做半导体和机器人方向的猎头顾问, appliesTo: [contact.recommend, memo.summarize], revision: 1 }
    - { id: LMM07, category: goal, content: 年底前认识三位功率器件方向的技术负责人, appliesTo: [contact.recommend], revision: 1 }
