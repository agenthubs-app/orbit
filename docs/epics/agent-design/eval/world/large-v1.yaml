conversations:
  - id: LCV01
    title: 採用まわりの相談
    turns: 112
    startedAt: "2026-11-14T13:00:00+09:00"
    lastActivityAt: "2026-11-15T09:55:00+09:00"
    language: 日语
    key_turns:
      - turn: 1
        why: 开场
        user: "今日は採用まわりのことをいくつか相談させてください。"
        assistant: "はい、どうぞ。"
      - turn: 4
        why: 很早提过的对象
        user: "東都精機の鈴木健太さんから、来月の採用計画について相談を受けています。"
        assistant: "承知しました。鈴木健太さんとのやり取りや関連するToDoを確認したいときは、お知らせください。"
      - turn: 9
        why: 几十轮之前的指令
        user: "これからは、面談の話が出たら毎回フォローアップのToDoを作っておいてください。"
        assistant: "自動では作成しません。必要なときに言っていただければカードをお出しします。確認を押すまでは何も変わりません。"
