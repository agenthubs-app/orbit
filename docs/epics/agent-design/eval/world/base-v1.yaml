# 夹具世界 base-v1。全部是合成数据，人物、公司、网址都是虚构的。
# 这是三个账号里的“小”账号（account: small）。常规和较大账号见 regular-v1.yaml、large-v1.yaml。
# 用例用这里的编号指认记录；需要不同的初始状态时用 patches 里的增量。

version: base-v1
clock: "2026-11-15T10:00:00+09:00"   # 周日
timezone: Asia/Tokyo

# 日历备查：11-08 周日，11-10 周二，11-12 周四，11-13 周五，11-14 周六，11-15 周日，
# 11-16 周一，11-17 周二，11-18 周三，11-19 周四，11-20 周五，11-21 周六，11-22 周日，
# 11-28 周六，11-29 周日，11-30 周一。

accounts:
  A: { name: 测试用户甲, workspace: W1, locale: zh, role: 主账号，绝大多数用例以它的身份运行 }
  B: { name: 测试用户乙, workspace: W2, locale: zh, role: 用来检验账号隔离 }
  # 2026-11-20 热修（第 2 部分）：一个什么记录都没有的新账号，用来检验“还没有内容”时的如实回答（AE-ANS-021）。
  E: { name: 测试用户戊, workspace: W1, locale: zh, role: 空账号，没有任何记录 }

defaults:
  settings: { web: on, memory_use: on, memory_learn: off, judgment: on }

