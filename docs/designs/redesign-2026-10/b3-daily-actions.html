<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>③ 每日行动</title>
<link rel="stylesheet" href="kit/tokens.css">
<link rel="stylesheet" href="kit/ui.css">

<script src="kit/data.js"></script>
<style>
  .doc { min-width: 1520px; }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .sec-h { font-size: 11.5px; color: var(--ink-3); font-weight: 700; margin: 16px 4px 8px; display: flex; align-items: center; gap: 6px; }

  /* ---------- Toast ---------- */

  /* ---------- 离线 / 降级 / 错误 ---------- */
  .offline { display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 14px; border-radius: 16px; background: var(--mac-apricot); color: var(--mac-apricot-ink); font-size: 12px; font-weight: 700; margin-bottom: 12px; }
  .offline .pend { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: var(--surface); color: var(--mac-apricot-ink); font-size: 11px; font-family: var(--font-num); flex: none; }
  .syncing { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; color: var(--mac-apricot-ink); font-weight: 700; }
  .degrade { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 18px; background: var(--surface-2); font-size: 12px; color: var(--ink-2); margin-bottom: 12px; }
  .err-card { text-align: center; padding: 26px 20px; }
  .err-ic { width: 54px; height: 54px; border-radius: 18px; background: var(--coral-soft); color: var(--coral); display: grid; place-items: center; margin: 0 auto 12px; }

  /* ---------- 弹窗 / 抽屉 ---------- */
  .drawer { display: flex; flex-direction: column; }   /* 私有：抽屉内底部操作区贴底 */
  .popover { position: absolute; z-index: 22; width: 340px; background: var(--surface); border-radius: 22px; padding: 16px; box-shadow: var(--shadow-float); border: 1px solid var(--line); }
  .actbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 34; padding: 12px 16px 30px; background: var(--glass); backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5); border-top: 1px solid var(--glass-line); }
  .dfoot { margin-top: auto; padding-top: 14px; display: flex; align-items: center; gap: 8px; }

  /* ---------- 草稿编辑器 ---------- */
  .fld { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .fld:last-child { border-bottom: 0; }
  .fld .k { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
  .mailbody { font-size: 13.5px; line-height: 1.85; white-space: pre-wrap; }
  .caret { display: inline-block; width: 1.6px; height: 16px; background: var(--accent); vertical-align: -3px; margin-left: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .rw { display: flex; align-items: center; gap: 6px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .rw .chip { cursor: pointer; }
  .tpl { background: var(--mac-apricot); color: var(--mac-apricot-ink); border-radius: 6px; padding: 0 4px; font-weight: 700; }

  /* ---------- タスク ---------- */
  .grp { display: flex; align-items: center; gap: 8px; margin: 18px 4px 8px; font-size: 12.5px; font-weight: 800; }
  .grp .n { font-family: var(--font-num); color: var(--ink-3); font-weight: 700; }
  .grp.over { color: var(--coral); }
  .grp .more2 { margin-left: auto; font-size: 11.5px; color: var(--ink-3); font-weight: 600; display: flex; align-items: center; gap: 2px; }
  .tk { display: flex; align-items: center; gap: 11px; }
  .tk .meta { flex: 1; min-width: 0; }
  .tk .meta b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tk .meta span { display: block; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tk.done .meta b { text-decoration: line-through; color: var(--ink-3); }
  .stk > * + * { margin-top: 8px; }
  .rep { color: var(--ink-3); display: inline-flex; vertical-align: -3px; }
  .ttab td { padding: 10px 10px; }
  .ttab tr.gh td { padding: 18px 10px 6px; font-size: 12px; font-weight: 800; border-top: 0; color: var(--ink-2); }
  .ttab tr.gh.over td { color: var(--coral); }
  .ttab tr.sel { background: var(--surface-2); }
  .ttab tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--plum-500); }
  .hov { display: flex; gap: 6px; justify-content: flex-end; opacity: 0; transition: opacity .2s; }
  .ttab tr:hover .hov, .hov.show { opacity: 1; }
  .tl2 { display: grid; grid-template-columns: 42px 1fr; gap: 10px; font-size: 12px; }
  .tl2 + .tl2 { margin-top: 10px; }
  .tl2 time { font-family: var(--font-num); font-weight: 800; color: var(--ink-2); }
  .quote { border-left: 3px solid var(--plum-300); padding: 2px 0 2px 12px; font-size: 13px; line-height: 1.7; color: var(--ink-2); }
  .frow { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .frow:last-child { border-bottom: 0; }
  .frow .k { flex: 1; font-weight: 600; }
  .frow .v { color: var(--ink-2); display: flex; align-items: center; gap: 4px; }
  .frow > svg.i { color: var(--ink-3); }
  .pick { cursor: pointer; }
  .pick.on { background: var(--accent); color: var(--on-accent); }
  .opt { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; cursor: pointer; }
  .opt:last-child { border-bottom: 0; }
  .opt .rd { width: 20px; height: 20px; border-radius: 50%; border: 1.8px solid var(--ink-4); flex: none; }
  .opt.on .rd { border: 6px solid var(--accent); }
  .opt small { margin-left: auto; color: var(--ink-3); font-size: 11.5px; font-weight: 500; }
  .conflict { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 18px; background: var(--coral-soft); font-size: 12.5px; }
  .conflict .ci { color: var(--coral); flex: none; margin-top: 1px; }

  /* ---------- カレンダー ---------- */
  .mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .mgrid .dow { font-size: 10.5px; color: var(--ink-3); text-align: center; padding: 2px 0 6px; font-weight: 700; }
  .mgrid .dow.sun, .mgrid .d.hol .dn, .mgrid .d.sun .dn { color: var(--rose-500); }
  .mgrid .d { min-height: 62px; border-radius: 12px; padding: 3px 2px 4px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; transition: background .15s; min-width: 0; }
  .mgrid .d:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); }
  .mgrid .d .dn { font-family: var(--font-num); font-size: 12.5px; font-weight: 700; text-align: center; width: 24px; height: 24px; line-height: 24px; border-radius: 50%; margin: 0 auto 1px; flex: none; }
  .mgrid .d.out .dn { color: var(--ink-4); }
  .mgrid .d.today .dn { background: var(--ink); color: var(--bg); }
  .mgrid .d.sel { background: var(--surface); }
  .mgrid .e { font-size: 9px; font-weight: 700; border-radius: 5px; padding: 1px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.45; }
  .mgrid .mo { font-size: 9px; color: var(--ink-3); text-align: center; font-weight: 700; }
  .mgrid .hl { font-size: 8.5px; color: var(--rose-500); text-align: center; font-weight: 700; }
  .web .mgrid { gap: 4px; }
  .web .mgrid .d { min-height: 112px; padding: 6px; background: color-mix(in srgb, var(--surface) 55%, transparent); }
  .web .mgrid .d.sel { background: var(--surface); box-shadow: 0 0 0 2px var(--plum-300); }
  .web .mgrid .d .dn { margin: 0 0 3px; font-size: 13px; }
  .web .mgrid .e { font-size: 11px; padding: 2px 6px; border-radius: 7px; }
  .web .mgrid .mo, .web .mgrid .hl { text-align: left; font-size: 11px; padding-left: 4px; }
  .e.ev, .cb.ev { background: var(--mac-lav); color: var(--mac-lav-ink); }
  .e.mt, .cb.mt { background: var(--mac-blue); color: var(--mac-blue-ink); }
  .e.ps, .cb.ps { background: var(--mac-teal); color: var(--mac-teal-ink); }
  .e.fu, .cb.fu { background: var(--mac-pink); color: var(--mac-pink-ink); }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--ink-2); font-weight: 600; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .wstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .wstrip > div { padding: 6px 0 7px; border-radius: 14px; font-size: 10.5px; color: var(--ink-3); font-weight: 700; cursor: pointer; }
  .wstrip b { display: block; font-family: var(--font-num); font-size: 15px; color: var(--ink); margin-top: 1px; }
  .wstrip .on { background: var(--ink); color: var(--bg); } .wstrip .on b { color: var(--bg); }
  .wstrip .dots { display: flex; gap: 2px; justify-content: center; height: 5px; margin-top: 3px; }
  .wstrip .dots i { width: 4px; height: 4px; border-radius: 50%; }
  .dayv { position: relative; }
  .hr { display: grid; grid-template-columns: 40px 1fr; height: var(--hh); }
  .hr time { font-size: 10.5px; color: var(--ink-3); font-family: var(--font-num); transform: translateY(-7px); font-weight: 600; }
  .hr div { border-top: 1px solid var(--line); }
  .cb { position: absolute; border-radius: 12px; padding: 5px 9px; font-size: 11.5px; overflow: hidden; line-height: 1.35; cursor: pointer; transition: transform .15s var(--ease); }
  .cb:hover { transform: scale(.99); }
  .cb b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cb span { display: block; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cb.clash { box-shadow: 0 0 0 2px var(--coral); }
  .nowline { position: absolute; left: 36px; right: 0; border-top: 2px solid var(--plum-700); z-index: 3; }
  .nowline::before { content: ""; position: absolute; left: -4px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--plum-700); }

  /* ---------- 日程提案 ---------- */
  .wk5 { display: grid; grid-template-columns: 34px repeat(5, 1fr); gap: 3px; }
  .wk5 .h { font-size: 9.5px; color: var(--ink-3); font-family: var(--font-num); text-align: right; padding-right: 4px; transform: translateY(-6px); font-weight: 600; }
  .wk5 .hd { text-align: center; font-size: 11px; font-weight: 800; padding-bottom: 4px; }
  .wk5 .hd small { display: block; font-size: 9.5px; color: var(--ink-3); font-weight: 600; }
  .wk5 .hd.hol small { color: var(--rose-500); }
  .slot { height: 22px; border-radius: 6px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--surface-3); cursor: pointer; font-size: 10px; font-weight: 800; display: grid; place-items: center; transition: background .15s, transform .12s var(--ease); }
  .slot:hover { background: var(--accent-soft); }
  .slot.busy { background: repeating-linear-gradient(135deg, var(--surface-3) 0 2px, var(--surface-2) 2px 6px); box-shadow: none; cursor: not-allowed; }
  .slot.on { box-shadow: none; background: var(--accent); color: var(--on-accent); border-radius: 6px 6px 2px 2px; }
  .slot.on2 { box-shadow: none; background: var(--accent); border-radius: 2px 2px 6px 6px; opacity: .85; }
  .slot.hol { background: transparent; border: 1px dashed var(--surface-3); cursor: not-allowed; }
  .cb.sel { box-shadow: 0 0 0 2px var(--plum-500); }
  .pc { background: var(--surface-2); }
  .pc.pick.on { background: var(--accent); color: var(--on-accent); }
  .web .slot { height: 26px; }
  .cand { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .cand:last-child { border-bottom: 0; }
  .cand .no { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 800; display: grid; place-items: center; flex: none; font-family: var(--font-num); }
</style>
</head>

<div class="doc">
  <div class="doc-head">
    <div>
      <div class="doc-kicker">Orbit Redesign · 2026-10 · 批 3 · iPhone 390×844 / Desktop 1440</div>
      <h1>③ 每日行动：草稿・タスク・フォロー・カレンダー</h1>
      <p>把「今日の一手」走成闭环：起草 → 交给邮件 App → 回来轻确认 → 记到やりとり；任务完成即可一句话记一笔并能撤销；跟进完成时顺手定好下一步；约时间只生成邀请文案；日历分 日/月 两视图。所有邮件/邀请都止于草稿（送信はしません）。粉色编号为交互标注，可在右上关掉；语气切换、勾选框、时段格子、重复规则选项均可点。</p>
    </div>
    <div class="doc-tools">
      <div class="seg" data-ctl="theme"><button data-v="light">ライト</button><button data-v="dark">ダーク</button></div>
      <div class="seg" data-ctl="pins"><button data-v="on" class="on">标注 ON</button><button data-v="off">OFF</button></div>
    </div>
  </div>
  <nav class="doc-nav" id="docnav"></nav>

<script>
/* HV3-SHARED-BEGIN（2026-10-07 全局一致性审计）：app.html / web.html 最新首页「軌道ビュー」・人脈（濃さ+出どころ）・プラン v2 的同源副本；
   由审计脚本从基准文件原样复制生成，包在 IIFE 里只暴露 HV3，避免与本文件私有常量重名。改基准后应重新生成，勿在此手改。 */
const HV3 = (() => {
/* V2KIT-JS-BEGIN */
/* ===== プラン v2 口径（2026-10-07）：数据与计分与 b9-import-plan-v2.html 相同（满点 100 · 不封顶 · 跳过=满额斜纹 · 超目标半分）===== */
const V2 = (() => {
  const PER = {
    cfo: { n: 'CFO 経験者', s: 'CFO', emo: '📊', c: 'teal', w: 10, tgt: 1, unit: 10, step: 1, cand: 1 },
    ent: { n: '調達経験のある起業家', s: '起業家', emo: '🚀', c: 'apricot', w: 15, tgt: 5, unit: 3, step: 2, cand: 2 },
    ang: { n: 'エンジェル投資家', s: 'エンジェル', emo: '🪽', c: 'pink', w: 10, tgt: 2, unit: 5, step: 2, cand: 1 },
    vc: { n: 'VC パートナー', s: 'VC', emo: '💼', c: 'lav', w: 30, tgt: 3, unit: 10, step: 3, cand: 4 },
    cvc: { n: 'CVC 担当者', s: 'CVC', emo: '🏢', c: 'blue', w: 15, tgt: 3, unit: 5, step: 3, cand: 0 },
    law: { n: '弁護士（投資契約）', s: '弁護士', emo: '⚖️', c: 'teal', w: 10, tgt: 1, unit: 10, step: 4, cand: 1 },
    ev: { n: 'イベント', s: 'イベント', emo: '🎟️', c: 'apricot', w: 10, tgt: 2, unit: 5, step: 0, cand: 3, ev: true },
  };
  const ORDER = ['cfo', 'ent', 'ang', 'vc', 'cvc', 'law', 'ev'];
  const ST = {
    s0: { cfo: 0, ent: 0, ang: 0, vc: 0, cvc: 0, law: 0, ev: 0 },
    s46: { cfo: 0, ent: 2, ang: 0, vc: 2, cvc: 0, law: 'skip', ev: 2 },
  };
  const STEPS = [
    [1, 'ピッチと事業計画を固める', '投資家に会う前に、数字と物語の穴を潰しておくと、1回の面談で進む距離が伸びます。', ['cfo'], '同規模のシリーズA 事例 · あなたの目標「3億円」から逆算'],
    [2, '調達経験のある先輩・エンジェルに相談', '最近同じ規模を調達した人から、VC の選び方・相場観・紹介ルートを得られます。', ['ent', 'ang'], '紹介経由の面談は進みやすい傾向（一般的な調達の進め方）'],
    [3, 'VC と接点を持つ', 'リード候補を 3 社以上、並行で。事業会社の CVC は条件の選択肢を増やします。', ['vc', 'cvc'], 'シリーズA の典型的な投資家構成 · あなたの業種（製造業向け SaaS）'],
    [4, 'DD・条件交渉', '投資契約・種類株式の条件は後から変えにくいので、署名前に専門家の目を入れます。', ['law'], '投資契約で論点になりやすい条項（優先清算・希薄化防止）'],
    [5, 'クロージング', '新しく会う人はいません。Step 3・4 の相手と着地させます。', [], ''],
  ];
  const pts = (k, n) => { const p = PER[k]; if (n === 'skip') return { base: p.w, bonus: 0, skip: true, n: 0 }; return { base: Math.min(n, p.tgt) * p.unit, bonus: Math.max(0, n - p.tgt) * p.unit / 2, skip: false, n }; };
  const total = s => ORDER.reduce((a, k) => { const r = pts(k, ST[s][k]); return a + r.base + r.bonus; }, 0);
  const bonusOf = s => ORDER.reduce((a, k) => a + pts(k, ST[s][k]).bonus, 0);
  const skipOf = s => ORDER.reduce((a, k) => { const r = pts(k, ST[s][k]); return a + (r.skip ? r.base : 0); }, 0);
  const talkOf = s => total(s) - bonusOf(s) - skipOf(s);
  const fmt = v => Number.isInteger(v) ? v : v.toFixed(1);
  /* 分数构成条：实色 = 话出来的分 · 斜纹 = 习熟跳过 · 豆沙 = 超目标后的半分；o.thin 细条（首页/小组件），o.labels 类型名 */
  const sbar = (s, o = {}) => {
    const bon = bonusOf(s), scale = Math.max(100, 100 + bon);
    const segs = ORDER.map(k => { const p = PER[k], r = pts(k, ST[s][k]); return `<div class="sg ${r.skip ? 'sk' : ''}" style="flex:${p.w}">${r.skip ? '' : `<b style="width:${r.base / p.w * 100}%"></b>`}</div>`; }).join('') + (bon ? `<div class="sg bonus" style="flex:${bon}"></div>` : '');
    const mark = bon ? `<span class="m100" style="left:${100 / scale * 100}%"><em>満点 100</em></span>` : '';
    const lbls = o.labels ? `<div class="v2slbl">${ORDER.map(k => `<span style="flex:${PER[k].w}">${PER[k].s}</span>`).join('')}${bon ? `<span style="flex:${bon};color:var(--rose-700)">+${fmt(bon)}</span>` : ''}</div>` : '';
    return `<div class="v2bar ${o.thin ? 'thin' : ''} ${o.cls || ''}" ${o.style ? `style="${o.style}"` : ''}>${segs}${mark}</div>${lbls}`;
  };
  const legend = (full = true, cls = '') => `<div class="v2lg ${cls}"><span><i class="v2sw solid"></i>話して得た点</span><span><i class="v2sw hatch"></i>習熟済み（スキップ）</span>${full ? '<span><i class="v2sw bonus"></i>目標超えの加点（半分）</span>' : ''}<span><i class="v2sw"></i>まだの点</span></div>`;
  const mbar = (k, s) => { const p = PER[k], r = pts(k, ST[s][k]); if (r.skip) return '<div class="v2mb sk"></div>'; const tot = p.w + r.bonus; return `<div class="v2mb"><b style="width:${r.base / tot * 100}%"></b>${r.bonus ? `<b class="bo" style="width:${r.bonus / tot * 100}%;margin-left:2px"></b>` : ''}</div>`; };
  const pchips = (k, s) => {
    const p = PER[k], r = pts(k, ST[s][k]), u = p.ev ? '回' : '人';
    if (r.skip) return '<span class="chip">習熟済み · スキップ</span>';
    const a = [`<span class="chip ${r.n >= p.tgt ? 'teal' : ''}">${r.n} / ${p.tgt}${u}${r.n >= p.tgt ? ' 達成' : ''}</span>`];
    if (r.n < p.tgt) a.push(p.cand ? `<span class="chip lav">${p.ev ? `おすすめ ${p.cand}件` : `候補 ${p.cand}人`}</span>` : '<span class="chip">人脈にいません</span>');
    return a.join('');
  };
  const prow = (k, s, cls = '') => { const p = PER[k], r = pts(k, ST[s][k]); return `<div class="v2prow ${cls}"><span class="emo sm ${p.c}">${p.emo}</span><div class="pm"><b>${p.n}</b><div class="chips">${pchips(k, s)}</div></div><div class="pe"><div class="v2pp">${fmt(r.base + r.bonus)}<small> / ${p.w}</small></div>${mbar(k, s)}</div></div>`; };

    ${wk7(many)}
    <div class="wk-open" style="--nx:${2.5 / 7 * 100}%">${TODAY_TL(many).map(([t, c, n, d]) => `<div class="tl"><time>${t}</time><div class="blk mac ${c}"><b style="font-size:13px">${n}</b><div class="lbl">${d}</div></div></div>`).join('')}${many ? '' : '<div class="ghost-row" style="margin-top:10px"><i></i>カレンダーを連携すると、面談も並びます</div>'}</div></div>`;

      <div class="row" style="gap:10px;align-items:baseline;margin-top:8px"><div class="big">${num(V2.total(S))}</div><span class="lbl">${many ? `話して ${V2.talkOf(S)} · スキップ ${V2.skipOf(S)} · 満点 100 · 上限なし` : '最初の一歩 · 満点 100 · 上限なし'}</span></div>

  const evaluator = (big) => `<div class="card rise" ${big ? 'style="padding:22px"' : ''}>
      <div class="row" style="gap:10px;margin-bottom:12px"><span class="emo lav">🔍</span><div><b style="font-size:${big ? 17 : 14.5}px">このイベント、行く価値ある？</b><div class="lbl">URLかポスター画像を入れるだけ</div></div></div>
      <div class="drop"><div class="row" style="justify-content:center;gap:8px;color:var(--ink-2);font-size:12.5px">${ic('link', 'sm')}URLを貼り付け　|　${ic('image', 'sm')}ポスターを選ぶ</div></div>
      ${big ? `<div style="margin-top:14px;display:grid;gap:8px">${[['🎯', '目標との一致', 'シリーズA調達に効くか'], ['🤝', '会える人', 'あなたのプランが求める人が来るか'], ['⏱️', '時間対効果', '移動・参加費・平日夜の負担']].map(([e, t, d]) => `<div class="row" style="gap:10px"><span class="emo sm apricot">${e}</span><div><b style="font-size:12.5px">${t}</b><div class="lbl">${d}</div></div></div>`).join('')}</div>` : ''}
    </div>`;
  head += `<div class="seg k-evseg" style="display:flex;margin-bottom:14px"><button class="on" style="flex:1">評価</button><button style="flex:1">参加予定${s === 'empty' ? '' : ` ${s === 'many' ? 3 : 1}`}</button><button style="flex:1">探す</button></div>`;
  if (s === 'empty') return head + evaluator(true) + `
    <div class="card" style="margin-top:14px"><div class="card-h"><h3>判定の例 <span class="sample-tag">サンプル</span></h3></div>
      <div class="faded">${evCard(E[0]).replace('class="ev-card"', 'class="ev-card" style="width:auto;padding:0"')}</div></div>
    <div class="card flat"><div class="row"><span class="emo sm teal">🗓️</span><div><b style="font-size:13px">招待されたイベント</b><div class="lbl">招待コードがあればここから参加登録</div></div><button class="btn sm" style="margin-left:auto">入力</button></div></div>`;
  const many = s === 'many';
  return head + evaluator(false) + `

    <div class="carousel">${(many ? [E[1], E[0], E[2]] : [E[1]]).map(e => `<div class="ev-card" style="width:${many ? 300 : 354}px;background:linear-gradient(160deg,var(--mac-lav),var(--surface) 60%)">
      <div class="row between"><span class="chip">${e.d}</span>${e === E[1] ? '<span class="chip apricot">今夜</span>' : ''}</div>

      <div class="row" style="margin-top:14px"><div class="avs">${C.slice(0, 4).map(c => `<div class="av sm ${c.c}">${c.i}</div>`).join('')}</div><span class="lbl">会いたい人 ${e.meet}名</span></div>
      <button class="btn sm primary block" style="margin-top:12px">会う準備をする</button></div>`).join('')}</div>${many ? '<div class="dots"><i class="on"></i><i></i><i></i></div>' : ''}</div>
    <div class="card" style="margin-top:18px;padding:8px 16px"><div class="card-h" style="margin:8px 0 0"><h3>評価したイベント</h3><span class="more">スコア順</span></div>
      <div class="list">${(many ? E : E.slice(0, 2)).map(e => `<div class="li">${ring(44, 5, [{ v: e.score, c: e.score > 70 ? 'var(--plum-700)' : e.score > 50 ? 'var(--plum-500)' : 'var(--rose-500)', max: 100 }], `<span class="score" style="font-size:12px">${e.score}</span>`)}<div class="meta"><b>${e.n}</b><span>${e.d} · ${e.fee}</span></div><span class="chip ${vchip(e)}">${e.v}</span></div>`).join('')}</div></div>`;
}

/* ---- 本页交互 ---- */
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tone]');
  if (tb) {
    const scope = tb.closest('.drawer, .phone, .web'); const body = scope && scope.querySelector('[data-body]');
    if (body) { body.style.transition = 'opacity .2s'; body.style.opacity = 0; setTimeout(() => { body.innerHTML = BODY[tb.dataset.tone] + '<span class="caret"></span>'; body.style.opacity = 1; }, 200); }
  }
  const ck = e.target.closest('.ckr');
  if (ck) { ck.classList.toggle('on'); const t = ck.closest('.tk'); if (t) t.classList.toggle('done', ck.classList.contains('on')); }
  const sl = e.target.closest('.slot');
  if (sl && !sl.classList.contains('busy') && !sl.classList.contains('hol') && !sl.classList.contains('on2')) sl.classList.toggle('on');
  const pk = e.target.closest('.pick');
  if (pk) { const grp = pk.parentElement; if (grp.hasAttribute('data-multi')) pk.classList.toggle('on'); else grp.querySelectorAll('.pick').forEach(x => x.classList.toggle('on', x === pk)); }
  const op = e.target.closest('.opt');
  if (op) op.parentElement.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === op));
  const tg = e.target.closest('.tgl');
  if (tg) tg.classList.toggle('on');
  const d = e.target.closest('.mgrid .d');
  if (d) d.parentElement.querySelectorAll('.d').forEach(x => x.classList.toggle('sel', x === d));
});
