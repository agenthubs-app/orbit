<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit 设计系统</title>
<link rel="stylesheet" href="kit/tokens.css">
<link rel="stylesheet" href="kit/ui.css">
<script src="kit/kit.js"></script>
<style>
  .doc { max-width: 1320px; min-width: 1320px; margin: 0 auto; }
  .sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .sw > div { background: var(--surface); border-radius: 18px; padding: 10px; }
  .sw i { display: block; height: 60px; border-radius: 12px; margin-bottom: 8px; }
  .sw b { font-size: 12px; display: block; } .sw code { font-size: 10.5px; color: var(--ink-3); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .type > div { display: flex; align-items: baseline; gap: 18px; padding: 10px 0; border-top: 1px solid var(--line); }
  .type code { width: 160px; font-size: 11px; color: var(--ink-3); flex: none; }
  .icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; }
  .icons > div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 10.5px; color: var(--ink-3); }
  table.m { width: 100%; border-collapse: collapse; font-size: 12.5px; background: var(--surface); border-radius: 20px; overflow: hidden; }
  table.m th, table.m td { text-align: left; padding: 10px 14px; border-top: 1px solid var(--line); }
  table.m th { background: var(--surface-2); font-size: 11px; color: var(--ink-3); border: 0; }
  .demo-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* ================= 第二部分：跨页组件规范（从 b1–b6 提炼；2026-10-07 起统一类已收进 kit/ui.css 末尾，本页只留文档展示用样式） ================= */
  .part-head { margin-top: 64px; padding-top: 26px; border-top: 1.5px dashed var(--surface-3); }
  .part-head h2 { font-size: 23px; font-weight: 800; }
  .part-head p { font-size: 13px; color: var(--ink-2); margin-top: 6px; max-width: 980px; line-height: 1.7; }
  .toc { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .toc a { padding: 6px 12px; border-radius: 999px; background: var(--surface); font-size: 12px; font-weight: 700; color: var(--ink-2); }
  .toc a:hover { background: var(--accent-soft); color: var(--ink); }
  .comp { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 18px; align-items: start; }
  .comp.wide { grid-template-columns: minmax(0, 1fr); }
  .comp + .comp { margin-top: 18px; }
  .doccard { background: var(--surface); border-radius: 20px; padding: 16px 18px; font-size: 12.5px; color: var(--ink-2); line-height: 1.65; }
  .doccard h5 { font-size: 11.5px; color: var(--ink-3); font-weight: 800; margin: 14px 0 6px; letter-spacing: .04em; }
  .doccard h5:first-child { margin-top: 0; }
  .doccard p { color: var(--ink); }
  .rules { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 7px 12px; }
  .rules dt { font-weight: 800; color: var(--ink); font-size: 12px; }
  .rules dd { min-width: 0; }
  .rules code, .doccard code, table.m code { font-size: 11px; background: var(--surface-2); padding: 0 5px; border-radius: 5px; color: var(--ink-2); }
  .src { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 11px; color: var(--ink-3); font-weight: 700; }
  .src span { background: var(--surface-2); padding: 2px 8px; border-radius: 8px; color: var(--ink-2); font-weight: 600; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-width: 0; }
  .duo.stack { grid-template-columns: minmax(0, 1fr); }
  .stage { position: relative; border-radius: 22px; padding: 34px 18px 18px; min-width: 0; overflow: hidden; color: var(--ink);
    background: radial-gradient(420px 260px at 0% 0%, var(--fog-a), transparent 70%), radial-gradient(420px 260px at 100% 0%, var(--fog-b), transparent 70%), var(--bg);
    box-shadow: 0 0 0 1px var(--line); }
  .stage-t { position: absolute; left: 16px; top: 11px; font-size: 10.5px; font-weight: 800; color: var(--ink-3); letter-spacing: .08em; }
  .srow { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
  .cell { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .cap { font-size: 11px; color: var(--ink-3); font-weight: 800; }
  .mini { position: relative; flex: none; }
  .mini > div { transform-origin: 0 0; }
  table.m.spec td { vertical-align: top; line-height: 1.6; }
  table.m.spec td:first-child { white-space: nowrap; }
  .ds .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  /* --- Toast --- */

  /* --- 确认框 --- */
  .ds .focus { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--plum-500); }
  .ds .asheet { width: 360px; background: var(--surface); border-radius: 34px; padding: 10px 18px 22px; box-shadow: var(--shadow-float); }
  .ds .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--surface-3); margin: 0 auto 14px; }
  .ds .scrimbox { position: relative; border-radius: 22px; overflow: hidden; display: grid; place-items: center; padding: 26px 18px; background: var(--scrim); }
  .ds .scrimbox.wsc { background: var(--scrim-web); }
  /* 文档展示用：把 kit 的绝对定位弹层放回文档流（只在本页） */
  .ds .dialog.static, .ds .wmodal.static { position: relative; left: auto; top: auto; transform: none; animation: none; }
  .ds .scrimbox.bottom { place-items: end center; padding-bottom: 8px; }

  /* --- 弹层容器 --- */
  .ds .frame { position: relative; border-radius: 22px; overflow: hidden; background: var(--bg); box-shadow: 0 0 0 1px var(--line); flex: none; }
  .ds .frame .ghostui { position: absolute; inset: 0; padding: 14px; display: grid; gap: 8px; align-content: start; }
  .ds .frame .ghostui i { display: block; height: 34px; border-radius: 12px; background: var(--surface); }
  .ds .frame .sheet { left: 6px; right: 6px; bottom: 6px; border-radius: 30px; padding: 8px 14px 16px; }
  .ds .frame .drawer { position: absolute; top: 10px; right: 10px; bottom: 10px; width: 42%; border-radius: 20px; background: var(--bg); padding: 14px; box-shadow: var(--shadow-float); display: flex; flex-direction: column; gap: 8px; }
  .ds .pop { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-float); border: 1px solid var(--line); padding: 16px; }

  /* --- AI 确认卡三态 --- */
  .ds .lnk { font-size: 12.5px; font-weight: 700; color: var(--plum-700); display: inline-flex; align-items: center; gap: 2px; }
  .ds .yn { display: flex; gap: 8px; }
  .ds .yn button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); }
  .ds .yn button.on { background: var(--plum-700); color: var(--on-accent); }
  .ds .chip.sugg { background: transparent; border: 1.5px dashed var(--plum-300); color: var(--ink-2); padding-right: 4px; }
  .ds .chip.sugg .k { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--surface-2); font-size: 10px; }

  /* --- 依据 --- */

  /* --- 权限 --- */
  .ds .perm-art { width: 132px; height: 132px; border-radius: 40px; display: grid; place-items: center; font-size: 60px; margin: 30px auto 22px; position: relative; }
  .ds .perm-li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; font-size: 13.5px; line-height: 1.55; }
  .ds .perm-li + .perm-li { border-top: 1px solid var(--line); }
  .ds .h1 { font-size: 24px; font-weight: 900; line-height: 1.35; text-align: center; }
  .ds .phone .foot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; padding: 22px 18px 30px; background: linear-gradient(to bottom, transparent, var(--bg) 28%); display: grid; gap: 8px; }

  /* --- 加载 --- */
  .ds .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--surface-3); border-top-color: var(--plum-700); animation: dsSpin .9s linear infinite; display: inline-block; flex: none; }
  .ds .btn .spin { border-color: color-mix(in srgb, currentColor 25%, transparent); border-top-color: currentColor; }
  @keyframes dsSpin { to { transform: rotate(360deg); } }
  .ds .pchk { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13px; }
  .ds .pchk .bx { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--ink-4); }
  .ds .pchk .bx svg.i { width: 13px; height: 13px; stroke-width: 2.4; }
  .ds .pchk.d .bx { background: var(--ok); color: var(--surface); }
  .ds .pchk.d { color: var(--ink-2); } .ds .pchk.n { font-weight: 800; } .ds .pchk.w { color: var(--ink-4); }
  .ds .pchk .cnt2 { margin-left: auto; font-family: var(--font-num); font-size: 11.5px; color: var(--ink-3); font-weight: 700; }
  .ds .orb { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; background: radial-gradient(circle at 35% 30%, var(--surface), var(--mac-lav) 70%); animation: dsOrb 2.4s var(--ease) infinite; flex: none; }
  @keyframes dsOrb { 50% { box-shadow: 0 0 0 12px color-mix(in srgb, var(--plum-300) 22%, transparent); } }
  .ds .thinking { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
  .ds .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--plum-500); animation: dsBlink 1.2s infinite; }
  .ds .thinking i:nth-child(2) { animation-delay: .2s; } .ds .thinking i:nth-child(3) { animation-delay: .4s; }
  @keyframes dsBlink { 50% { opacity: .25; } }
  .ds .stopb { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; }
  .ds .stopb i { width: 11px; height: 11px; border-radius: 3px; background: currentColor; display: block; }

  /* --- 离线 / 错误 / 降级 --- */
  .ds .offline { display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 14px; border-radius: 16px; background: var(--mac-apricot); color: var(--mac-apricot-ink); font-size: 12px; font-weight: 700; }
  .ds .offline.back { background: var(--mac-teal); color: var(--mac-teal-ink); }
  .ds .offline .pend { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: var(--surface); color: var(--mac-apricot-ink); font-size: 11px; font-family: var(--font-num); flex: none; }
  .ds .syncing { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; color: var(--mac-apricot-ink); font-weight: 700; white-space: nowrap; }
  .ds .degrade { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 18px; background: var(--surface-2); font-size: 12px; color: var(--ink-2); }
  .ds .err-card { text-align: center; padding: 24px 20px; }
  .ds .err-ic { width: 54px; height: 54px; border-radius: 18px; background: var(--coral-soft); color: var(--coral); display: grid; place-items: center; margin: 0 auto 12px; }
  .ds .input.err { box-shadow: inset 0 0 0 1.5px var(--coral); color: var(--ink); background: var(--surface); }
  .ds .fmsg { margin-top: 6px; padding: 9px 12px; border-radius: 12px; background: var(--coral-soft); font-size: 12px; color: var(--ink); line-height: 1.55; }
  .ds .fmsg b { color: var(--coral); }

  /* --- 示例模式 --- */
  .ds .samplebar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: var(--mac-apricot); color: var(--mac-apricot-ink); font-size: 11.5px; font-weight: 700; }
  .ds .samplebar .btn { background: var(--surface); color: var(--ink); }
  .ds .samplebar .x { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .ds .spill { display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px 6px 9px; border-radius: 999px; background: var(--mac-apricot); color: var(--mac-apricot-ink); font-size: 11.5px; font-weight: 800; box-shadow: var(--shadow-float); }

  /* --- 付费 --- */
  .ds .qchip { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  .ds .qchip i { width: 6px; height: 6px; border-radius: 50%; background: var(--plum-500); }
  .ds .qchip.out i { background: var(--coral); }
  .ds .qdots { display: flex; gap: 5px; }
  .ds .qdots i { width: 26px; height: 8px; border-radius: 4px; background: var(--plum-500); }
  .ds .qdots i.u { background: var(--surface-3); }
  .ds .cmp { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .ds .cmp th { font-size: 12px; font-weight: 800; padding: 8px 6px 10px; text-align: center; }
  .ds .cmp th:first-child { text-align: left; }
  .ds .cmp td { padding: 9px 6px; border-top: 1px solid var(--line); text-align: center; color: var(--ink-2); }
  .ds .cmp td:first-child { text-align: left; color: var(--ink); font-weight: 600; }
  .ds .cmp .col-on { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); color: var(--ink); font-weight: 700; }

  /* --- 推送 --- */
  .ds .lockbg { position: relative; border-radius: 26px; padding: 18px 12px 14px; color: var(--plum-900); overflow: hidden;
    background: radial-gradient(260px 220px at 85% 10%, var(--rose-300), transparent 70%), radial-gradient(280px 260px at 5% 95%, var(--plum-300), transparent 70%), linear-gradient(170deg, var(--plum-100), var(--rose-100) 55%, var(--plum-300)); }
  .ds .lockbg .clk { text-align: center; font-family: var(--font-num); font-size: 46px; font-weight: 800; line-height: 1; letter-spacing: -.02em; margin-bottom: 14px; }
  .ds .appic { width: 34px; height: 34px; border-radius: 9px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 900; font-size: 15px; flex: none; }
  .ds .pmenu { margin-top: 8px; margin-left: auto; width: 240px; background: var(--glass); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid var(--glass-line); border-radius: 18px; overflow: hidden; color: var(--ink); }
  .ds .pmenu div { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-size: 12.5px; font-weight: 600; }
  .ds .pmenu div + div { border-top: 1px solid var(--line); }
  .ds .deep { display: flex; gap: 8px; align-items: center; padding: 9px 12px; border-radius: 14px; background: var(--accent-soft); font-size: 12px; font-weight: 700; margin-bottom: 12px; }
  .ds .hl { box-shadow: 0 0 0 2px var(--plum-500), 0 0 0 9px color-mix(in srgb, var(--plum-500) 16%, transparent); animation: dsHl 2.4s var(--ease) infinite; }
  @keyframes dsHl { 50% { box-shadow: 0 0 0 2px var(--plum-500), 0 0 0 16px color-mix(in srgb, var(--plum-500) 4%, transparent); } }

  /* --- 键盘 --- */
  .ds .tipw { position: relative; display: inline-flex; max-width: 100%; }
  .ds .tip-b { position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 6; width: max-content; max-width: 280px; padding: 7px 10px; border-radius: 11px; background: var(--ink); color: var(--bg); font-size: 11.5px; font-weight: 600; line-height: 1.5; white-space: normal; display: flex; gap: 6px; align-items: center; }
  .ds .tip-b::after { content: ""; position: absolute; left: 18px; top: 100%; border: 6px solid transparent; border-top-color: var(--ink); }

  /* --- 长文案 --- */
  .ds .clamp1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ds .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ds .jp { word-break: auto-phrase; line-break: strict; }
  .ds .okng { font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
  .ds .okng.ok { background: var(--mac-teal); color: var(--mac-teal-ink); } .ds .okng.bad { background: var(--coral-soft); color: var(--coral); }

  /* --- 不一致清单 --- */
  table.m.inc td:nth-child(1) { font-weight: 800; color: var(--ink-3); font-family: var(--font-num); width: 34px; }
  table.m.inc td:nth-child(2) { font-weight: 700; white-space: nowrap; }
  table.m.inc td { vertical-align: top; line-height: 1.6; }
  .lv { font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .stt { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: var(--mac-teal); color: var(--mac-teal-ink); white-space: nowrap; margin-bottom: 3px; }
  .stt.part { background: var(--mac-apricot); color: var(--mac-apricot-ink); }
  table.m.inc td:nth-child(6) { min-width: 330px; }
  .lv.h { background: var(--coral-soft); color: var(--coral); } .lv.m { background: var(--mac-apricot); color: var(--mac-apricot-ink); } .lv.l { background: var(--surface-2); color: var(--ink-3); }
</style>
</head>

<div class="doc">
  <div class="doc-head"><div><div class="doc-kicker">Orbit Redesign · 2026-10</div><h1>设计系统</h1><p>原则：明亮柔和像精致记账 App；可爱克制（emoji 只在分类图标出现，按钮一律线性图标）；层次靠浅色块而不是阴影与描边；关键数字大而粗。Token 文件：<code>kit/tokens.css</code>。</p></div>
    <div class="doc-tools"><div class="seg" data-ctl="theme"><button data-v="light">ライト</button><button data-v="dark">ダーク</button></div></div></div>
  <nav class="doc-nav" id="docnav"></nav>
  <div id="out"></div>
</div>
<script>
const sw = (list) => `<div class="sw">${list.map(([n, v, d]) => `<div><i style="background:var(${v})"></i><b>${n}</b><code>${v}${d ? ' · ' + d : ''}</code></div>`).join('')}</div>`;
const sec = (t, s) => `<div class="section-title"><h2>${t}</h2><span>${s || ''}</span></div>`;
let h = '';
h += sec('颜色 · 底与面', '切换右上可看深色值');
h += sw([['底', '--bg', '#F7F5F7'], ['卡片', '--surface'], ['卡内色块', '--surface-2'], ['轨道', '--surface-3'], ['正文', '--ink'], ['次级', '--ink-2'], ['标签', '--ink-3'], ['雾·薰衣草', '--fog-a'], ['雾·烟粉', '--fog-b']]);
h += sec('颜色 · 数据单色系', '环形图与进度条只用这两组深浅；不引入第三色相');
h += sw([['灰紫 900', '--plum-900'], ['灰紫 700', '--plum-700', '主强调'], ['灰紫 500', '--plum-500'], ['灰紫 300', '--plum-300'], ['灰紫 100', '--plum-100'], ['豆沙 700', '--rose-700'], ['豆沙 500', '--rose-500', '目标/进度'], ['豆沙 300', '--rose-300'], ['珊瑚', '--coral', '超标/警告']]);
h += sec('颜色 · 马卡龙（类型区分，只占小面积）', '用于 emoji 图标底、chip、迷你卡；不用作整张卡底');
h += `<div class="demo-row">${[['pink', '💼', '投资・金融 / 要フォロー'], ['apricot', '📇', '名刺・取込 / 注意'], ['blue', '🏭', '製造業 / 関係構築'], ['teal', '🤝', '協業 / 完了'], ['lav', '✨', 'iOrbit / 推進中']].map(([c, e, t]) => `<div class="card row" style="gap:10px;padding:12px 14px"><span class="emo ${c}">${e}</span><div><span class="chip ${c}">${c}</span><div class="lbl" style="margin-top:4px">${t}</div></div></div>`).join('')}</div>`;
h += sec('字体与层级', 'SF Pro / Noto Sans JP；数字用 SF Pro Rounded + tabular-nums');
h += `<div class="card type">
  <div><code>Big Number 38–46 / 800</code><span class="big">286<small>人</small></span></div>
  <div><code>Title 20–26 / 800</code><span style="font-size:22px;font-weight:800">3ステップで、あなた専用の人脈プランへ</span></div>
  <div><code>Card title 14.5 / 800</code><span style="font-size:14.5px;font-weight:800">あなたの判断待ち</span></div>
  <div><code>Body 13–14 / 500–700</code><span style="font-size:14px">高橋さんへ昨日の面談のお礼を。</span></div>
  <div><code>Label 11.5 / 500 ink-3</code><span class="lbl">今月つながった人</span></div></div>`;
h += sec('组件');
h += `<div class="three">
