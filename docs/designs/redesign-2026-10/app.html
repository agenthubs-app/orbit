<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit App 新UI</title>
<link rel="stylesheet" href="kit/tokens.css">
<link rel="stylesheet" href="kit/ui.css">

<script src="kit/data.js"></script>
<style>
  .hero-num { display: flex; align-items: flex-end; justify-content: space-between; }
  .mini3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .mini3 > div { background: var(--surface-2); border-radius: 14px; padding: 10px 11px; }
  .mini3 b { font-family: var(--font-num); font-size: 19px; font-weight: 800; display: block; line-height: 1.2; }
  .tl { display: grid; grid-template-columns: 46px 1fr; gap: 10px; align-items: start; }
  .tl + .tl { margin-top: 12px; }
  .tl time { font-family: var(--font-num); font-weight: 800; font-size: 13px; padding-top: 9px; }
  .tl .blk { border-radius: 16px; padding: 10px 12px; }
  .ev-card { width: 248px; border-radius: 22px; background: var(--surface); padding: 16px; }
  .score { font-family: var(--font-num); font-weight: 800; }
  .qa { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .qa button { background: var(--surface); border-radius: 20px; padding: 14px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700; transition: transform .15s var(--ease); }
  .qa button:active { transform: scale(.95); }
  .addgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .addgrid button { border-radius: 20px; background: var(--surface-2); padding: 14px 6px 12px; display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; }
  .addgrid button small { font-size: 9.5px; color: var(--ink-3); font-weight: 600; }
  .wk { display: flex; gap: 4px; margin-top: 10px; }
  .wk i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-3); }
  .wk i.d { background: var(--plum-500); } .wk i.n { background: var(--plum-700); box-shadow: 0 0 0 2px var(--plum-100); }
  .drop { border: 1.6px dashed var(--plum-300); border-radius: 18px; padding: 16px; text-align: center; background: color-mix(in srgb, var(--accent-soft) 60%, transparent); }
  .crit { display: grid; grid-template-columns: 74px 1fr 30px; gap: 10px; align-items: center; font-size: 12px; }
  .crit + .crit { margin-top: 6px; }
  .crit .bar { margin: 0; }
  .tags-in { display: flex; gap: 6px; overflow: hidden; }
  .goaltiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .goaltiles button { background: var(--surface); border-radius: 20px; padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 8px; font-weight: 700; font-size: 13px; border: 2px solid transparent; transition: border-color .2s, transform .15s; }
  .goaltiles button.on { border-color: var(--plum-500); }
  .goaltiles button small { font-size: 11px; color: var(--ink-3); font-weight: 500; }
  .samplebar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 14px; background: var(--mac-apricot); color: var(--mac-apricot-ink); font-size: 11.5px; font-weight: 700; margin-bottom: 12px; }
  /* V2KIT-CSS-BEGIN */
  /* ===== プラン v2 口径（2026-10-07）：视觉与数字与 b9-import-plan-v2.html 一致；类名加 v2 前缀避免与本页私有类冲突 ===== */
  .v2bar { display: flex; gap: 3px; height: 14px; position: relative; margin-top: 18px; }
  .v2bar.thin { height: 8px; gap: 2px; margin-top: 12px; }
  .v2bar .sg { position: relative; border-radius: 5px; background: var(--surface-3); overflow: hidden; min-width: 6px; }
  .v2bar.thin .sg { border-radius: 3px; min-width: 3px; }
  .v2bar .sg > b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--plum-700); animation: v2grow 1.2s var(--ease) both; }
  .v2bar .sg.sk, .v2sw.hatch, .v2mb.sk { background: repeating-linear-gradient(135deg, var(--plum-300) 0 2px, var(--plum-100) 2px 6px); }
  .v2bar .sg.bonus { background: var(--rose-500); }
  .v2bar .m100 { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--ink-2); border-radius: 1px; z-index: 2; }
  .v2bar .m100 em { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 9.5px; font-weight: 800; color: var(--ink-2); font-family: var(--font-num); white-space: nowrap; }
  .v2slbl { display: flex; gap: 3px; margin-top: 6px; }
  .v2slbl span { font-size: 10px; color: var(--ink-3); font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 6px; }
  @keyframes v2grow { from { width: 0; } }
  .v2lg { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 12px; font-size: 11px; color: var(--ink-2); font-weight: 600; }
  .v2lg span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .v2sw { width: 14px; height: 9px; border-radius: 3px; background: var(--surface-3); display: inline-block; flex: none; }
  .v2sw.solid { background: var(--plum-700); } .v2sw.bonus { background: var(--rose-500); }
  /* 人物类型行 */
  .v2prow { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
  .v2prow + .v2prow { border-top: 1px solid var(--line); }
  .v2prow .pm { flex: 1; min-width: 0; }
  .v2prow .pm b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .v2prow .pm .chips { margin-top: 4px; flex-wrap: nowrap; overflow: hidden; }
  .v2prow .pe { width: 76px; flex: none; text-align: right; }
  .v2pp { font-family: var(--font-num); font-weight: 800; font-size: 15px; white-space: nowrap; }
  .v2pp small { font-size: 11px; color: var(--ink-3); font-weight: 700; }
  .v2mb { height: 5px; border-radius: 3px; background: var(--surface-3); margin-top: 4px; overflow: hidden; position: relative; display: flex; }
  .v2mb > b { height: 100%; background: var(--plum-700); animation: v2grow 1.2s var(--ease) both; }
  .v2mb > b.bo { background: var(--rose-500); }
  /* Step 竖排 + 人物类型卡 */
  .v2step { position: relative; padding-left: 40px; }
  .v2step + .v2step { margin-top: 16px; }
  .v2step::before { content: ""; position: absolute; left: 13px; top: 32px; bottom: -16px; width: 2px; background: var(--surface-3); border-radius: 1px; }
  .v2step:last-child::before { display: none; }
  .v2step .sn { position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 800; font-size: 12.5px; font-family: var(--font-num); }
  .v2step .st { font-size: 14.5px; font-weight: 800; line-height: 1.4; padding-top: 4px; display: flex; gap: 8px; align-items: flex-start; }
  .v2step .st > span:first-child { flex: 1; }
  .v2pcard { background: var(--surface); border-radius: 18px; padding: 12px 14px; margin-top: 8px; }
  .card .v2pcard { background: var(--surface-2); } .card .v2pcard .pts > div { background: var(--surface); }
  .v2pcard .row b { font-size: 13.5px; }
  .v2pcard .pts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .v2pcard .pts > div { background: var(--surface-2); border-radius: 12px; padding: 6px 8px; }
  .v2pcard .pts b { font-family: var(--font-num); font-size: 16px; font-weight: 800; display: block; line-height: 1.2; }
  .v2snum { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 800; font-size: 12.5px; font-family: var(--font-num); flex: none; }
  .v2ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 首页：人脉首卡 */
  .v2avs { display: flex; align-items: center; }
  .v2avs .av { border: 2px solid var(--surface); margin-left: -8px; } .v2avs .av:first-child { margin-left: 0; }
  .v2avs .more { margin-left: 6px; font-family: var(--font-num); font-weight: 800; font-size: 12px; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 3px 8px; white-space: nowrap; }
  .v2split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .v2split > div { background: var(--surface-2); border-radius: 14px; padding: 9px 11px; min-width: 0; }
  .v2split b { font-family: var(--font-num); font-size: 19px; font-weight: 800; display: block; line-height: 1.2; }
  .v2split .bar { margin: 6px 0 0; }
  .v2spark { display: block; overflow: visible; }
  .v2spark .ln { fill: none; stroke: var(--plum-700); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .v2spark .ar { fill: var(--plum-100); opacity: .8; stroke: none; }
  .v2spark .pt { fill: var(--plum-700); }
  .v2go { display: flex; align-items: center; gap: 4px; margin-top: 12px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
  .v2chance { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: var(--mac-lav); color: var(--mac-lav-ink); font-size: 11.5px; font-weight: 800; white-space: nowrap; }
  .v2today { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px; border-radius: 16px; background: var(--surface-2); }
  .v2today .meta { flex: 1; min-width: 0; }
  .v2today .meta b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .v2today .meta span { display: block; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .v2plus { font-family: var(--font-num); font-weight: 900; font-size: 15px; color: var(--plum-700); white-space: nowrap; flex: none; }
  /* V2KIT-CSS-END */
  /* HOME-V3-CSS-BEGIN */
  /* NAV-V3：首页去掉「軌道ビュー」样式；以下 今週 / 今日の一手 / 人脈 样式保留（组件库与 Task 仍用） */
  /* 今週ストリップ */
  .wk7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .wd { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 8px; border-radius: 999px; transition: background .2s var(--ease); }
  .wd small { font-size: 10px; font-weight: 700; color: var(--ink-3); }
  .wd b { font-family: var(--font-num); font-size: 15px; font-weight: 800; line-height: 1.1; }
  .wd .dts { display: flex; gap: 2px; height: 5px; }
  .wd .dts i { width: 5px; height: 5px; border-radius: 50%; }
  .dts i.lav { background: var(--mac-lav-ink); } .dts i.blue { background: var(--mac-blue-ink); } .dts i.apricot { background: var(--mac-apricot-ink); } .dts i.teal { background: var(--mac-teal-ink); } .dts i.pink { background: var(--mac-pink-ink); }
  .wd.past { opacity: .45; }
  .wd.on { background: var(--ink); color: var(--bg); } .wd.on small { color: inherit; opacity: .7; } .wd.on .dts i { box-shadow: 0 0 0 1.5px var(--ink); }
  .wk-open { margin-top: 10px; background: var(--surface-2); border-radius: 18px; padding: 12px; position: relative; animation: wkOpen .45s var(--ease) both; }
  .wk-open::before { content: ""; position: absolute; top: -5px; left: var(--nx); width: 12px; height: 12px; margin-left: -6px; background: var(--surface-2); transform: rotate(45deg); border-radius: 2px; }
  .wk-open .tl .blk { background-clip: padding-box; }
  @keyframes wkOpen { from { opacity: 0; transform: translateY(-4px); } }
  /* 今日の一手：卡片堆叠 */
  .nstack { position: relative; padding-bottom: 14px; margin-top: var(--gap); }
  .nstack + .card, .nstack + div { margin-top: 6px; }
  .nst-back { position: absolute; left: 0; right: 0; top: 0; bottom: 14px; border-radius: var(--r-xl); background: var(--surface); }
  .nst-back.b1 { transform: translateY(7px) scale(.95); opacity: .75; }
  .nst-back.b2 { transform: translateY(14px) scale(.9); opacity: .45; }
  .nst-front { position: relative; z-index: 2; background: linear-gradient(135deg, var(--mac-lav), var(--surface) 70%); animation: nstNudge 3.6s var(--ease) 1.6s 1; }
  .nst-face { display: none; } .nst-face.on { display: block; }
  .nst-n { font-family: var(--font-num); font-weight: 800; font-size: 12px; color: var(--ink-3); }
  .nst-next { width: 28px; height: 28px; background: var(--surface); }
  @keyframes nstNudge { 18% { transform: translateX(-26px) rotate(-2.5deg); } 42%, 100% { transform: none; } }
  /* 人脈：信息浓度三点 / 来源 / 5 门（与 ⑨ b9 同款） */
  .chip svg.i { width: 12px; height: 12px; }
  .dn { display: inline-flex; gap: 3px; align-items: center; flex: none; }
  .dn i { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-3); }
  .dn.d1 i:nth-child(1), .dn.d2 i:nth-child(-n+2), .dn.d3 i { background: var(--plum-700); }
  .rend { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
  .stack3 { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; margin-top: 10px; }
  .stack3 > i { display: block; height: 100%; }
  .door { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 18px; background: var(--surface-2); }
  .door + .door { margin-top: 8px; }
  .door .dm { flex: 1; min-width: 0; }
  .door b { font-size: 14px; display: block; }
  .door .gets { font-size: 11.5px; color: var(--ink-2); line-height: 1.5; margin-top: 1px; }
  .doors2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .doors2 .door, .wmodal .door { flex-direction: column; align-items: flex-start; gap: 8px; margin: 0; }
  .doors2 .door .row, .wmodal .door .row { width: 100%; }
  .addgrid.g5 { grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .addgrid.g5 button { padding: 10px 2px 9px; gap: 5px; font-size: 10.5px; line-height: 1.25; text-align: center; border-radius: 16px; }
  @media (prefers-reduced-motion: reduce) {
    .nst-front, .wk-open { animation: none !important; }
  }
  /* HOME-V3-CSS-END */
</style>
</head>

<div class="doc" style="min-width:1300px">
  <div class="doc-head">
    <div>
      <div class="doc-kicker">Orbit Redesign · 2026-10 · iPhone 390×844</div>
      <h1>App 新 UI</h1>
      <p>NAV-V3（2026-10-08）：底部 5 项 ホーム / 人脈 / iOrbit / イベント / Task，取消浮动「＋追加」与各页右上的 ✨ 圆钮；首页 = 可自定义组件容器；iOrbit 全屏；プラン 收进 Task。每个关键页三种数据状态（新用户/少量/大量），粉色编号为交互标注，可在右侧关掉。卡片可左右滑、行可左滑、圆环与数字在切主题时会重放动效。</p>

      <div class="seg" data-ctl="theme"><button data-v="light">ライト</button><button data-v="dark">ダーク</button></div>
      <div class="seg" data-ctl="pins"><button data-v="on" class="on">标注 ON</button><button data-v="off">OFF</button></div>

<script>
/* V2KIT-JS-BEGIN */
/* ===== プラン v2 口径（2026-10-07）：数据与计分与 b9-import-plan-v2.html 相同（满点 100 · 不封顶 · 跳过=满额斜纹 · 超目标半分）===== */
const V2 = (() => {
  const PER = {
    /* v2.2：n = 「役割 × 状況」一文 · s = 固定短名 · slot = テンプレート枠（💰 資金調達）· evn = 会える活動 · route = 紹介ルート */
    cfo: { n: 'シリーズA 前後の調達を、CFO として回した経験者', s: 'CFO', slot: 'CFO 経験者', emo: '📊', c: 'teal', w: 10, tgt: 1, unit: 10, step: 1, cand: 1, evn: 1, route: 1 },
    ent: { n: 'この 3年以内にシリーズA を調達した、B2B SaaS の起業家', s: '起業家', slot: '調達経験のある起業家', emo: '🚀', c: 'apricot', w: 15, tgt: 5, unit: 3, step: 2, cand: 2, evn: 2, route: 1 },
    ang: { n: 'SaaS を創業した経験があり、シード〜A に個人で出資しているエンジェル', s: 'エンジェル', slot: 'エンジェル投資家', emo: '🪽', c: 'pink', w: 10, tgt: 2, unit: 5, step: 2, cand: 1, evn: 1, route: 2 },
    vc: { n: 'シリーズA のリードを取れる VC のパートナー', s: 'VC', slot: 'VC パートナー', emo: '💼', c: 'lav', w: 30, tgt: 3, unit: 10, step: 3, cand: 4, evn: 2, route: 1 },
    cvc: { n: '製造業 DX に出資している、事業会社 CVC の投資担当', s: 'CVC', slot: 'CVC 担当者', emo: '🏢', c: 'blue', w: 15, tgt: 3, unit: 5, step: 3, cand: 0, evn: 1, route: 1 },
    law: { n: 'シリーズA の投資契約・種類株式の交渉に立ち会える弁護士', s: '弁護士', slot: '弁護士（投資契約）', emo: '⚖️', c: 'teal', w: 10, tgt: 1, unit: 10, step: 4, cand: 1, evn: 0, route: 1 },
    ev: { n: 'VC と起業家が集まる場へ行く', s: 'イベント', slot: 'イベント', emo: '🎟️', c: 'apricot', w: 10, tgt: 2, unit: 5, step: 0, cand: 3, evn: 3, ev: true },
  };
  const ORDER = ['cfo', 'ent', 'ang', 'vc', 'cvc', 'law', 'ev'];
  const ST = {
    s0: { cfo: 0, ent: 0, ang: 0, vc: 0, cvc: 0, law: 0, ev: 0 },
    s46: { cfo: 0, ent: 2, ang: 0, vc: 2, cvc: 0, law: 'skip', ev: 2 },
  };
  const STEPS = [
    [1, 'ピッチと事業計画を固める', '投資家に会う前に、数字と物語の穴を潰しておくと、1回の面談で進む距離が伸びます。', ['cfo'], '同規模のシリーズA 事例 · あなたの目標「3億円」から逆算'],
    [2, '調達経験のある先輩・エンジェルに相談', '最近同じ規模を調達した人から、VC の選び方・相場観・紹介ルートを得られます。', ['ent', 'ang'], '紹介経由の面談は進みやすい傾向（一般的な調達の進め方）'],
    [3, 'VC と接点を持つ', 'リード候補を 3 社以上、並行で。事業会社の CVC は条件の選択肢を増やします。', ['vc', 'cvc'], 'シリーズA の典型的な投資家構成 · あなたの業種（製造業向け SaaS）'],
    [4, 'DD・条件交渉', '投資契約・種類株式の条件は後から変えにくいので、署名前に専門家の目を入れます。', ['law'], '投資契約で論点になりやすい条項（優先清算・希薄化防止）'],
    [5, 'クロージング', '新しく会う人はいません。Step 3・4 の相手と着地させます。', [], ''],
  ];
  const pts = (k, n) => { const p = PER[k]; if (n === 'skip') return { base: p.w, bonus: 0, skip: true, n: 0 }; return { base: Math.min(n, p.tgt) * p.unit, bonus: Math.max(0, n - p.tgt) * p.unit / 2, skip: false, n }; };
  const total = s => ORDER.reduce((a, k) => { const r = pts(k, ST[s][k]); return a + r.base + r.bonus; }, 0);
  const bonusOf = s => ORDER.reduce((a, k) => a + pts(k, ST[s][k]).bonus, 0);
  const skipOf = s => ORDER.reduce((a, k) => { const r = pts(k, ST[s][k]); return a + (r.skip ? r.base : 0); }, 0);
  const talkOf = s => total(s) - bonusOf(s) - skipOf(s);
  const fmt = v => Number.isInteger(v) ? v : v.toFixed(1);
  /* 分数构成条：实色 = 话出来的分 · 斜纹 = 习熟跳过 · 豆沙 = 超目标后的半分；o.thin 细条（首页/小组件），o.labels 类型名 */
  const sbar = (s, o = {}) => {
    const bon = bonusOf(s), scale = Math.max(100, 100 + bon);
    const segs = ORDER.map(k => { const p = PER[k], r = pts(k, ST[s][k]); return `<div class="sg ${r.skip ? 'sk' : ''}" style="flex:${p.w}">${r.skip ? '' : `<b style="width:${r.base / p.w * 100}%"></b>`}</div>`; }).join('') + (bon ? `<div class="sg bonus" style="flex:${bon}"></div>` : '');
