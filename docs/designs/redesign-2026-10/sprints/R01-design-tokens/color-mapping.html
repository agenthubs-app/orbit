.wrap{max-width:1080px;margin:0 auto;display:grid;gap:28px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}

.scroll{overflow-x:auto}

.arrow{color:var(--ink-4);padding:0 2px}
.uses{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-2)}
.del{color:var(--coral-text);font-weight:700}

const design=new Set(["bg","fog-a","fog-b","fog-c","surface","surface-2","surface-3","line","glass","glass-line","ink","ink-2","ink-3","ink-4","plum-900","plum-700","plum-500","plum-300","plum-100","rose-700","rose-500","rose-300","rose-100","accent","accent-soft","on-accent","mac-pink","mac-apricot","mac-blue","mac-teal","mac-lav","mac-pink-ink","mac-apricot-ink","mac-blue-ink","mac-teal-ink","mac-lav-ink","coral","coral-soft","ok"]);
const bgFor=n=>{const p=D.tokens.contrast.find(([f])=>f===n);return p?p[1]:null};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const chip=(v,bg)=>v?(bg?'<div class="chip text" style="background:'+bg+';color:'+v+'">Aa</div>':'<div class="chip" style="background:'+v+'"></div>'):'<div class="chip"></div>';
const tv=(n,t)=>n&&n.startsWith("--")?D.tokens[t][n.slice(2)]:n?D.tokens[t][n]:null;
const camel=n=>n.replace(/^--/,"").replace(/-([a-z0-9])/g,(_,c)=>c.toUpperCase());
document.getElementById("tokens").innerHTML=Object.keys(D.tokens.light).map(n=>{const b=bgFor(n);const cell=t=>{const bg=b?(b.startsWith("#")?b:D.tokens[t][b]):null;return bg?'<div style="background:'+bg+';color:'+D.tokens[t][n]+'">Aa</div>':'<div style="background:'+D.tokens[t][n]+'"></div>'};return '<div class="tok"><div class="pair">'+cell("light")+cell("dark")+'</div><span class="name">'+n+(design.has(n)?'':' <span class="star">★</span>')+'</span><span class="lbl">'+esc(D.tokens.usage[n])+'</span></div>'}).join("");
const isText=n=>/-text$|^ink$|^ink-2$|^on-accent$|^on-ok$|^on-image-badge$/.test(n||"");
const row=(old,ol,od,n,uses,note,isApp)=>{const k=n&&n.replace(/^--/,"");const valid=k&&D.tokens.light[k];const tb=t=>valid&&isText(k)?(bgFor(k)?(bgFor(k).startsWith("#")?bgFor(k):D.tokens[t][bgFor(k)]):D.tokens[t].surface):null;
const oc=v=>/^(#|rgba)/.test(v)?v:null;
return '<tr><td class="name"><code>'+esc(old)+'</code></td><td><div class="chips">'+chip(oc(ol))+chip(oc(od))+'<span class="arrow">→</span>'+(valid?chip(D.tokens.light[k],tb("light"))+chip(D.tokens.dark[k],tb("dark")):'')+'</div></td><td class="name">'+(n===null?'<span class="del">删除</span>':valid?'<code>'+(isApp?camel(n):n)+'</code>':esc(n))+'</td><td class="uses">'+uses+'</td><td class="note">'+esc(note)+'</td></tr>'};
const head='<tr><th>旧名字</th><th>旧浅 · 旧深 → 新浅 · 新深</th><th>新名字</th><th style="text-align:right">用到</th><th>说明</th></tr>';
document.getElementById("app").innerHTML=head+D.app.map(r=>row(r[0],r[1],r[2],r[3],r[4],r[5],true)).join("");
document.getElementById("web").innerHTML=head+D.web.map(r=>row(r[0],r[2],r[1],r[3],r[4],r[5],false)).join("");
const btns=[...document.querySelectorAll(".seg button")];
const setT=t=>{if(t)document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme");btns.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===t)));try{localStorage.setItem("r01-theme",t)}catch(e){}};
btns.forEach(b=>b.addEventListener("click",()=>setT(b.dataset.t)));
let saved="";try{saved=localStorage.getItem("r01-theme")||""}catch(e){}
