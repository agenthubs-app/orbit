<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⑥ 主催 + 収尾</title>
<link rel="stylesheet" href="kit/tokens.css">
<link rel="stylesheet" href="kit/ui.css">
<script src="kit/kit.js"></script>
<script src="kit/data.js"></script>
<style>
  .doc { min-width: 1520px; }
  /* ---- 从 web.html 复制的页面私有样式 ---- */
  .kpi .lbl { white-space: nowrap; }
  .kpi b { font-family: var(--font-num); font-size: 24px; font-weight: 800; display: block; line-height: 1.15; }
  .tl { display: grid; grid-template-columns: 50px 1fr; gap: 12px; align-items: start; }
  .tl + .tl { margin-top: 10px; }
  .tl time { font-family: var(--font-num); font-weight: 800; font-size: 13px; padding-top: 10px; }
  .tl .blk { border-radius: 16px; padding: 10px 14px; }
  .score { font-family: var(--font-num); font-weight: 800; }
  .hov-acts { display: flex; gap: 6px; opacity: 0; transition: opacity .2s; }
  .table tr:hover .hov-acts, .hov-acts.show { opacity: 1; }
  .sugg { background: var(--surface); border-radius: 18px; padding: 14px; transition: transform .15s var(--ease); cursor: pointer; }
  .ghost-tr td { color: var(--ink-4); }
  .ghost-tr i { display: inline-block; height: 10px; border-radius: 5px; background: var(--surface-2); }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
  .bars i { flex: 1; border-radius: 8px 8px 4px 4px; background: var(--plum-300); position: relative; }
  .bars i.hi { background: var(--plum-700); }
  .bars i.mk::after { content: attr(data-mk); position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; color: var(--rose-700); white-space: nowrap; font-style: normal; }
  .axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-3); margin-top: 6px; }

  /* ---- 主催 ---- */
  .htabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: -8px 0 20px; }
  .htabs button { padding: 10px 16px 12px; font-size: 13px; font-weight: 700; color: var(--ink-3); position: relative; }
  .htabs button.on { color: var(--ink); }
  .htabs button.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 3px; border-radius: 3px; background: var(--plum-700); }
  .htabs .cnt-b { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; background: var(--coral-soft); color: var(--coral); margin-left: 4px; }
  .hc { background: var(--surface); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 4px; transition: transform .2s var(--ease), box-shadow .2s; cursor: pointer; min-width: 0; }
  .hc:hover { transform: translateY(-3px); box-shadow: var(--shadow-float); }
  .hc-t { font-size: 15px; font-weight: 800; margin-top: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cnt3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .cnt3 > div { background: var(--surface-2); border-radius: 14px; padding: 9px 11px; }
  .cnt3 b { font-family: var(--font-num); font-size: 20px; font-weight: 800; display: block; line-height: 1.2; }
  .cnt3 b small { font-size: 11px; color: var(--ink-3); font-weight: 700; margin-left: 1px; }
  .live { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .tno { width: 38px; height: 38px; border-radius: 13px; display: grid; place-items: center; background: var(--plum-100); color: var(--plum-900); font-family: var(--font-num); font-weight: 900; font-size: 17px; flex: none; }
  .mrow { display: flex; align-items: center; gap: 10px; padding: 7px 0; min-width: 0; }
  .mrow + .mrow { border-top: 1px solid var(--line); }
  .mrow .meta { flex: 1; min-width: 0; }
  .mrow .meta b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrow .meta span { display: block; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrow.drag { background: var(--surface-2); border-radius: 12px; padding: 7px 8px; margin: 0 -8px; box-shadow: var(--shadow-float); transform: rotate(-1deg); }
  .bulk { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 16px; background: var(--accent-soft); margin-bottom: 10px; font-size: 13px; }
  .qcard { background: var(--surface-2); border-radius: 18px; padding: 14px 16px; }
  .qcard + .qcard { margin-top: 10px; }
  .qcard.edit { background: var(--surface); box-shadow: 0 0 0 2px var(--plum-300); }
  .qopt { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--surface-2); font-size: 13px; }
  .qopt + .qopt { margin-top: 6px; }
  .handle { color: var(--ink-4); cursor: grab; letter-spacing: -2px; font-weight: 900; }
  .ta { border-radius: 16px; background: var(--surface-2); padding: 14px 16px; font-size: 13px; line-height: 1.75; color: var(--ink); min-height: 110px; position: relative; }
  .ta .counter { position: absolute; right: 14px; bottom: 10px; font-size: 11px; font-weight: 700; color: var(--ink-3); font-family: var(--font-num); }
  .ta.ph { color: var(--ink-4); }
  .pv { background: var(--surface-2); border-radius: 22px; padding: 18px; }
  .pv .pq { background: var(--surface); border-radius: 16px; padding: 12px 14px; margin-top: 10px; font-size: 12.5px; }
  .pv .pq .o { display: flex; align-items: center; gap: 8px; margin-top: 7px; color: var(--ink-2); }
  .fun { display: grid; gap: 8px; }
  .fun .f { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: 12.5px; }
  .fun .f .bar { grid-column: 1 / -1; margin: 0; }
  .hbar { display: grid; grid-template-columns: 30px 1fr 36px; gap: 10px; align-items: center; font-size: 12px; }
  .hbar + .hbar { margin-top: 7px; }
  .hbar .bar { margin: 0; }

  /* ---- 受付 kiosk（iPad 横） ---- */
  .web.kiosk { width: 1180px; height: 820px; border-radius: 40px; display: flex; flex-direction: column; padding: 24px 30px; gap: 18px;
    box-shadow: 0 0 0 12px #111014, 0 0 0 13px #2a2830, 0 30px 60px -20px rgba(40, 20, 70, .35); }
  .k-top { display: flex; align-items: center; gap: 14px; }
  .k-top .logo { width: 44px; height: 44px; border-radius: 15px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 900; font-size: 18px; }
  .k-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; }
  .k-search { height: 78px; border-radius: 26px; background: var(--surface); display: flex; align-items: center; gap: 14px; padding: 0 26px; font-size: 26px; font-weight: 700; color: var(--ink); }
  .k-search.ph { color: var(--ink-4); font-weight: 500; }
  .k-search .caret { width: 2px; height: 32px; background: var(--plum-700); animation: blink 1s steps(1) infinite; margin-left: -10px; }
  .k-res { background: var(--surface); border-radius: 24px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; }
  .k-res + .k-res { margin-top: 10px; }
  .k-res .nm { font-size: 22px; font-weight: 800; }
  .k-arrive { height: 60px; padding: 0 30px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 18px; font-weight: 800; display: inline-flex; align-items: center; gap: 8px; margin-left: auto; transition: transform .15s var(--ease); }
  .k-arrive:active { transform: scale(.95); }
  .k-stream { background: color-mix(in srgb, var(--surface) 60%, transparent); border-radius: 28px; padding: 18px; overflow: hidden; display: flex; flex-direction: column; }
  .k-row { display: flex; align-items: center; gap: 12px; padding: 10px 6px; }
  .k-row + .k-row { border-top: 1px solid var(--line); }
  .k-row time { font-family: var(--font-num); font-weight: 800; font-size: 14px; width: 46px; color: var(--ink-2); }
  .k-row.new { background: var(--accent-soft); border-radius: 16px; padding: 10px 10px; animation: rise .6s var(--ease) both; }
  .k-banner { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 20px; background: var(--coral-soft); color: var(--ink); }

  /* ---- 小组件（沿用 widgets.html 毛玻璃） ---- */
  .wall { position: absolute; inset: 0; background:
      radial-gradient(260px 260px at 15% 20%, #d9c9f2, transparent 70%),
      radial-gradient(300px 300px at 90% 35%, #f6cbd8, transparent 70%),
      radial-gradient(320px 320px at 40% 85%, #c9dcf4, transparent 70%),
      linear-gradient(160deg, #efe7f6, #f8e9ee 50%, #e5edf8); }
  [data-theme="dark"] .wall { background:
      radial-gradient(260px 260px at 15% 20%, #4b3d6b, transparent 70%),
      radial-gradient(300px 300px at 90% 35%, #5e3646, transparent 70%),
      radial-gradient(320px 320px at 40% 85%, #2c3f5e, transparent 70%),
      linear-gradient(160deg, #1d1a26, #241b22 50%, #161c27); }
  .hs { position: absolute; inset: 64px 13px 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px 0; align-content: start; }
  .w { border-radius: 24px; padding: 15px; color: #2a2433; position: relative;
       background: rgba(255,255,255,.42); backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5);
       border: 1px solid rgba(255,255,255,.55); box-shadow: 0 8px 24px -14px rgba(60,40,90,.35); }
  [data-theme="dark"] .w { background: rgba(40,36,48,.45); border-color: rgba(255,255,255,.1); color: #f1edf5; }
  .w .lb { font-size: 11px; font-weight: 700; opacity: .62; }
  .w { overflow: hidden; } /* 审计：与 widgets.html 同源的迷你轨道需要裁切 */
  .wob { display: block; overflow: visible; } .wob circle.rg { fill: none; stroke-width: 1; } .wob text { font-family: var(--font); font-weight: 800; text-anchor: middle; dominant-baseline: central; }
  .w.s { grid-column: span 2; width: 170px; height: 170px; justify-self: center; }
  .w.m { grid-column: span 4; width: 364px; height: 170px; justify-self: center; }
  .w .n { font-family: var(--font-num); font-weight: 800; letter-spacing: -.02em; }
  .w .bar { background: rgba(120,100,150,.18); }
  .happ { grid-column: span 1; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; color: #2a2433; font-weight: 500; }
  [data-theme="dark"] .happ { color: #eee; }
  .happ i { width: 62px; height: 62px; border-radius: 16px; display: grid; place-items: center; font-size: 28px; font-style: normal; background: rgba(255,255,255,.7); }
  .dock { position: absolute; left: 12px; right: 12px; bottom: 22px; height: 92px; border-radius: 34px; background: rgba(255,255,255,.35); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); display: flex; justify-content: space-around; align-items: center; }
  [data-theme="dark"] .dock { background: rgba(50,46,58,.4); }
  .dock i { width: 62px; height: 62px; border-radius: 16px; display: grid; place-items: center; font-size: 28px; font-style: normal; background: rgba(255,255,255,.7); }
  .wrow { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .jig { animation: jig .28s ease-in-out infinite alternate; }
  .jig:nth-child(2n) { animation-delay: .14s; }
  @keyframes jig { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } }
  .minus { position: absolute; top: -7px; left: -7px; width: 22px; height: 22px; border-radius: 50%; background: rgba(120,115,130,.75); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 15px; line-height: 1; z-index: 3; }
  .blurred { filter: blur(6px); opacity: .55; }
  .ctx { position: absolute; z-index: 10; width: 250px; border-radius: 16px; overflow: hidden; background: rgba(250,248,252,.78); backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6); color: #2a2433; box-shadow: 0 20px 40px -16px rgba(40,20,70,.4); }
  [data-theme="dark"] .ctx { background: rgba(48,44,56,.78); color: #f1edf5; }
  .ctx div { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; font-size: 15px; }
  .ctx div + div { border-top: .5px solid rgba(120,100,150,.25); }
  .ctx .del { color: var(--coral); }
  .wcfg { position: absolute; left: 24px; right: 24px; z-index: 10; border-radius: 26px; padding: 16px; background: rgba(250,248,252,.8); backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6); color: #2a2433; }
  [data-theme="dark"] .wcfg { background: rgba(44,40,52,.8); color: #f1edf5; }
  .wcfg .grp { background: rgba(255,255,255,.6); border-radius: 14px; overflow: hidden; margin-top: 6px; }
  [data-theme="dark"] .wcfg .grp { background: rgba(255,255,255,.06); }
  .wcfg .opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 14px; }
  .wcfg .opt + .opt { border-top: .5px solid rgba(120,100,150,.2); }
  .wcfg .opt.dis { opacity: .4; }
  .wcfg .ck { margin-left: auto; color: var(--plum-700); }
  .wcfg .gh { font-size: 11.5px; font-weight: 700; opacity: .6; margin: 12px 4px 0; }
  .lock { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 70px; color: #2a2433; }
  [data-theme="dark"] .lock { color: #f1edf5; }
  .lock .date { font-size: 18px; font-weight: 700; opacity: .8; }
  .lock .time { font-family: var(--font-num); font-size: 92px; font-weight: 800; line-height: 1; letter-spacing: -.03em; }
  .notif { position: absolute; left: 12px; right: 12px; display: flex; gap: 10px; font-size: 12.5px; }   /* 外观来自 kit .pn */
  .nacts { position: absolute; left: 12px; right: 12px; border-radius: 16px; overflow: hidden; background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--glass-line); color: var(--ink); }
  .nacts div { padding: 12px 16px; font-size: 14.5px; display: flex; justify-content: space-between; }
  .nacts div + div { border-top: 1px solid var(--line); }

  /* ---- NFC ---- */
  .nfc-wave { position: relative; width: 230px; height: 230px; margin: 26px auto 10px; display: grid; place-items: center; }
  .nfc-wave i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--plum-300); animation: ripple 2.4s var(--ease) infinite; opacity: 0; }
  .nfc-wave i:nth-child(2) { animation-delay: .8s; } .nfc-wave i:nth-child(3) { animation-delay: 1.6s; }
  @keyframes ripple { 0% { transform: scale(.35); opacity: .9; } 100% { transform: scale(1); opacity: 0; } }
  .nfc-wave .core { width: 100px; height: 100px; border-radius: 32px; background: var(--surface); display: grid; place-items: center; font-size: 46px; position: relative; z-index: 1; box-shadow: var(--shadow-float); animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .okc { width: 64px; height: 64px; border-radius: 50%; background: var(--mac-teal); color: var(--mac-teal-ink); display: grid; place-items: center; margin: 6px auto 0; animation: pop .6s var(--ease) both; }
  .okc svg.i { width: 32px; height: 32px; stroke-width: 2.4; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.08); } }
  .setrow { display: flex; align-items: center; gap: 12px; padding: 13px 0; }
  .setrow + .setrow { border-top: 1px solid var(--line); }

  /* ---- 响应式画框 ---- */
  .web.w1024 { width: 1024px; height: 880px; grid-template-columns: 72px 1fr; }
  .w1024 .side a { width: 48px; padding: 12px 0; font-size: 0; gap: 0; }
  .w1024 .side .logo { margin-bottom: 14px; }
  .w1024 .main { padding: 22px 26px 40px; }
  .w1024 .rdrawer { width: 380px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .w1024 .rdrawer h4 { font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .side-tip { position: absolute; left: 66px; top: 0; padding: 5px 10px; border-radius: 9px; background: var(--ink); color: var(--bg); font-size: 11.5px; font-weight: 700; white-space: nowrap; z-index: 5; }
  .cnum { min-width: 18px; height: 18px; border-radius: 9px; background: var(--coral); color: var(--surface); font-size: 10.5px; font-weight: 800; display: inline-grid; place-items: center; padding: 0 5px; }
  .mweb .scroll { padding-bottom: 200px; }
  .mweb .tabbar { bottom: 100px; }
  .mweb .fab { bottom: 100px; }
  .sbar { position: absolute; left: 0; right: 0; bottom: 0; height: 92px; z-index: 34; background: var(--glass); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border-top: 1px solid var(--line); padding: 10px 14px 0; display: flex; gap: 10px; align-items: flex-start; }
  .sbar .url { flex: 1; height: 42px; border-radius: 14px; background: var(--surface); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13.5px; color: var(--ink-2); font-weight: 600; }
  .sbar .ub { width: 42px; height: 42px; display: grid; place-items: center; color: var(--ink-2); font-size: 14px; font-weight: 700; }
  .mw-head { display: flex; align-items: center; gap: 8px; padding: 6px 0 14px; }
  .mw-head .logo { width: 34px; height: 34px; border-radius: 11px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 900; }

  /* ---- 长文案规范 ---- */
  .web.spec { height: auto; display: block; padding: 30px; width: 1440px; }
  .clamp1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .jp { word-break: auto-phrase; line-break: strict; }
  .ng { position: relative; }
  .okng { font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
  .okng.ok { background: var(--mac-teal); color: var(--mac-teal-ink); } .okng.bad { background: var(--coral-soft); color: var(--coral); }
  .tipw { position: relative; display: inline-flex; max-width: 100%; }
  .tip-b { position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 6; width: max-content; max-width: 280px; padding: 8px 11px; border-radius: 11px; background: var(--ink); color: var(--bg); font-size: 11.5px; font-weight: 600; line-height: 1.55; white-space: normal; display: none; }
  .tip-b::after { content: ""; position: absolute; left: 18px; top: 100%; border: 6px solid transparent; border-top-color: var(--ink); }
  .tipw:hover .tip-b, .tip-b.show { display: block; }
  .rule th, .rule td { font-size: 12.5px; }
  .dyn .scroll { font-size: 17px; }
  .dyn-tab button { font-size: 0; gap: 0; }
  .dyn-tab button svg.i { width: 26px; height: 26px; }
  /* V2KIT-CSS-BEGIN */
  /* ===== プラン v2 口径（2026-10-07）：视觉与数字与 b9-import-plan-v2.html 一致；类名加 v2 前缀避免与本页私有类冲突 ===== */
  .v2bar { display: flex; gap: 3px; height: 14px; position: relative; margin-top: 18px; }
  .v2bar.thin { height: 8px; gap: 2px; margin-top: 12px; }
  .v2bar .sg { position: relative; border-radius: 5px; background: var(--surface-3); overflow: hidden; min-width: 6px; }
  .v2bar.thin .sg { border-radius: 3px; min-width: 3px; }
  .v2bar .sg > b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--plum-700); animation: v2grow 1.2s var(--ease) both; }
  .v2bar .sg.sk, .v2sw.hatch, .v2mb.sk { background: repeating-linear-gradient(135deg, var(--plum-300) 0 2px, var(--plum-100) 2px 6px); }
  .v2bar .sg.bonus { background: var(--rose-500); }
  .v2bar .m100 { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--ink-2); border-radius: 1px; z-index: 2; }
  .v2bar .m100 em { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 9.5px; font-weight: 800; color: var(--ink-2); font-family: var(--font-num); white-space: nowrap; }
  .v2slbl { display: flex; gap: 3px; margin-top: 6px; }
  .v2slbl span { font-size: 10px; color: var(--ink-3); font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 6px; }
  @keyframes v2grow { from { width: 0; } }
  .v2lg { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 12px; font-size: 11px; color: var(--ink-2); font-weight: 600; }
  .v2lg span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .v2sw { width: 14px; height: 9px; border-radius: 3px; background: var(--surface-3); display: inline-block; flex: none; }
  .v2sw.solid { background: var(--plum-700); } .v2sw.bonus { background: var(--rose-500); }
  /* 人物类型行 */
  .v2prow { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
  .v2prow + .v2prow { border-top: 1px solid var(--line); }
  .v2prow .pm { flex: 1; min-width: 0; }
  .v2prow .pm b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .v2prow .pm .chips { margin-top: 4px; flex-wrap: nowrap; overflow: hidden; }

  };
