<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新用户冷启动 + 名片流转</title>
<link rel="stylesheet" href="kit/tokens.css">
<link rel="stylesheet" href="kit/ui.css">
<script src="kit/kit.js"></script>
<script src="kit/data.js"></script>
<style>
  /* 实物色（名片纸、相机取景）：两种主题下保持一致，只经由变量引用 */
  :root, [data-theme] {
    --paper: #FFFFFF; --paper-2: #F3F0EB; --paper-ink: #25222B; --paper-ink-2: #8B8692;
    --cam: #0F0E12; --cam-2: #24222A; --cam-ink: #FFFFFF;
  }
  .doc { min-width: 1520px; }
  .web.bare { display: block; }
  .phone .foot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; padding: 22px 18px 30px; background: linear-gradient(to bottom, transparent, var(--bg) 28%); display: grid; gap: 8px; }
  .h1 { font-size: 24px; font-weight: 900; line-height: 1.35; letter-spacing: -.01em; }
  .mt { font-size: 22px; font-weight: 900; }
  .center { text-align: center; }
  .lnk { color: var(--accent); font-weight: 700; cursor: pointer; }

  /* 表单 */
  .fld { margin-top: 12px; }
  .fld label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }
  .fld .in { height: 48px; border-radius: 14px; background: var(--surface); display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 14px; color: var(--ink); border: 1.5px solid transparent; }
  .on-surface .fld .in, .card .fld .in { background: var(--surface-2); }
  .fld .in > span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fld .in.ph > span { color: var(--ink-4); }
  .fld .in .tail { font-size: 11.5px; color: var(--ink-3); font-weight: 700; flex: none; }
  .fld.focus .in { border-color: var(--plum-500); background: var(--surface); }
  .fld.err .in { border-color: var(--coral); background: var(--coral-soft); }
  .fld .msg { font-size: 11.5px; margin-top: 6px; font-weight: 600; color: var(--ink-3); line-height: 1.55; }
  .fld.err .msg { color: var(--coral); }
  .fld.info .in { border-color: var(--plum-300); }
  .fld.info .msg { color: var(--ink-2); background: var(--accent-soft); padding: 10px 12px; border-radius: 12px; }
  .caret { display: inline-block; width: 1.5px; height: 18px; background: var(--plum-700); margin-left: -6px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .ckl { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
  .gbtn { height: 48px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--surface-3); display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; font-size: 13.5px; width: 100%; }
  .gbtn .g { width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-weight: 900; font-size: 13px; color: var(--ink); font-family: var(--font-num); }
  .or { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 11.5px; margin: 16px 0 2px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--surface-3); }
  .btn.xl { height: 50px; font-size: 14.5px; }
  .reqs { display: grid; gap: 6px; margin-top: 10px; font-size: 12px; color: var(--ink-3); }
  .reqs div { display: flex; align-items: center; gap: 6px; }
  .reqs .ok { color: var(--ok); font-weight: 700; }

  /* 弹窗 */

  /* 落地页 */
  .lp { padding: 0 72px; height: 100%; display: flex; flex-direction: column; }
  .lp-nav { height: 84px; display: flex; align-items: center; justify-content: space-between; flex: none; }
  .lp-logo { width: 36px; height: 36px; border-radius: 12px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 900; }
  .lp-links { gap: 30px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
  .lp-hero { display: grid; grid-template-columns: 1fr 580px; gap: 40px; align-items: center; flex: 1; }
  .lp-copy h1 { font-size: 56px; line-height: 1.22; font-weight: 900; letter-spacing: -.015em; margin: 18px 0; }
  .lp-copy p { font-size: 16px; color: var(--ink-2); line-height: 1.85; max-width: 540px; }
  .lp-cta { height: 52px; padding: 0 26px; font-size: 15px; }
  .lp-art { position: relative; height: 470px; }
  .lp-art > * { position: absolute; }
  .lp-vals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding: 6px 0 44px; flex: none; }
  .lp-vals .card { display: flex; gap: 14px; align-items: flex-start; }
  .lp-vals b { font-size: 15px; display: block; margin-bottom: 4px; }
  .float { animation: floaty 6s var(--ease) infinite; }
  .float.d2 { animation-delay: -2s; } .float.d3 { animation-delay: -4s; }
  @keyframes floaty { 50% { transform: translateY(-8px); } }

  /* 名片实物 */
  .paper { width: 220px; aspect-ratio: 91 / 55; background: var(--paper); color: var(--paper-ink); border-radius: 5px; padding: 13px 15px; position: relative; box-shadow: 0 10px 24px -12px color-mix(in srgb, var(--cam) 40%, transparent); display: flex; flex-direction: column; flex: none; }
  .paper .p-co { font-size: 8.5px; color: var(--paper-ink-2); font-weight: 700; letter-spacing: .04em; }
  .paper .p-r { font-size: 7.5px; color: var(--paper-ink-2); margin-top: auto; }
  .paper .p-n { font-size: 17px; font-weight: 800; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; letter-spacing: .06em; }
  .paper .p-m { font-size: 7px; color: var(--paper-ink-2); margin-top: 7px; line-height: 1.5; }
  .paper.back { background: var(--paper-2); align-items: center; justify-content: center; text-align: center; }
  .paper.back .p-logo { font-weight: 900; font-size: 15px; letter-spacing: .08em; }
  .paper.back .p-en { font-size: 7.5px; color: var(--paper-ink-2); margin-top: 4px; letter-spacing: .1em; }
  .tp { width: 56px; aspect-ratio: 91 / 55; border-radius: 4px; background: var(--paper); position: relative; flex: none; box-shadow: 0 0 0 1px var(--line), 0 3px 8px -5px color-mix(in srgb, var(--cam) 35%, transparent); }
  .tp::before { content: ""; position: absolute; left: 12%; top: 52%; width: 46%; height: 11%; background: var(--paper-ink); opacity: .7; border-radius: 2px; }
  .tp::after { content: ""; position: absolute; left: 12%; top: 22%; width: 30%; height: 7%; background: var(--paper-ink-2); opacity: .55; border-radius: 2px; box-shadow: 0 calc(var(--h, 30px) * .9) 0 0 var(--paper-ink-2); }
  .tp.b { background: var(--paper-2); } .tp.b::before { left: 34%; top: 32%; width: 32%; height: 36%; border-radius: 50%; opacity: .22; } .tp.b::after { display: none; }
  .tp.blur { filter: blur(1.2px); }
  .tp.lg { width: 92px; } .tp.sm { width: 40px; }

  /* 步骤进度 */
  .stp { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .stp i { height: 5px; border-radius: 3px; background: var(--surface-3); }
  .stp i.d { background: var(--plum-500); } .stp i.n { background: linear-gradient(90deg, var(--plum-700) 50%, var(--surface-3) 50%); }
  .wstp { display: flex; align-items: center; gap: 10px; }
  .wstp > div { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
  .wstp > div .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-weight: 800; font-size: 12px; }
  .wstp > div.d { color: var(--ink-2); } .wstp > div.d .n { background: var(--ok); color: var(--on-accent); }
  .wstp > div.n { color: var(--ink); font-weight: 800; } .wstp > div.n .n { background: var(--accent); color: var(--on-accent); }
  .wstp em { width: 28px; height: 1.5px; background: var(--surface-3); }
  .obw { height: 100%; display: flex; flex-direction: column; }
  .obw-h { height: 84px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); flex: none; }
  .obw-b { flex: 1; padding: 30px 120px; overflow: hidden; }
  .obw-b .wgrid > .card { padding: 28px; }
  .obw-foot { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 20px; }

  /* 选择 */
  .gt { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gt.w3 { grid-template-columns: repeat(3, 1fr); }
  .gt button { background: var(--surface); border-radius: 20px; padding: 13px; text-align: left; display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 13px; border: 2px solid transparent; position: relative; transition: border-color .2s, transform .15s var(--ease); }
  .card .gt button { background: var(--surface-2); }
  .gt button small { font-size: 11px; color: var(--ink-3); font-weight: 500; }
  .gt button.on { border-color: var(--plum-500); }
  .card .gt button.on { background: var(--surface); }
  .gt .ord { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 800; display: grid; place-items: center; }
  .tog { display: inline-flex; align-items: center; gap: 5px; padding: 8px 13px; border-radius: 999px; background: var(--surface); font-size: 12.5px; font-weight: 700; color: var(--ink-2); border: 1.5px solid transparent; white-space: nowrap; }
  .card .tog { background: var(--surface-2); }
  .tog.on { background: var(--accent-soft); color: var(--ink); border-color: var(--plum-500); }
  .card .tog.on { background: var(--accent-soft); }
  .tog.add { border: 1.5px dashed var(--ink-4); background: transparent; color: var(--ink-3); }
  .tog.ai { border: 1.5px dashed var(--plum-300); background: transparent; color: var(--ink-2); }
  .togs { display: flex; flex-wrap: wrap; gap: 7px; }
  .grp + .grp { margin-top: 16px; }
  .grp-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; font-weight: 800; }

  /* 欢迎页 */
  .wel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -18px; padding: 0 18px; scrollbar-width: none; }
  .wel::-webkit-scrollbar { display: none; }
  .wel > section { scroll-snap-align: center; flex: none; width: 354px; }
  .wel .art { height: 330px; border-radius: 30px; position: relative; overflow: hidden; background: var(--surface); }
  .wel .art > * { position: absolute; }

  /* 相机 */
  .cam { position: absolute; inset: 0; z-index: 4; background: radial-gradient(500px 420px at 50% 42%, var(--cam-2), var(--cam) 75%); color: var(--cam-ink); padding: 56px 18px 0; display: flex; flex-direction: column; }
  .cam .gl { background: color-mix(in srgb, var(--cam-ink) 14%, transparent); color: var(--cam-ink); backdrop-filter: blur(10px); }
  .cam .seg { background: color-mix(in srgb, var(--cam-ink) 14%, transparent); }
  .cam .seg button { color: color-mix(in srgb, var(--cam-ink) 70%, transparent); }
  .cam .seg button.on { background: var(--cam-ink); color: var(--cam); }
  .vf { position: relative; height: 380px; margin-top: 18px; display: grid; place-items: center; }
  .det { position: absolute; width: 300px; height: 182px; left: 50%; top: 50%; margin: -91px 0 0 -150px; transform: rotate(-3deg); border-radius: 8px; background: color-mix(in srgb, var(--plum-300) 18%, transparent); box-shadow: 0 0 0 2px var(--plum-300); animation: detPulse 1.6s var(--ease) infinite; }
  .det i { position: absolute; width: 22px; height: 22px; border: 3.5px solid var(--cam-ink); }
  .det i:nth-child(1) { left: -6px; top: -6px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
  .det i:nth-child(2) { right: -6px; top: -6px; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
  .det i:nth-child(3) { left: -6px; bottom: -6px; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
  .det i:nth-child(4) { right: -6px; bottom: -6px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
  @keyframes detPulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--plum-300) 40%, transparent); } }
  .cam .hint { align-self: center; padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .tray { display: flex; gap: 8px; align-items: flex-end; overflow: hidden; padding: 4px 0; }
  .tray .pr { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 9.5px; font-weight: 700; color: color-mix(in srgb, var(--cam-ink) 70%, transparent); }
  .tray .pr > div { display: flex; }
  .tray .pr .tp { width: 44px; }
  .tray .pr .tp + .tp { margin-left: -26px; transform: translateY(-5px) rotate(4deg); }
  .shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--cam-ink); display: grid; place-items: center; }
  .shutter i { width: 60px; height: 60px; border-radius: 50%; background: var(--cam-ink); display: block; }
  .count { font-family: var(--font-num); font-weight: 800; }

  /* 进度 / 状态 */
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--surface-3); border-top-color: var(--plum-700); animation: spin 0.9s linear infinite; display: inline-block; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sk { display: block; }
  .stack-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--surface-3); }
  .stack-bar i { display: block; height: 100%; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .pchk { display: flex; align-items: center; gap: 10px; padding: 9px 0; font-size: 13px; }
  .pchk .bx { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--ink-4); }
  .pchk.d .bx { background: var(--ok); color: var(--on-accent); }
  .pchk.d { color: var(--ink-2); }
  .pchk.n { font-weight: 800; }
  .pchk.w { color: var(--ink-4); }
  .phase { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--ink-3); margin: 6px 0 2px; letter-spacing: .02em; }
  .orb { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; font-size: 40px; background: radial-gradient(circle at 35% 30%, var(--surface), var(--mac-lav) 70%); animation: orb 2.4s var(--ease) infinite; margin: 0 auto; }
  @keyframes orb { 50% { box-shadow: 0 0 0 14px color-mix(in srgb, var(--plum-300) 22%, transparent); } }

  /* 名片复核：行式 */
  .frow { display: grid; grid-template-columns: 96px 10px 1fr auto; gap: 10px; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .frow .k { font-size: 12px; color: var(--ink-3); }
  .frow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .frow .dot.lo { background: var(--coral); } .frow .dot.mid { background: var(--plum-300); }
  .frow b { font-weight: 700; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow.edit { background: var(--surface-2); border-radius: 12px; border-bottom-color: transparent; box-shadow: inset 0 0 0 1.5px var(--plum-500); }
  .strip { display: flex; gap: 8px; align-items: center; }
  .strip .tp { width: 50px; opacity: .55; }
  .strip .tp.cur { opacity: 1; box-shadow: 0 0 0 2px var(--plum-500); }
  .strip .tp.dn { opacity: 1; }
  .strip .tp.dn + .ckm, .ckm { display: none; }

  /* 合并 */
  .mg-row { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .mg-row .k { font-size: 11.5px; color: var(--ink-3); margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }
  .mg-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mopt { border-radius: 14px; background: var(--surface); padding: 10px 11px 10px 32px; font-size: 12.5px; font-weight: 700; position: relative; border: 1.5px solid transparent; min-height: 42px; display: flex; align-items: center; word-break: break-all; line-height: 1.4; }
  .card .mopt, .modal .mopt { background: var(--surface-2); }
  .mopt::before { content: ""; position: absolute; left: 11px; top: 50%; margin-top: -8px; width: 16px; height: 16px; border-radius: 50%; border: 1.8px solid var(--ink-4); box-sizing: border-box; }
  .mopt.on { border-color: var(--plum-500); background: var(--accent-soft); }
  .mopt.on::before { border: 5px solid var(--plum-700); }
  .mopt.none { color: var(--ink-4); font-weight: 500; }
  .mopt.same { grid-column: span 2; padding-left: 12px; }
  .mopt.same::before { display: none; }

  /* 匹配确认 */
  .mc { background: var(--surface); border-radius: 22px; padding: 14px; transition: opacity .25s, background .25s; }
  .mc + .mc { margin-top: 10px; }
  .wgrid > .card > .mc { flex: 1; }
  .card .mc { background: var(--surface-2); }
  .mc .val { font-size: 13px; font-weight: 700; line-height: 1.55; margin-top: 10px; display: flex; gap: 6px; }
  .mc .val::before { content: "力になれること"; flex: none; font-size: 10px; font-weight: 800; color: var(--mac-teal-ink); background: var(--mac-teal); border-radius: 6px; padding: 1px 6px; height: fit-content; margin-top: 2px; }
  .mc.yes { box-shadow: inset 0 0 0 1.5px var(--plum-500); }
  .mc.no { opacity: .45; }
  .yn { display: flex; gap: 8px; }
  .yn button { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); transition: transform .15s var(--ease); }
  .card .yn button { background: var(--surface); }
  .yn button.y { background: var(--ink); color: var(--bg); }
  .yn button.y.on { background: var(--plum-700); color: var(--on-accent); }
  .yn button:active { transform: scale(.9); }

  /* 示例横条 */
  .samplebar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: var(--mac-apricot); color: var(--mac-apricot-ink); font-size: 11.5px; font-weight: 700; margin-bottom: 10px; }
  .samplebar .btn { background: var(--surface); color: var(--ink); }
  .samplebar .x { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--mac-apricot-ink); flex: none; }
  .wsample { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 16px; border-radius: 18px; background: var(--mac-apricot); color: var(--mac-apricot-ink); font-size: 13px; font-weight: 700; margin-bottom: 18px; }
  .spill { display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px 6px 9px; border-radius: 999px; background: var(--mac-apricot); color: var(--mac-apricot-ink); font-size: 11.5px; font-weight: 800; }
  .phone .spill.fl { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); z-index: 45; box-shadow: var(--shadow-float); }

  /* 权限 */
  .perm-art { width: 132px; height: 132px; border-radius: 40px; display: grid; place-items: center; font-size: 60px; margin: 30px auto 22px; position: relative; }
  .perm-li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; font-size: 13.5px; line-height: 1.55; }
  .perm-li + .perm-li { border-top: 1px solid var(--line); }
  .perm-li .lbtn { width: 30px; height: 30px; }

  /* 上传 */
  .dropbig { border: 2px dashed var(--plum-300); border-radius: 26px; background: color-mix(in srgb, var(--accent-soft) 55%, transparent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 40px; }
  .dropbig.hover { border-color: var(--plum-700); background: var(--accent-soft); }
  .pairs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .pair { background: var(--surface-2); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; position: relative; }
  .pair .ph { display: flex; gap: 5px; }
  .pair .ph .tp { width: auto; flex: 1; }
  .pair .ph .tp.none { background: transparent; box-shadow: none; border: 1.5px dashed var(--ink-4); }
  .pair .ph .tp.none::before, .pair .ph .tp.none::after { display: none; }
  .pair .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pair.warn { box-shadow: inset 0 0 0 1.5px var(--coral); }
  .pair.drag { transform: rotate(-3deg) translateY(-4px); box-shadow: var(--shadow-float); background: var(--surface); }
  .sticky-bar { display: flex; align-items: center; gap: 14px; padding: 14px 16px 14px 22px; border-radius: 22px; background: var(--ink); color: var(--bg); }
  .sticky-bar .lbl { color: color-mix(in srgb, var(--bg) 65%, transparent); }
  .sticky-bar .btn { background: var(--bg); color: var(--ink); }
  /* V2KIT-CSS-BEGIN */
  /* ===== プラン v2 口径（2026-10-07）：视觉与数字与 b9-import-plan-v2.html 一致；类名加 v2 前缀避免与本页私有类冲突 ===== */
  .v2bar { display: flex; gap: 3px; height: 14px; position: relative; margin-top: 18px; }
  .v2bar.thin { height: 8px; gap: 2px; margin-top: 12px; }
