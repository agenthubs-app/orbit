<script>

];

/* ============================================================

function errNotEvent() {
  return topbar('イベント評価', 'イベントページではないようです', close) + `
  <div class="card rise"><div class="lbl">貼り付けたURL</div>
    <div class="input fill" style="margin-top:6px">${ic('link', 'sm')}<span class="ell">https://note.example/cfo-yamada/n/series-a</span></div>

document.addEventListener('click', e => {

/* スコア回写动画：46 → 56 */
function progAnim(root = document) {
  root.querySelectorAll('.bar2 .add').forEach(b => { b.style.width = '0'; });
  root.querySelectorAll('.cntfrom').forEach(el => { el.textContent = el.dataset.from; });
  setTimeout(() => {
    root.querySelectorAll('.bar2 .add').forEach(b => { b.style.width = b.dataset.w + '%'; });
    root.querySelectorAll('.cntfrom').forEach(el => {
      const a = +el.dataset.from, z = +el.dataset.to, t0 = performance.now(), d = 1200;
      const step = t => { const p = Math.min(1, (t - t0) / d), k = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(a + (z - a) * k); if (p < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  }, 450);
}
window.addEventListener('load', () => progAnim());
document.querySelectorAll('[data-ctl="theme"] button').forEach(b => b.addEventListener('click', () => progAnim()));
