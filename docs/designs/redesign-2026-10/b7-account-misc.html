<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⑦ アカウント + 補遺</title>
<link rel="stylesheet" href="kit/tokens.css">
<link rel="stylesheet" href="kit/ui.css">
<script src="kit/kit.js"></script>
<script src="kit/data.js"></script>
<style>
  .doc { min-width: 1520px; }
  .score { font-family: var(--font-num); font-weight: 800; }
  .btn.xl { height: 50px; font-size: 14.5px; }
  .btn.dis { opacity: .4; pointer-events: none; }
  .phone .foot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; padding: 22px 18px 30px; background: linear-gradient(to bottom, transparent, var(--bg) 28%); display: grid; gap: 6px; }
  .h1 { font-size: 23px; font-weight: 900; line-height: 1.35; letter-spacing: -.01em; }
  .center { text-align: center; }
  .caret { display: inline-block; width: 2px; height: 17px; background: var(--plum-700); animation: blink 1s steps(1) infinite; vertical-align: middle; margin-left: 1px; }
  @keyframes blink { 50% { opacity: 0; } }

  /* 开关 / 勾选 / 单选 */
  .opt { display: flex; gap: 10px; align-items: center; padding: 11px 2px; font-size: 13.5px; font-weight: 600; }
  .opt + .opt { border-top: 1px solid var(--line); }
  .actsheet .shead { text-align: center; }
  .actsheet .shead .emo { display: inline-grid; background: var(--coral-soft); color: var(--coral); }
  .draft-note { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 8px; font-size: 11.5px; color: var(--ink-3); }
  .draft-note.l { justify-content: flex-start; } .draft-note.r { justify-content: flex-end; }
  .steps { display: flex; gap: 6px; margin: 2px 0 14px; }
  .steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-3); }
  .steps i.d { background: var(--plum-700); }

  /* 设置分组 */
  .glbl { font-size: 11.5px; font-weight: 700; color: var(--ink-3); margin: 18px 6px 8px; letter-spacing: .04em; }
  .sgroup { background: var(--surface); border-radius: var(--r-xl); padding: 2px 16px; }
  .srow { display: flex; align-items: center; gap: 12px; padding: 11px 0; position: relative; }
  .srow + .srow::before { content: ""; position: absolute; top: 0; left: 46px; right: 0; height: 1px; background: var(--line); }
  .srow .meta { flex: 1; min-width: 0; }
  .srow .meta b { display: block; font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow .meta span { display: block; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow .end { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); flex: none; }
  .srow.danger b { color: var(--coral); }
  .orow { display: grid; grid-template-columns: 76px 1fr; gap: 10px; padding: 9px 0; font-size: 13px; align-items: start; }
  .orow + .orow { border-top: 1px solid var(--line); }
  .orow .lbl { padding-top: 1px; }

  /* 表单 */
  .fld + .fld { margin-top: 12px; }
  .grid2 > .fld, .grid3 > .fld { margin-top: 0; }
  .fld .lbl { display: block; margin: 0 4px 5px; }
  .req { color: var(--coral); margin-left: 2px; }
  .fld .input { color: var(--ink); font-weight: 600; background: var(--surface); }
  .card .fld .input, .drawer .fld .input, .wmodal .fld .input, .sheet .fld .input { background: var(--surface-2); }
  .fld .input.sel { justify-content: space-between; }
  .fld .input.ph { color: var(--ink-4); font-weight: 500; letter-spacing: .03em; }
  .fld .input.focus { box-shadow: inset 0 0 0 1.5px var(--plum-500); }
  .fld .input.area { height: auto; min-height: 74px; align-items: flex-start; padding: 11px 14px; line-height: 1.65; }
  .fld .input .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pick { display: flex; align-items: center; gap: 10px; padding: 10px 4px; font-size: 13px; font-weight: 600; }
  .pick + .pick { border-top: 1px solid var(--line); }
  .pick .ck { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; border: 1.8px solid var(--ink-4); display: grid; place-items: center; flex: none; }
  .pick.on .ck { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .casc { display: grid; grid-template-columns: 128px 1fr; gap: 10px; margin-top: 12px; }
  .casc .c1 > div { padding: 9px 10px; border-radius: 12px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); display: flex; justify-content: space-between; align-items: center; }
  .casc .c1 > div.on { background: var(--surface-2); color: var(--ink); }
  .casc .c2 { border-left: 1px solid var(--line); padding-left: 10px; }
  .cascpop { position: absolute; left: 0; top: 72px; width: 450px; z-index: 5; background: var(--surface); border-radius: 20px; padding: 12px; box-shadow: var(--shadow-float); border: 1px solid var(--line); }
  .cascpop .casc { margin-top: 0; grid-template-columns: 170px 1fr; }
  .duphint { display: flex; gap: 8px; align-items: center; padding: 9px 12px; border-radius: 14px; background: var(--mac-apricot); color: var(--mac-apricot-ink); font-size: 11.5px; font-weight: 700; margin-top: 10px; }
  .dupcmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .dc { background: var(--surface-2); border-radius: 16px; padding: 12px; font-size: 12.5px; }
  .dc .diff { color: var(--coral); font-weight: 700; }

  .setgrid { display: grid; grid-template-columns: 220px 1fr; gap: 22px; align-items: start; }
  .smenu { background: var(--surface); border-radius: 22px; padding: 8px; display: grid; gap: 2px; }
  .smenu a { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .smenu a.on { background: var(--surface-2); color: var(--ink); }
  .smenu a.danger { color: var(--coral); }
  .smenu hr { border: 0; height: 1px; background: var(--line); margin: 6px 10px; }
  /* 弹层（.toast .dialog .actsheet .wmodal .drawer .overlay 用 kit；此处只留锚定弹出层） */
  .pop { position: absolute; z-index: 21; background: var(--surface); border-radius: 22px; padding: 16px; box-shadow: var(--shadow-float); border: 1px solid var(--line); }

  /* iOS 系统样式拟真 */
  .ios { position: absolute; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--surface); border-radius: 30px 30px 0 0; padding: 18px 20px 40px; }
  .igrp { background: var(--surface-2); border-radius: 12px; }
  .irow { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; font-size: 13px; gap: 10px; }
  .irow + .irow { border-top: 1px solid var(--line); }
  .irow b { font-weight: 600; }
  .appicon { width: 60px; height: 60px; border-radius: 14px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 900; font-size: 26px; flex: none; }
  .appicon.sm { width: 30px; height: 30px; border-radius: 8px; font-size: 14px; }
  .xcirc { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-3); }
  .dbl { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 18px; font-size: 13px; color: var(--ink-2); }
  .faceid { width: 46px; height: 46px; color: var(--plum-700); }
  .sidebtn { position: absolute; right: 0; top: 190px; width: 5px; height: 80px; border-radius: 3px 0 0 3px; background: var(--plum-500); z-index: 60; animation: sideP 1.1s var(--ease) infinite; }
  @keyframes sideP { 50% { opacity: .35; } }
  .sidelbl { position: absolute; right: 14px; top: 206px; z-index: 60; font-size: 11px; font-weight: 800; text-align: right; color: var(--on-accent); background: var(--plum-700); padding: 6px 9px; border-radius: 10px; line-height: 1.35; }
  .ialert { position: absolute; left: 62px; right: 62px; top: 300px; z-index: 52; background: var(--surface); border-radius: 18px; text-align: center; overflow: hidden; }
  .ialert .tx { padding: 18px 16px 14px; font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }
  .ialert .tx b { display: block; font-size: 15px; color: var(--ink); margin-bottom: 4px; }
  .ialert .bt { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
  .ialert .bt span { padding: 12px 0; font-size: 15px; color: var(--mac-blue-ink); }
  .ialert .bt span + span { border-left: 1px solid var(--line); font-weight: 700; }
  .sysbg { background: var(--surface-2); }
  .ilist { background: var(--surface); border-radius: 12px; margin-top: 8px; }
  .ilist .irow { padding: 13px 14px; font-size: 14px; }
  .ihd { font-size: 12px; color: var(--ink-3); margin: 18px 14px 0; }

  /* 订阅 */
  .unl { display: grid; grid-template-columns: 1fr auto 14px auto; gap: 8px; align-items: center; padding: 9px 0; font-size: 13px; }
  .unl + .unl { border-top: 1px solid var(--line); }
  .unl s { color: var(--ink-3); font-size: 12px; }
  .unl b { font-family: var(--font-num); }
  .lose { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; padding: 9px 0; font-size: 12.5px; }
  .lose + .lose { border-top: 1px solid var(--line); }
  .lose .a { color: var(--ink); font-weight: 700; }
  .lose .b { color: var(--ink-3); }
  .paybar { display: flex; gap: 10px; align-items: center; padding: 11px 14px; border-radius: 16px; background: var(--coral-soft); font-size: 12.5px; font-weight: 700; color: var(--ink); }
  .gbar { display: flex; gap: 12px; align-items: center; padding: 11px 16px; border-radius: 16px; background: var(--coral-soft); font-size: 13px; font-weight: 700; margin-bottom: 18px; }
  .tline { display: grid; grid-template-columns: 14px 1fr; gap: 10px; position: relative; padding-bottom: 14px; font-size: 12.5px; }
  .tline:not(:last-child)::before { content: ""; position: absolute; left: 6px; top: 14px; bottom: 0; width: 2px; background: var(--surface-3); }
  .tline i { width: 14px; height: 14px; border-radius: 50%; background: var(--surface-3); margin-top: 3px; }
  .tline i.d { background: var(--plum-700); } .tline i.w { background: var(--coral); }
  .tline b { display: block; font-size: 13px; }
  .tier { border-radius: 18px; padding: 14px; background: var(--surface-2); border: 2px solid transparent; }
  .tier.on { border-color: var(--plum-500); background: var(--surface); }
  .ckout { display: grid; grid-template-columns: 1fr 460px; gap: 22px; align-items: start; }
  .terms { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; font-size: 12px; }
  .terms span { color: var(--ink-3); }

  /* 导出 */
  .xrow { display: flex; gap: 12px; align-items: center; padding: 12px 0; }
  .xrow + .xrow { border-top: 1px solid var(--line); }
  .xrow .meta { flex: 1; min-width: 0; }
  .xrow .meta b { display: block; font-size: 13.5px; }
  .file { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 18px; background: var(--surface-2); }
  .file .fi { width: 44px; height: 52px; border-radius: 10px; background: var(--surface); display: grid; place-items: center; font-size: 10px; font-weight: 900; color: var(--plum-700); flex: none; }

  /* 公开页 */
  .pubweb { display: block !important; }
  .pubtop { height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 40px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 55%, transparent); }
  .logo-s { width: 32px; height: 32px; border-radius: 10px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 900; font-size: 14px; flex: none; }
  .pubweb > .main { height: 896px; padding: 34px 110px 60px; }
  .ptop { display: flex; align-items: center; gap: 10px; padding: 4px 0 16px; }
  .hostav { width: 92px; height: 92px; border-radius: 30px; font-size: 46px; display: grid; place-items: center; background: var(--mac-lav); flex: none; }
  .hostav.sm { width: 64px; height: 64px; font-size: 32px; border-radius: 22px; }
  .stat { background: var(--surface-2); border-radius: 16px; padding: 10px 14px; }
  .stat b { display: block; font-family: var(--font-num); font-size: 22px; font-weight: 800; line-height: 1.2; }
  .pev { background: var(--surface); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; }
  .pev .push { margin-top: auto; }
  .past { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 18px; background: var(--surface); }
  .urlbar { position: absolute; left: 14px; right: 14px; bottom: 30px; height: 46px; border-radius: 18px; z-index: 30; background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-line); box-shadow: var(--shadow-float); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: var(--ink-2); }

  /* 面谈 */
  .tp { font-family: var(--font-num); font-weight: 800; font-size: 13px; padding: 6px 12px; border-radius: 12px; background: var(--surface-2); }
  .talk { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; font-size: 13px; }
  .talk + .talk { border-top: 1px solid var(--line); }
  .talk .n { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 11px; font-weight: 800; }
  .talk .why-body { grid-column: 2 / 4; margin-top: 2px; }
  .slot { display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 16px; background: var(--surface-2); border: 2px solid transparent; font-size: 13px; }
  .slot + .slot { margin-top: 8px; }
  .slot.on { border-color: var(--plum-500); background: var(--surface); }
  .conflict .lic { color: var(--coral); }
  .conflict { display: flex; gap: 10px; align-items: center; padding: 11px 14px; border-radius: 16px; background: var(--coral-soft); font-size: 12.5px; }
  .draftbox { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; font-size: 12.5px; line-height: 1.7; color: var(--ink-2); margin-top: 8px; }

  /* 资料更新 */
  .sgcard { background: var(--surface); border-radius: 22px; padding: 14px 16px; }
  .sgcard + .sgcard { margin-top: 12px; }
  .wgrid > .sgcard { margin-top: 0; }
  .sgr { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; }
  .sgr + .sgr { border-top: 1px solid var(--line); }
  .sgr .k { font-size: 11px; color: var(--ink-3); font-weight: 700; }
  .sgr .cv { font-size: 12.5px; line-height: 1.5; min-width: 0; }
  .sgr .cv s { color: var(--ink-3); display: block; }
  .sgr .cv b { display: block; }
  .sgr.yes { opacity: .55; } .sgr.no .cv b { text-decoration: line-through; color: var(--ink-3); }
  .yn { display: flex; gap: 6px; }
  .yn button { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-3); }
  .yn button.on { background: var(--ink-3); color: var(--surface); }
  .yn button.y.on { background: var(--ink); color: var(--bg); }
  .sgw { display: grid; grid-template-columns: 110px 1fr 24px 1fr auto; gap: 12px; align-items: center; padding: 11px 0; font-size: 13px; }
  .sgw + .sgw { border-top: 1px solid var(--line); }
  .sgw s { color: var(--ink-3); }
  .sgw.yes { opacity: .55; } .sgw.no b { text-decoration: line-through; color: var(--ink-3); }

  /* 帮助等 */
  .cat6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cat6 > div { background: var(--surface); border-radius: 18px; padding: 12px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; text-align: center; }
  .faq { padding: 12px 0; font-size: 13px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
  .faq + .faq { border-top: 1px solid var(--line); }
  .faq span { flex: 1; }
  .bigemo { font-size: 64px; line-height: 1; }
  .attach { width: 64px; height: 64px; border-radius: 14px; border: 1.5px dashed var(--surface-3); display: grid; place-items: center; color: var(--ink-3); }
  .shot { width: 64px; height: 64px; border-radius: 14px; background: linear-gradient(160deg, var(--plum-100), var(--rose-100)); position: relative; }

  /* 灵动岛 / Live Activity（系统硬件色为固定值） */
  .phone { --di-bg: #000; --di-ink: #F5F2F8; --di-ink2: rgba(245, 242, 248, .58); --di-acc: #CFC4E6; --di-rose: #EBC4CD; --di-track: rgba(255, 255, 255, .16); }
  .wall { position: absolute; inset: 0; z-index: 1; background:
      radial-gradient(260px 260px at 15% 20%, #d9c9f2, transparent 70%),
      radial-gradient(300px 300px at 90% 35%, #f6cbd8, transparent 70%),
      radial-gradient(320px 320px at 40% 85%, #c9dcf4, transparent 70%),
      linear-gradient(160deg, #efe7f6, #f8e9ee 50%, #e5edf8); }
  [data-theme="dark"] .wall { background:
      radial-gradient(260px 260px at 15% 20%, #4b3d6b, transparent 70%),
      radial-gradient(300px 300px at 90% 35%, #5e3646, transparent 70%),
      radial-gradient(320px 320px at 40% 85%, #2c3f5e, transparent 70%),
      linear-gradient(160deg, #1d1a26, #241b22 50%, #161c27); }
  .lk { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; padding-top: 70px; }
  .lk .date { font-size: 18px; font-weight: 700; opacity: .8; }
  .lk .time { font-family: var(--font-num); font-size: 90px; font-weight: 800; line-height: 1; letter-spacing: -.03em; }
  .la { position: absolute; left: 12px; right: 12px; bottom: 122px; border-radius: 24px; padding: 14px 16px; z-index: 4;
    background: rgba(255,255,255,.5); backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5); border: 1px solid rgba(255,255,255,.55); }
  [data-theme="dark"] .la { background: rgba(40,36,48,.55); border-color: rgba(255,255,255,.1); }
  .la .n { font-family: var(--font-num); font-weight: 800; letter-spacing: -.02em; }
  .la .bar { background: rgba(120,100,150,.2); }
  .lkbtns { position: absolute; left: 44px; right: 44px; bottom: 40px; display: flex; justify-content: space-between; z-index: 4; }
  .lkbtns span { width: 50px; height: 50px; border-radius: 50%; background: var(--glass); display: grid; place-items: center; }
  .hsg { position: absolute; inset: 70px 18px 0; z-index: 2; display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px 0; align-content: start; }
  .hsg .app { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; }
  .hsg .app i { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; font-size: 27px; font-style: normal; background: rgba(255,255,255,.65); }
  [data-theme="dark"] .hsg .app i { background: rgba(60,56,70,.65); }
  .dyn { position: absolute; left: 50%; top: 11px; transform: translateX(-50%); z-index: 60; background: var(--di-bg); color: var(--di-ink); border-radius: 22px; }
  .dyn.cmp { height: 36px; width: 236px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 8px; font-size: 13px; font-weight: 800; }
  .dyn.exp { top: 8px; width: 372px; border-radius: 46px; padding: 16px 20px 18px; }
  .dyn .dl { color: var(--di-ink2); font-size: 11.5px; font-weight: 600; }
  .dyn .dn { font-family: var(--font-num); font-weight: 800; letter-spacing: -.02em; }
  .dyn .dbtn { height: 36px; border-radius: 999px; background: rgba(255,255,255,.14); color: var(--di-ink); font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; }
  .dyn .dbtn.acc { background: var(--di-acc); color: #241D33; }
  .dyn .dtr { height: 5px; border-radius: 3px; background: var(--di-track); position: relative; overflow: hidden; }
  .dyn .dtr i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--di-acc); }
  .dav { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 800; background: var(--di-acc); color: #241D33; flex: none; }
  .dav.r { background: var(--di-rose); }
  .davs { display: flex; } .davs .dav { margin-left: -7px; box-shadow: 0 0 0 2px var(--di-bg); } .davs .dav:first-child { margin-left: 0; }
  .spec { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; width: 1240px; background: var(--surface); border-radius: 24px; padding: 22px; }
  .spec .cell { background: var(--surface-2); border-radius: 18px; padding: 16px; display: grid; gap: 14px; justify-items: center; }
  .spec .dyn { position: relative; left: auto; top: auto; transform: none; }
  .spec .mini { width: 36px; height: 36px; border-radius: 50%; background: var(--di-bg); color: var(--di-ink); display: grid; place-items: center; font-size: 15px; }
  .spec { --di-bg: #000; --di-ink: #F5F2F8; --di-ink2: rgba(245, 242, 248, .58); --di-acc: #CFC4E6; --di-rose: #EBC4CD; --di-track: rgba(255, 255, 255, .16); }

  /* NFC 网页互换 */
  .ncard { border-radius: 22px; padding: 18px; background: linear-gradient(140deg, var(--mac-lav), var(--surface) 70%); position: relative; overflow: hidden; }
  .ncard::after { content: ""; position: absolute; width: 160px; height: 160px; right: -60px; bottom: -70px; border-radius: 50%; background: radial-gradient(circle, var(--mac-pink), transparent 70%); }
