<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>新用户引导 · 欢迎</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;background:#FFFFFF;color:#0B1220}
a{color:#0A5CFF}a:hover{color:#084FDE}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; padding: 60px 16px 34px 16px">
  <div style="font-size: 26px; font-weight: 900; letter-spacing: -0.8px">Orbit<span style="color: #0A5CFF">.</span></div>
  <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 56px">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.96px; color: #437563">账号已创建</div>
    <div style="font-size: 34px; line-height: 42px; font-weight: 900; letter-spacing: -0.8px">先让 iOrbit<br>认识你。</div>
    <div style="font-size: 15px; line-height: 23px; color: #3C4658">大约 2 分钟。即使你现在一个联系人都没有，iOrbit 也能告诉你该去哪场活动、先认识谁、从什么话题开始。</div>
  </div>
  <div style="display: flex; flex-direction: column; margin-top: 36px; border-top: 1px solid #EEF0F4">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 14px; min-height: 52px; border-bottom: 1px solid #EEF0F4">
        <div style="width: 20px; font-size: 13px; font-weight: 800; color: #8B93A5; font-variant-numeric: tabular-nums">{{s.no}}</div>
        <div style="flex-grow: 1; font-size: 15px; font-weight: 600">{{s.title}}</div>
        <div style="font-size: 13px; color: #6B7280">{{s.hint}}</div>
      </div>
    </sc-for>
  </div>
  <div style="flex-grow: 1"></div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <a href="OnbProfile.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 12px; background: #0B1220; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none">开始设置</a>
    <a href="LiveEntry.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 15px; font-weight: 600; text-decoration: none">先随便看看</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      steps: [
        { no: '01', title: '告诉我们你是谁', hint: '30 秒' },
        { no: '02', title: '你最近想推进什么', hint: '30 秒' },
        { no: '03', title: '你能提供什么、在找什么', hint: '30 秒' },
        { no: '04', title: 'iOrbit 帮你写自我介绍', hint: 'AI 生成' },
        { no: '05', title: '带入已有人脉', hint: '可跳过' }
      ]
    };
  }
}
</script>
</body>
</html>
