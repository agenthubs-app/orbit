<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>活动现场 · 首页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;background:#FFFFFF;color:#0B1220}
a{color:#0A5CFF}a:hover{color:#084FDE}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column">
  <div style="padding: 54px 16px 0 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
      <a href="LiveEntry.dc.html" style="display: flex; align-items: center; gap: 2px; font-size: 16px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A5CFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>活动详情</a>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.96px; color: #437563"><div style="width: 7px; height: 7px; border-radius: 999px; background: #437563"></div>现场</div>
    </div>
    <div style="font-size: 22px; line-height: 30px; font-weight: 800">东京 AI 产品增长夜</div>
    <div style="display: flex; gap: 6px; border-bottom: 1px solid #E6E8EE; margin-top: 6px">
      <a href="LiveHome.dc.html" style="min-height: 44px; display: flex; align-items: flex-end; margin-bottom: -1px; text-decoration: none"><span style="padding: 10px 6px; border-bottom: 2px solid #0B1220; font-size: 14px; line-height: 20px; font-weight: 800; color: #0B1220">首页</span></a>
      <a href="LiveRec.dc.html" style="min-height: 44px; display: flex; align-items: flex-end; margin-bottom: -1px; text-decoration: none"><span style="padding: 10px 6px; font-size: 14px; line-height: 20px; color: #6B7280">推荐</span></a>
      <a href="LiveAll.dc.html" style="min-height: 44px; display: flex; align-items: flex-end; margin-bottom: -1px; text-decoration: none"><span style="padding: 10px 6px; font-size: 14px; line-height: 20px; color: #6B7280">参会者</span></a>
      <a href="LiveGroup.dc.html" style="min-height: 44px; display: flex; align-items: flex-end; margin-bottom: -1px; text-decoration: none"><span style="padding: 10px 6px; font-size: 14px; line-height: 20px; color: #6B7280">分组</span></a>
      <a href="LiveAgenda.dc.html" style="min-height: 44px; display: flex; align-items: flex-end; margin-bottom: -1px; text-decoration: none"><span style="padding: 10px 6px; font-size: 14px; line-height: 20px; color: #6B7280">议程</span></a>
    </div>
  </div>
  <div style="flex-grow: 1; overflow: hidden; padding: 20px 16px 0 16px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.96px; color: #6B7280">你现在的位置</div>
      <div style="display: flex; align-items: baseline; gap: 12px">
        <div style="font-size: 64px; line-height: 70px; font-weight: 900; letter-spacing: -2px">3 号桌</div>
        <div style="font-size: 15px; color: #6B7280">第 2 轮 · 6 人</div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#437563" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
        <span style="font-size: 15px; color: #437563; font-weight: 600">已完成签到</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 8px; border-bottom: 1px solid #EEF0F4">
        <div style="font-size: 15px; line-height: 22px; font-weight: 800">推荐给你</div>
        <a href="LiveRec.dc.html" style="font-size: 14px; font-weight: 600; text-decoration: none">全部 ›</a>
      </div>
      <sc-for list="{{recs}}" as="r" hint-placeholder-count="3">
        <a href="LivePerson.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; border-bottom: 1px solid #EEF0F4; text-decoration: none; color: #0B1220">
          <div style="width: 40px; height: 40px; border-radius: 999px; background: #EEF0F4; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; color: #3C4658">{{r.initial}}</div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; line-height: 20px; font-weight: 700">{{r.name}}</span>
            <span style="font-size: 13px; line-height: 18px; color: #6B7280">{{r.role}}</span>
          </div>
          <span style="font-size: 13px; font-weight: 800; color: #0B1220; font-variant-numeric: tabular-nums">{{r.match}}</span>
        </a>
      </sc-for>
    </div>
    <a href="LiveAgenda.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; border-bottom: 1px solid #EEF0F4; text-decoration: none; color: #0B1220">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700">关系图谱</span>
        <span style="font-size: 13px; color: #6B7280">现场已认识 4 人 · 推荐认识 6 人</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B93A5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { recs: [
      { initial: '佐', name: '佐藤真理', role: '企业协作工具 · 增长负责人', match: '92%' },
      { initial: '陈', name: '陈以宁', role: '日本市场 · 早期投资人', match: '86%' },
      { initial: '山', name: '山本健', role: '企业软件投资人 · 大阪', match: '81%' }
    ] };
  }
}
</script>
</body>
</html>
