</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column">
  <div style="padding: 54px 16px 0 16px; display: flex; flex-direction: column; gap: 6px">

      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.96px; color: #437563"><div style="width: 7px; height: 7px; border-radius: 999px; background: #437563"></div>现场</div>
    </div>
    <div style="font-size: 22px; line-height: 30px; font-weight: 800">东京 AI 产品增长夜</div>
    <div style="display: flex; gap: 6px; border-bottom: 1px solid #E6E8EE; margin-top: 6px">

      <a href="LiveGroup.dc.html" style="min-height: 44px; display: flex; align-items: flex-end; margin-bottom: -1px; text-decoration: none"><span style="padding: 10px 6px; font-size: 14px; line-height: 20px; color: #6B7280">分组</span></a>
      <a href="LiveAgenda.dc.html" style="min-height: 44px; display: flex; align-items: flex-end; margin-bottom: -1px; text-decoration: none"><span style="padding: 10px 6px; font-size: 14px; line-height: 20px; color: #6B7280">议程</span></a>
    </div>
  </div>
  <div style="flex-grow: 1; overflow: hidden; padding: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; background: #F5F7FA; border-radius: 12px; padding: 0 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden">搜索参会者</label>
      <input id="q" placeholder="搜索姓名、公司、职位" style="flex-grow: 1; border: none; outline: none; font-size: 15px; font-family: inherit; background: transparent">
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.96px; color: #6B7280">全部参会者</div>
      <div style="font-size: 12px; font-weight: 700; color: #0A5CFF; font-variant-numeric: tabular-nums">[N]</div>
    </div>
    <div style="display: flex; flex-direction: column; border-top: 1px solid #EEF0F4">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="6">
        <a href="LivePerson.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 62px; border-bottom: 1px solid #EEF0F4; text-decoration: none; color: #0B1220">
          <div style="width: 40px; height: 40px; border-radius: 999px; background: #EEF0F4; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; color: #3C4658">{{p.initial}}</div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; line-height: 20px; font-weight: 700">{{p.name}}</span>
            <span style="font-size: 13px; line-height: 18px; color: #6B7280">{{p.role}}</span>
          </div>
          <span style="{{p.tagStyle}}">{{p.tag}}</span>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>

      { initial: '[', name: '[更多参会者]', role: '分页加载', tag: '', tagStyle: none }
    ] };
  }
}
</script>

</html>
