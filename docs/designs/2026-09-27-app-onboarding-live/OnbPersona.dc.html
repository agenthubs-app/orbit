<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>新用户引导 · 提供与寻找</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;background:#FFFFFF;color:#0B1220}
a{color:#0A5CFF}a:hover{color:#084FDE}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column">
  <div style="padding: 54px 16px 0 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
      <a href="OnbGoals.dc.html" style="display: flex; align-items: center; gap: 2px; font-size: 16px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A5CFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>上一步</a>
      <div style="font-size: 13px; color: #6B7280; font-variant-numeric: tabular-nums">3 / 5</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
      <div style="height: 3px; border-radius: 999px; background: #0B1220"></div>
      <div style="height: 3px; border-radius: 999px; background: #0B1220"></div>
      <div style="height: 3px; border-radius: 999px; background: #0B1220"></div>
      <div style="height: 3px; border-radius: 999px; background: #EEF0F4"></div>
      <div style="height: 3px; border-radius: 999px; background: #EEF0F4"></div>
    </div>
  </div>
  <div style="flex-grow: 1; overflow: hidden; padding: 22px 16px 0 16px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 30px; line-height: 38px; font-weight: 900; letter-spacing: -0.6px">你能提供什么，<br>在找什么？</div>
      <div style="font-size: 15px; line-height: 23px; color: #3C4658">好的关系是双向的。这两组词决定谁会被推荐给你，你又会被推荐给谁。</div>
    </div>
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <div style="font-size: 15px; line-height: 22px; font-weight: 800">{{sec.title}}</div>
          <div style="font-size: 12px; color: #6B7280">{{sec.meta}}</div>
        </div>
        <sc-if value="{{sec.ai}}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 13px; line-height: 20px; color: #437563">iOrbit 根据你的目标预选了 2 项，可以改。</div>
        </sc-if>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{sec.items}}" as="c" hint-placeholder-count="6">
            <button type="button" style="{{c.style}}">{{c.label}}</button>
          </sc-for>
          <button type="button" style="min-height: 44px; padding: 8px 12px; border-radius: 12px; border: 1px dashed #B9BDC4; background: #FFFFFF; color: #3C4658; font-size: 13px; font-weight: 600; font-family: inherit">+ 自定义</button>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="padding: 12px 16px 34px 16px">
    <a href="OnbIntro.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 12px; background: #0B1220; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none">继续</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = 'min-height: 44px; padding: 8px 12px; border-radius: 12px; border: none; background: #0B1220; color: #FFFFFF; font-size: 13px; font-weight: 600; font-family: inherit';
    const off = 'min-height: 44px; padding: 8px 12px; border-radius: 12px; border: none; background: #F5F7FA; color: #3C4658; font-size: 13px; font-weight: 600; font-family: inherit';
    const c = (label, sel) => ({ label, style: sel ? on : off });
    return {
      sections: [
        { title: '我能提供', meta: '最多 5 项', ai: false, items: [c('产品与技术咨询', true), c('中国市场资源', true), c('行业经验', false), c('客户引荐', false), c('创业辅导', false)] },
        { title: '我在寻找', meta: '最多 5 项', ai: true, items: [c('潜在客户', true), c('渠道合作伙伴', true), c('出海合作伙伴', false), c('投资人', false), c('行业导师', false)] },
        { title: '想聊的话题', meta: '可选', ai: false, items: [c('生成式 AI', true), c('日本市场', false), c('SaaS 与企业服务', false)] }
      ]
    };
  }
}
</script>
</body>
</html>
